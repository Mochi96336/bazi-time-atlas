<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>390px linked boundary drag harness</title>
  <style>
    html, body { margin:0; width:390px; background:#0b0f0c; }
    .stage { display:block; width:390px; height:844px; border:0; opacity:0; pointer-events:none; }
    #probe { display:none; }
  </style>
</head>
<body>
  <iframe id="month-frame" class="stage" title="Month linked boundary drag"></iframe>
  <iframe id="year-frame" class="stage" title="Year linked boundary drag"></iframe>
  <iframe id="solar-frame" class="stage" title="Solar linked wrap drag"></iframe>
  <output id="probe" data-ready="false"></output>

  <script type="module">
    import { apparentSolarLongitude } from "../../src/astronomy/solar-longitude.js";
    import { solarTermEventForCivilYear } from "../../src/astronomy/solar-term-boundaries.js";

    const UTC_OFFSET_HOURS = 8;
    const HOUR_MS = 3_600_000;
    const SECOND_MS = 1_000;
    const DRAG_DEGREES = 0.25;
    const START_ANGLE = -90;
    const END_ANGLE = START_ANGLE + DRAG_DEGREES;
    const probe = document.querySelector("#probe");

    const RING_INTERVAL = Object.freeze({ solar:2, month:4, year:5 });

    function fieldsFromInstant(ms) {
      const shifted = new Date(ms + UTC_OFFSET_HOURS * HOUR_MS);
      return {
        year:shifted.getUTCFullYear(),
        month:shifted.getUTCMonth() + 1,
        day:shifted.getUTCDate(),
        hour:shifted.getUTCHours(),
        minute:shifted.getUTCMinutes(),
        second:shifted.getUTCSeconds()
      };
    }

    function longitudeAt(ms) {
      return apparentSolarLongitude(fieldsFromInstant(ms), UTC_OFFSET_HOURS);
    }

    function findProductionSolarWrapSecond() {
      let lo = Date.parse("2024-03-19T00:00:00.000Z") / SECOND_MS;
      let hi = Date.parse("2024-03-21T12:00:00.000Z") / SECOND_MS;
      if (!(longitudeAt(lo * SECOND_MS) > 350 && longitudeAt(hi * SECOND_MS) < 10)) {
        throw new Error("solar wrap bracket is invalid");
      }
      while (hi - lo > 1) {
        const mid = Math.floor((lo + hi) / 2);
        if (longitudeAt(mid * SECOND_MS) < 180) hi = mid;
        else lo = mid;
      }
      return hi * SECOND_MS;
    }

    function appUrl(instantMs) {
      const url = new URL("../../", location.href);
      url.searchParams.set("instant", new Date(instantMs).toISOString());
      return url.href;
    }

    function settle() {
      return new Promise(resolve => queueMicrotask(() => queueMicrotask(resolve)));
    }

    function settleRenderFrame(win) {
      return new Promise(resolve => win.requestAnimationFrame(() => resolve()));
    }

    async function waitFor(predicate, label, timeoutMs = 5000) {
      const started = performance.now();
      while (performance.now() - started < timeoutMs) {
        if (predicate()) return;
        await new Promise(resolve => setTimeout(resolve, 20));
      }
      throw new Error(`timeout waiting for ${label}`);
    }

    function geometry(frame) {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const instrument = doc?.querySelector("#kinetic-instrument");
      const svg = doc?.querySelector("#kinetic-wheel");
      const ctm = svg?.getScreenCTM();
      const center = instrument?.dataset.geometryCenter?.split(",").map(Number);
      if (!win || !doc || !instrument || !svg || !ctm || !center || center.length !== 2 || center.some(value => !Number.isFinite(value))) return null;
      const radii = [...doc.querySelectorAll("#guide-layer .guide-arc")]
        .map(path => {
          const point = path.getPointAtLength(0);
          return Math.hypot(point.x - center[0], point.y - center[1]);
        })
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
      if (radii.length !== 7) return null;
      return { win, doc, instrument, svg, ctm, center, radii };
    }

    function pointerAt(g, radius, angleDegrees, type, pointerId) {
      const angle = angleDegrees * Math.PI / 180;
      const world = new g.win.DOMPoint(
        g.center[0] + Math.cos(angle) * radius,
        g.center[1] + Math.sin(angle) * radius
      );
      const screen = world.matrixTransform(g.ctm);
      return new g.win.PointerEvent(type, {
        bubbles:true,
        cancelable:true,
        pointerId,
        pointerType:"touch",
        isPrimary:true,
        button:0,
        buttons:type === "pointerup" ? 0 : 1,
        clientX:screen.x,
        clientY:screen.y
      });
    }

    function snapshot(g, ringId) {
      const track = g.doc.querySelector(`#${ringId}-track`);
      if (!track) return null;
      return {
        innerWidth:g.win.innerWidth,
        instantMs:Number(g.instrument.dataset.selectedInstantMs),
        modelRotation:Number(track.dataset.modelRotation),
        manualOffset:Number(track.dataset.manualOffset),
        linked:track.dataset.linked ?? "",
        activeRing:g.svg.dataset.activeRing ?? "",
        scrubMode:g.instrument.dataset.scrubMode ?? "",
        crossedBoundaries:Number(g.instrument.dataset.linkedScrubBoundaries),
        lastRing:g.instrument.dataset.lastLinkedScrubRing ?? "",
        deltaMs:Number(g.instrument.dataset.lastLinkedScrubDeltaMs),
        monthPillar:g.instrument.dataset.monthPillar ?? "",
        yearPillar:g.instrument.dataset.yearPillar ?? "",
        longitude:Number(g.instrument.dataset.solarLongitude),
        term:g.instrument.dataset.term ?? ""
      };
    }

    function writeSnapshot(key, position, value) {
      const prefix = `${key}${position}`;
      for (const [field, raw] of Object.entries(value)) {
        probe.dataset[`${prefix}${field[0].toUpperCase()}${field.slice(1)}`] = String(raw);
      }
    }

    async function exercise({ key, ringId, boundaryMs, startMs, pointerId }) {
      const frame = document.querySelector(`#${key}-frame`);
      const loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once:true }));
      frame.src = appUrl(startMs);
      await loaded;

      await waitFor(() => {
        const g = geometry(frame);
        const current = g ? snapshot(g, ringId) : null;
        return current && current.instantMs === startMs && current.scrubMode === "linked-time" && Number.isFinite(current.modelRotation);
      }, `${key} production linked pose`);
      await settle();

      const g = geometry(frame);
      if (!g) throw new Error(`${key} geometry unavailable`);
      const interval = RING_INTERVAL[ringId];
      const radius = (g.radii[interval] + g.radii[interval + 1]) / 2;
      const before = snapshot(g, ringId);
      if (!before) throw new Error(`${key} initial snapshot unavailable`);

      g.svg.dispatchEvent(pointerAt(g, radius, START_ANGLE, "pointerdown", pointerId));
      await settle();
      const active = snapshot(g, ringId);

      g.svg.dispatchEvent(pointerAt(g, radius, END_ANGLE, "pointermove", pointerId));
      // Production intentionally commits pointer-drag presentation at most once
      // per display frame. Observe the pose only after that scheduled commit.
      await settleRenderFrame(g.win);
      await settle();
      const moved = snapshot(g, ringId);

      g.svg.dispatchEvent(pointerAt(g, radius, END_ANGLE, "pointerup", pointerId));
      await settle();
      const after = snapshot(g, ringId);
      if (!active || !moved || !after) throw new Error(`${key} drag snapshot unavailable`);

      probe.dataset[`${key}BoundaryMs`] = String(boundaryMs);
      probe.dataset[`${key}Radius`] = String(radius);
      writeSnapshot(key, "Before", before);
      writeSnapshot(key, "Active", active);
      writeSnapshot(key, "Moved", moved);
      writeSnapshot(key, "After", after);
    }

    const monthBoundary = solarTermEventForCivilYear(2024, "驚蟄").instantMs;
    const yearBoundary = solarTermEventForCivilYear(2024, "立春").instantMs;
    const solarBoundary = findProductionSolarWrapSecond();

    const cases = [
      { key:"month", ringId:"month", boundaryMs:monthBoundary, startMs:monthBoundary + 6 * HOUR_MS, pointerId:121 },
      { key:"year", ringId:"year", boundaryMs:yearBoundary, startMs:yearBoundary + 6 * HOUR_MS, pointerId:122 },
      { key:"solar", ringId:"solar", boundaryMs:solarBoundary, startMs:solarBoundary + 2 * HOUR_MS, pointerId:123 }
    ];

    Promise.all(cases.map(exercise))
      .then(() => {
        probe.dataset.dragDegrees = String(DRAG_DEGREES);
        probe.dataset.ready = "true";
      })
      .catch(error => {
        probe.dataset.ready = "error";
        probe.dataset.error = String(error?.stack ?? error);
      });
  </script>
</body>
</html>

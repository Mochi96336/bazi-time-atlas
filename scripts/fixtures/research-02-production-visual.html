<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Research 02 production visual harness</title>
  <style>
    html,body{margin:0;overflow:hidden;background:#0a0e12}
    #stage{display:block;border:0;background:#0a0e12}
    #probe{display:none}
  </style>
</head>
<body>
  <iframe id="stage" title="Research 02 production viewport"></iframe>
  <output id="probe" data-ready="false"></output>
  <script>
    const params=new URLSearchParams(location.search);
    const width=Math.max(320,Math.min(2047,Number(params.get("width"))||1440));
    const height=Math.max(480,Math.min(2400,Number(params.get("height"))||900));
    const frame=document.querySelector("#stage");
    const probe=document.querySelector("#probe");
    document.documentElement.style.width=(width<=390?500:width)+"px";
    document.body.style.width=(width<=390?500:width)+"px";
    document.documentElement.style.height=height+"px";
    document.body.style.height=height+"px";
    frame.style.width=width+"px";
    frame.style.height=height+"px";
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    frame.addEventListener("load",async()=>{
      try{
        const doc=frame.contentDocument;
        const win=frame.contentWindow;
        for(let i=0;i<180;i++){
          const root=doc?.getElementById("seasonal-drift-evidence");
          const proof=doc?.getElementById("seasonal-boundary-proof-svg");
          if(root?.dataset.ready==="true"&&proof?.dataset.ready==="true")break;
          await wait(40);
        }
        const root=doc?.getElementById("seasonal-drift-evidence");
        const proof=doc?.getElementById("seasonal-boundary-proof-svg");
        if(!root||root.dataset.ready!=="true"||proof?.dataset.ready!=="true"){
          throw new Error("Research 02 did not become ready");
        }
        root.scrollIntoView({block:"start"});
        await new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
        await wait(120);
        const bodyPx=Number.parseFloat(win.getComputedStyle(doc.querySelector(".seasonal-drift-evidence-copy p")).fontSize);
        const statPx=Number.parseFloat(win.getComputedStyle(doc.querySelector(".seasonal-drift-stat.verdict small")).fontSize);
        const boundaryPx=Number.parseFloat(win.getComputedStyle(doc.querySelector(".seasonal-boundary-proof-head p")).fontSize);
        if(bodyPx<12.5||statPx<11||boundaryPx<12)
          throw new Error(`Research 02 evidence prose is too small: lede ${bodyPx}px, statistic ${statPx}px, zero-line note ${boundaryPx}px`);
        const heading=doc.querySelector("#research-astronomy > .research-task-head");
        if(heading && heading.scrollWidth>heading.clientWidth+2)
          throw new Error("Research 02 heading overflows its viewport");
        const orbitDetails=doc.querySelector("#seasonal-drift-orbit-details");
        const transition=doc.querySelector("#research-case-transition");
        const modelScope=doc.querySelector(".research-model-scope");
        const boundarySelect=doc.querySelector("#seasonal-boundary-select");
        if(!orbitDetails||orbitDetails.open||
          !transition?.textContent.includes("01 的選取不會改寫節界證據")||
          !modelScope?.textContent.includes("獨立驗證")||
          boundarySelect?.options.length!==13)
          throw new Error("Research 02 missing fixed-case boundary, model caveat, closed orbit, or 12 native Jie options");
        const verdict=doc.querySelector(".seasonal-drift-evidence-note");
        if(!(verdict.compareDocumentPosition(orbitDetails)&Node.DOCUMENT_POSITION_FOLLOWING))
          throw new Error("Research 02 result must precede optional orbit");
        // Real interaction contract: native Jie selection updates the
        // shared solar cursor, the visible 02 time strip and the 03 pillar
        // evidence. A static count of <option> elements does not prove this.
        const determinacy=doc.getElementById("four-pillar-determinacy");
        const timeState=doc.getElementById("research-time-state");
        const timeTitle=doc.getElementById("research-time-title");
        const instrument=doc.getElementById("recurrence-instrument");
        const originalDelta=instrument?.dataset.deltaYears;
        const selectJie=async(longitude,name)=>{
          boundarySelect.value=String(longitude);
          boundarySelect.dispatchEvent(new win.Event("change",{bubbles:true}));
          for(let i=0;i<70;i++){
            if(root.dataset.selectedLongitude===String(longitude)&&
              determinacy?.dataset.selectedLongitude===String(longitude)&&
              timeState?.dataset.owner==="seasonal"&&
              timeTitle?.textContent.includes(name))break;
            await wait(40);
          }
          if(root.dataset.selectedLongitude!==String(longitude)||
            determinacy?.dataset.selectedLongitude!==String(longitude)||
            timeState?.dataset.owner!=="seasonal"||
            !timeTitle?.textContent.includes(name)||
            boundarySelect.value!==String(longitude)||
            instrument?.dataset.deltaYears!==originalDelta||
            orbitDetails.open)
            throw new Error("Jie picker did not keep 02,03 and the shared time owner in sync at "+longitude);
        };
        await selectJie(45,"立夏");
        await selectJie(315,"立春");
        const componentWidth=root.getBoundingClientRect().width;
        if(root.scrollWidth>root.clientWidth+2||
          componentWidth>width+2||
          boundarySelect.scrollWidth>boundarySelect.clientWidth+2)
          throw new Error("Research 02 overflows its responsive viewport at "+width+"px");
        probe.dataset.nativeSelectionChecked="true";
        probe.dataset.responsiveWidth=String(width);
        probe.dataset.orbitClosed=String(!orbitDetails.open);
        probe.dataset.nativeJieCount=String(boundarySelect.options.length-1);
        probe.dataset.readingLedePx=String(bodyPx);
        probe.dataset.readingStatPx=String(statPx);
        probe.dataset.readingBoundaryPx=String(boundaryPx);
        probe.dataset.ready="true";
        probe.dataset.grammar=root.dataset.diagramGrammar||"";
        probe.dataset.proofReady=proof.dataset.ready||"";
        probe.dataset.innerWidth=String(win.innerWidth);
        probe.dataset.scrollY=String(Math.round(win.scrollY));
      }catch(error){
        probe.dataset.ready="error";
        probe.dataset.error=String(error);
      }
    });
    // Observe the iframe before navigation: a fast cached frame must not
    // finish before its proof listener has been registered.
    frame.src=new URL("../../recurrence.html?date=2026-09-13&delta=24000",location.href).href;
  </script>
</body>
</html>

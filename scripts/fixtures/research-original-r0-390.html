<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R0 proof: original Research, no hidden sections</title>
<style>html,body{margin:0;width:500px;background:#0a100d}
iframe{display:block;width:390px;height:1300px;border:0}output{display:none}</style>
</head><body>
<iframe id="research" title="Restored original Research"></iframe>
<output id="probe" data-ready="false" data-error="initializing"></output>
<script>
const query=new URLSearchParams(location.search);
const desktop=query.get("desktop")==="1";
const requestedWidth=Number(query.get("width"));
const width=desktop?1440:
  ([320,390,768].includes(requestedWidth)?requestedWidth:390);
const bare=query.get("bare")==="1";
const boundary=query.get("boundary")==="1";
const interactive=query.get("interactive")==="1";
const deep=query.get("deep")==="1";
const precise=query.get("precise")==="1";
const iframe=document.getElementById("research");
const probe=document.getElementById("probe");
if(width!==390){
  const outer=Math.max(500,width);
  document.documentElement.style.width=outer+"px";
  document.body.style.width=outer+"px";
  iframe.style.width=width+"px";
  iframe.style.height="2200px";
}
const check=(yes,why)=>{if(!yes)throw Error(why)};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
iframe.addEventListener("load",async()=>{
 try{
  const d=iframe.contentDocument,w=iframe.contentWindow;
  const strip=d.getElementById("research-year-strip");
  const instrument=d.getElementById("recurrence-instrument");
  for(let i=0;i<180;i++){
   if(strip?.dataset.ready==="true" && instrument?.dataset.targetDate &&
     instrument.dataset.targetDate!=="invalid")break;
   await wait(40);
  }

  check(d.documentElement.clientWidth===width,"not a real "+width+"px Research viewport");
  check(!d.getElementById("research-free-explorer") &&
    !d.getElementById("research-advanced-details"),
    "R3 public route must contain no replacement Year story or top-level wrapper");
  // Restore the long-range Research chapters. Preserve the ORIGINAL small
  // within-chapter disclosure around the optional 60-day wheel; R0 only
  // removes the NEW top-level wrapper that hid ALL Research content.
  const ids=["research-discrete","research-cycle-comparison","recurrence-instrument",
    "research-year-strip","research-astronomy",
    "research-evidence","four-pillar-determinacy"];
  for(const id of ids){
    const el=d.getElementById(id);
    check(el&&!el.hidden&&el.checkVisibility(),
      "ORIGINAL Research module absent or hidden: "+id);
  }
  const optionalWheel=d.getElementById("research-sexagenary-cycle");
  check(optionalWheel && (optionalWheel.checkVisibility() ||
    optionalWheel.closest("details")?.querySelector("summary")?.checkVisibility()),
    "original 60-day wheel was deleted instead of retaining its original optional disclosure");
  check(strip.dataset.ready==="true" &&
    instrument.dataset.targetDate!=="invalid" &&
    strip.dataset.selectedDayPillar &&
    (boundary
      ? strip.dataset.selectedYearPillar==="unavailable" &&
        strip.dataset.selectedYearMembershipStatus==="unresolved"
      : strip.dataset.selectedYearPillar!=="unavailable"),
    "original year strip must retain canonical Day and respect unresolved Li Chun Year on date-only boundary");
  if(!bare && !boundary)check(instrument.dataset.targetDate==="2024-02-10" &&
    strip.dataset.selectedYearPillar==="甲辰",
    "original selected-date and source-backed 2024 Year identity drifted");
  if(boundary)check(instrument.dataset.targetDate==="2024-02-04" &&
    strip.dataset.selectedYearPillar==="unavailable" &&
    strip.dataset.selectedYearMembershipStatus==="unresolved",
    "R1 date-only Li Chun must keep unresolved Year identity");
  check(!d.getElementById("research-one-year-story") &&
    d.querySelectorAll("#research-year-strip").length===1,
    "duplicate Year visualization appears alongside the original strip");
  // R1 must change the ORIGINAL strip, not quietly pass based on old R0.
  const civilYear=Number(instrument.dataset.targetDate.split("-")[0]);
  const leap=(civilYear%4===0 && civilYear%100!==0)||civilYear%400===0;
  const days=leap?366:365,extra=leap?6:5;
  const full=d.getElementById("research-year-full-cycle");
  const selectedDay=d.getElementById("research-cycles-day-target");
  const selectedYear=d.getElementById("research-cycles-year-target");
  const cycleCompare=d.getElementById("research-cycle-comparison");
  const transition=d.getElementById("research-year-transition");
  const track=d.querySelector("#research-year-strip .research-year-track");
  const line=d.querySelector("#research-year-strip .research-year-line");
  const renderedTrackCSS=w.getComputedStyle(track);
  const renderedLineCSS=w.getComputedStyle(line);
  check(renderedTrackCSS.position==="relative" &&
    renderedLineCSS.backgroundImage.includes("linear-gradient"),
    "R1 original track styles NOT ACTIVE: position="+renderedTrackCSS.position+
    "; line="+renderedLineCSS.backgroundImage+"; styles="+
    [...d.styleSheets].map(sheet=>sheet.href??"inline").join(","));
  check(full?.checkVisibility() && selectedDay?.checkVisibility() &&
    selectedYear?.checkVisibility() && transition?.checkVisibility() &&
    full.textContent.includes("輪轉6 次") &&
    full.textContent.includes("再向前 "+extra+" 位") &&
    strip.dataset.civilYearDays===String(days) &&
    strip.dataset.civilYearDayRemainder===String(extra) &&
    selectedDay.textContent===strip.dataset.selectedDayPillar &&
    cycleCompare.checkVisibility() &&
    d.querySelectorAll(".research-cycles-card").length===0 &&
    /[0-9]{2}\/60/.test(d.getElementById("research-cycles-day-base-ordinal").textContent) &&
    /[0-9]{2}\/60/.test(d.getElementById("research-cycles-day-target-ordinal").textContent),
    "R1 must use the original year strip's 365/366 and canonical Day");
  if(!bare && !boundary){
    check(selectedYear.textContent==="甲辰" &&
      transition.textContent.includes("癸卯 → 甲辰") &&
      track.dataset.liChunAvailable==="true",
      "2024 source-based original Year transition or current Year differs");
  }
  if(boundary){
    check(selectedYear.textContent==="約癸卯／甲辰" &&
      d.getElementById("research-year-selected-certainty").textContent.includes("需提供時刻") &&
      transition.textContent.includes("癸卯 → 甲辰") &&
      track.dataset.liChunAvailable==="true",
      "Li Chun ambiguity must show both Year candidates without hiding the canonical Day");
  }
  check(d.querySelector(".research-year-same-date-details")?.open===false,
    "optional next-same-date comparison should not compete with the one-year fact");
  check(w.getComputedStyle(d.getElementById("research-year-base-title")).display==="none" &&
    w.getComputedStyle(d.getElementById("research-year-li-chun-title")).display==="none",
    "old floating marker labels can still collide near Li Chun");
  const ticks=[...d.querySelectorAll("#research-year-jiazi-ticks .research-year-jiazi-tick")];
  check(ticks.length===Number(strip.dataset.jiaziTickCount) && ticks.length>=6 &&
    ticks.every(t=>t.dataset.pillar==="甲子") &&
    ticks.every((t,i)=>i===0 ||
      Number(t.dataset.dayOffset)-Number(ticks[i-1].dataset.dayOffset)===60),
    "original Year bar must have genuine 甲子 days at exactly 60-day intervals");
  const controls=d.getElementById("research-controls");
  check(controls && !controls.open &&
    d.getElementById("research-controls-base").textContent.includes("/") &&
    d.getElementById("research-controls-delta").textContent.includes("年"),
    "original base control must default to a tiny live-updating closed button");
  for(const selector of [".research-year-key-data",".research-year-transition-line",
    ".research-cycle-inline",".research-year-full-cycle"]){
    const box=d.querySelector(selector)?.getBoundingClientRect();
    check(box && box.left>=-1 && box.right<=width+1,
      "new ORIGINAL status line overflows "+width+"px: "+selector);
  }
  // R2 original OWNER proof: a preview does not commit; release updates
  // the original base fields and existing delta-owned target/URL once.
  if(interactive || deep || precise){
    const slider=d.getElementById("research-year-scrub");
    const baseDay=d.getElementById("base-day");
    const originalURL=w.location.pathname+w.location.search;
    const dayName=strip.dataset.selectedDayPillar;
    check(slider && !slider.disabled && slider.max==="365" &&
      slider.getBoundingClientRect().height>=36 &&
      w.getComputedStyle(slider).position==="absolute" &&
      slider.getAttribute("aria-valuetext").includes("2024/02/10"),
      "original single Year-strip gesture input is unavailable");
    if(precise){
      for(let n=0;n<120&&instrument.dataset.selectedTargetInstantBound!=="true";n++)
        await wait(40);
      check(instrument.dataset.selectedTargetInstantBound==="true",
        "precise-target test URL did not bind existing target instant");
      slider.value="34";slider.dispatchEvent(new Event("input",{bubbles:true}));
      slider.dispatchEvent(new Event("change",{bubbles:true}));
      check(instrument.dataset.stripSelectionOutcome==="target-instant-bound" &&
        instrument.dataset.targetDate==="2024-02-10" &&
        strip.dataset.selectedDayPillar===dayName &&
        slider.value==="40" &&
        !d.getElementById("research-year-scrub-feedback").hidden,
        "original Year strip incorrectly carried physical time to another date");
      probe.dataset.preciseGuard="true";
    }else if(deep){
      check(instrument.dataset.baseDate==="2023-02-10" &&
        instrument.dataset.targetDate==="2024-02-10" &&
        instrument.dataset.deltaYears==="1","deep leap test needs 2023+1");
      slider.value="59";slider.dispatchEvent(new Event("input",{bubbles:true}));
      slider.dispatchEvent(new Event("change",{bubbles:true}));
      check(instrument.dataset.stripSelectionOutcome==="base-calendar-day-unavailable" &&
        instrument.dataset.baseDate==="2023-02-10" &&
        instrument.dataset.targetDate==="2024-02-10" &&
        strip.dataset.selectedDayPillar===dayName &&
        w.location.pathname+w.location.search===originalURL &&
        slider.value==="40" &&
        !d.getElementById("research-year-scrub-feedback").hidden,
        "2024 Feb29 cannot be represented by 2023+1; do not silently reset delta");
      probe.dataset.leapGuard="true";
    }else{
      check(instrument.dataset.deltaYears==="0","original gesture must start at Δ 0");
      slider.value="34";
      slider.dispatchEvent(new Event("input",{bubbles:true}));
      check(instrument.dataset.targetDate==="2024-02-10" &&
        d.getElementById("research-year-scrub-hint").textContent.includes("2024/02/04"),
        "input-preview must not create a second committed selected date");
      slider.dispatchEvent(new Event("change",{bubbles:true}));
      check(instrument.dataset.stripSelectionOutcome==="applied" &&
        instrument.dataset.baseDate==="2024-02-04" &&
        instrument.dataset.targetDate==="2024-02-04" &&
        instrument.dataset.deltaYears==="0" &&
        strip.dataset.selectedYearPillar==="unavailable" &&
        strip.dataset.selectedYearMembershipStatus==="unresolved" &&
        strip.dataset.selectedDayPillar!==dayName &&
        w.location.search.includes("date=2024-02-04"),
        "releasing original bar did not commit into original Year/Day/date/URL");
      probe.dataset.boundaryScrub="true";
      slider.value="40";slider.dispatchEvent(new Event("input",{bubbles:true}));
      slider.dispatchEvent(new Event("change",{bubbles:true}));
      check(instrument.dataset.targetDate==="2024-02-10" &&
        baseDay.value==="10" &&
        strip.dataset.selectedDayPillar===dayName &&
        strip.dataset.selectedYearPillar==="甲辰" &&
        w.location.search.includes("date=2024-02-10"),
        "original date/Day/Year and URL did not roundtrip after slider return");
      probe.dataset.scrubRoundtrip="true";
      const settled=w.location.pathname+w.location.search;
      baseDay.value="30"; // edited but NOT submitted — must never be discarded
      slider.value="42";slider.dispatchEvent(new Event("input",{bubbles:true}));
      slider.dispatchEvent(new Event("change",{bubbles:true}));
      check(instrument.dataset.stripSelectionOutcome==="stale-original-input" &&
        instrument.dataset.targetDate==="2024-02-10" &&
        baseDay.value==="30" && slider.value==="40" &&
        w.location.pathname+w.location.search===settled &&
        !d.getElementById("research-year-scrub-feedback").hidden,
        "gesture overwrote uncommitted original date input");
      probe.dataset.dirtyGuard="true";
    }
  }
  probe.dataset.originalCycle="visible";
  // Geometric proof of original tick coordinates: native thumb-center
  // travel exactly spans the same 1/1 -> 12/31 width as the visible bar.
  const range=d.getElementById("research-year-scrub");
  const sliderBox=range.getBoundingClientRect();
  const trackBox=track.getBoundingClientRect();
  const minCenter=sliderBox.left+9.5;
  const maxCenter=sliderBox.right-9.5;
  check(Math.abs(minCenter-trackBox.left)<1.25 &&
    Math.abs(maxCenter-trackBox.right)<1.25 &&
    sliderBox.left>=-1 && sliderBox.right<=width+1,
    "native Year slider must coincide with original Year ticks at both ends");
  const bounds=strip.getBoundingClientRect();
  check(bounds.left>=-1 && bounds.right<=width+1,
    "restored original strip overflows the "+width+"px viewport");
  check(w.getComputedStyle(strip).display!=="none" &&
    w.getComputedStyle(strip).visibility!=="hidden",
    "old erroneous forced-hidden original Year strip CSS survived R0");
  probe.dataset.ready="true";
  probe.dataset.width=String(width);
  probe.dataset.bare=String(bare);
  probe.dataset.boundary=String(boundary);
  probe.dataset.originalStrip="visible";
  probe.dataset.originalEvidence="visible";
  probe.dataset.duplicateStory="absent";
  probe.dataset.selectedDate=instrument.dataset.targetDate;
  probe.dataset.error="none";
 }catch(err){probe.dataset.ready="error";probe.dataset.error=err?.stack??String(err);}
},{once:true});
iframe.src=bare?"../../recurrence.html":
  "../../recurrence.html?date="+(deep?"2023-02-10":boundary?"2024-02-04":"2024-02-10")+
  "&delta="+(deep?"1":"0")+
  (precise?"&targetClock=fixed-zone&targetTime=12%3A00%3A00&ut1Offset=8":"");
</script></body></html>

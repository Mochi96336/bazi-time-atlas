<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>390px visual harness</title>
  <style>
    html, body { margin:0; width:500px; min-height:100%; overflow:hidden; background:#0b0f0c; }
    #stage { display:block; width:390px; border:0; background:#0b0f0c; }
    #probe { display:none; }
  </style>
</head>
<body>
  <iframe id="stage" title="390px atlas viewport"></iframe>
  <output id="probe" data-ready="false"></output>
  <script>
    const params = new URLSearchParams(location.search);
    const requestedHeight = Math.max(320, Math.min(6000, Number(params.get("height")) || 844));
    const requestedTarget = params.get("target") || "../../?instant=2027-03-15T13%3A20%3A09.000Z";
    const exerciseDrag = params.get("exerciseDrag") === "1";
    const frame = document.querySelector("#stage");
    const probe = document.querySelector("#probe");
    let dragExercised = false;
    frame.style.height = `${requestedHeight}px`;
    document.documentElement.style.height = `${requestedHeight}px`;
    document.body.style.height = `${requestedHeight}px`;
    frame.src = new URL(requestedTarget, location.href).href;

    function safeNumber(value, digits = 1) {
      return Number.isFinite(value) ? Number(value.toFixed(digits)) : null;
    }

    function activePathDiagnostic(childWindow, doc, svg, center, radii, index, trackId, expectedClass, screenPoint) {
      const track = doc.querySelector(`#${trackId}`);
      const active = track?.querySelector(`.${expectedClass}.is-active`) ?? track?.querySelector(".is-active");
      const style = active ? childWindow.getComputedStyle(active) : null;
      const bbox = active?.getBoundingClientRect?.();
      let inFill = false;
      let localPoint = null;
      try {
        if (active?.isPointInFill && active.getScreenCTM()) {
          const inverse = active.getScreenCTM().inverse();
          localPoint = new childWindow.DOMPoint(screenPoint.x, screenPoint.y).matrixTransform(inverse);
          inFill = active.isPointInFill(localPoint);
        }
      } catch {}
      return {
        track:trackId,
        transform:track?.getAttribute("transform") ?? "none",
        sectors:track?.querySelectorAll(`.${expectedClass}`).length ?? 0,
        activeClass:active?.getAttribute("class") ?? "none",
        fill:style?.fill ?? "none",
        opacity:style?.opacity ?? "none",
        visibility:style?.visibility ?? "none",
        display:style?.display ?? "none",
        pointerEvents:style?.pointerEvents ?? "none",
        bbox:bbox ? [safeNumber(bbox.left), safeNumber(bbox.top), safeNumber(bbox.width), safeNumber(bbox.height)] : null,
        sampleRadius:safeNumber((radii[index] + radii[index + 1]) / 2),
        localPoint:localPoint ? [safeNumber(localPoint.x), safeNumber(localPoint.y)] : null,
        inFill
      };
    }

    function ringGeometry(childWindow, doc, instrument) {
      const svg = doc.querySelector("#kinetic-wheel");
      const ctm = svg?.getScreenCTM();
      const center = instrument?.dataset.geometryCenter?.split(",").map(Number);
      if (!svg || !ctm || !center || center.length !== 2 || center.some(value => !Number.isFinite(value))) return null;
      const radii = [...doc.querySelectorAll("#guide-layer .guide-arc")]
        .map(path => {
          const point = path.getPointAtLength(0);
          return Math.hypot(point.x - center[0], point.y - center[1]);
        })
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
      if (radii.length !== 6) return null;
      return { svg, ctm, center, radii };
    }

    function ringHitDiagnostic(childWindow, doc, instrument) {
      const geometry = ringGeometry(childWindow, doc, instrument);
      if (!geometry) return { mask:"00000", classes:"geometry-unavailable", debug:"geometry-unavailable" };
      const { svg, ctm, center, radii } = geometry;
      const expected = [
        { track:"year-track", className:"year-sector" },
        { track:"month-track", className:"month-sector" },
        { track:"day-track", className:"day-sector" },
        { track:"solar-track", className:"term-sector" },
        { track:"zodiac-track", className:"zodiac-sector" }
      ];
      const angle = -89 * Math.PI / 180;
      const hits = expected.map((item, index) => {
        const radius = (radii[index] + radii[index + 1]) / 2;
        const svgPoint = new childWindow.DOMPoint(center[0] + Math.cos(angle) * radius, center[1] + Math.sin(angle) * radius);
        const screenPoint = svgPoint.matrixTransform(ctm);
        const stack = doc.elementsFromPoint(screenPoint.x, screenPoint.y)
          .slice(0, 8)
          .map(node => node.getAttribute?.("class") || node.id || node.tagName || "unknown");
        const hit = doc.elementFromPoint(screenPoint.x, screenPoint.y);
        return {
          ok:Boolean(hit?.classList?.contains(item.className)),
          className:hit?.getAttribute?.("class") ?? hit?.tagName ?? "none",
          stack,
          screen:[safeNumber(screenPoint.x), safeNumber(screenPoint.y)],
          active:activePathDiagnostic(childWindow, doc, svg, center, radii, index, item.track, item.className, screenPoint)
        };
      });
      return { mask:hits.map(hit => hit.ok ? "1" : "0").join(""), classes:hits.map(hit => hit.className).join(" | "), debug:JSON.stringify(hits) };
    }

    function pointerAt(childWindow, geometry, radius, angleDegrees, type, pointerId = 71) {
      const angle = angleDegrees * Math.PI / 180;
      const world = new childWindow.DOMPoint(
        geometry.center[0] + Math.cos(angle) * radius,
        geometry.center[1] + Math.sin(angle) * radius
      );
      const screen = world.matrixTransform(geometry.ctm);
      return new childWindow.PointerEvent(type, {
        bubbles:true,
        cancelable:true,
        pointerId,
        pointerType:"touch",
        isPrimary:true,
        button:0,
        buttons:type === "pointerup" ? 0 : 1,
        clientX:screen.x,
        clientY:screen.y
      });
    }

    function exerciseIndependentDrag(childWindow, doc, instrument) {
      if (!exerciseDrag || dragExercised) return;
      const geometry = ringGeometry(childWindow, doc, instrument);
      const compareButton = doc.querySelector("#compare-rings-button");
      const resetButton = doc.querySelector("#reset-rings-button");
      const dayTrack = doc.querySelector("#day-track");
      if (!geometry || !compareButton || !resetButton || !dayTrack) return;
      dragExercised = true;
      const radius = (geometry.radii[2] + geometry.radii[3]) / 2;
      const modelBefore = Number(dayTrack.dataset.modelRotation);
      compareButton.click();
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -90, "pointerdown"));
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -80, "pointermove"));
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -80, "pointerup"));
      const offsetAfter = Number(dayTrack.dataset.manualOffset);
      const modelAfter = Number(dayTrack.dataset.modelRotation);
      const linkedAfter = dayTrack.dataset.linked;
      const detachedAfter = instrument.dataset.detachedRings ?? "";
      const statusAfter = doc.querySelector("#ring-compare-status")?.textContent ?? "";
      resetButton.click();
      probe.dataset.dragReady = "true";
      probe.dataset.dragRing = instrument.dataset.lastDraggedRing ?? "";
      probe.dataset.dragModelBefore = String(modelBefore);
      probe.dataset.dragModelAfter = String(modelAfter);
      probe.dataset.dragOffsetAfter = String(offsetAfter);
      probe.dataset.dragLinkedAfter = linkedAfter ?? "";
      probe.dataset.dragDetachedAfter = detachedAfter;
      probe.dataset.dragStatusAfter = statusAfter;
      probe.dataset.dragOffsetReset = dayTrack.dataset.manualOffset ?? "";
      probe.dataset.dragLinkedReset = dayTrack.dataset.linked ?? "";
    }

    function snapshot() {
      const childWindow = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!childWindow || !doc) return;
      const instrument = doc.querySelector("#kinetic-instrument");
      const scrollHeight = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
      const viewportHeight = childWindow.innerHeight;
      const secondary = [".timeline-dock", ".state-strip", ".atlas-notes", ".sources-panel"]
        .map(selector => doc.querySelector(selector)).filter(Boolean);
      const ringHits = ringHitDiagnostic(childWindow, doc, instrument);
      probe.dataset.ready = "true";
      probe.dataset.innerWidth = String(childWindow.innerWidth);
      probe.dataset.innerHeight = String(childWindow.innerHeight);
      probe.dataset.mediaMatched = String(childWindow.matchMedia("(max-width: 480px)").matches);
      probe.dataset.viewportFit = String(scrollHeight <= viewportHeight + 2);
      probe.dataset.scrollHeight = String(scrollHeight);
      probe.dataset.viewportHeight = String(viewportHeight);
      probe.dataset.instrumentShare = instrument && viewportHeight > 0 ? (instrument.getBoundingClientRect().height / viewportHeight).toFixed(3) : "0.000";
      probe.dataset.secondaryHidden = String(secondary.every(node => childWindow.getComputedStyle(node).display === "none"));
      probe.dataset.fanClip = instrument?.dataset.fanClip ?? "not-applicable";
      probe.dataset.masterGeometry = instrument?.dataset.masterGeometry ?? "not-applicable";
      probe.dataset.ringHitMask = ringHits.mask;
      probe.dataset.ringHitClasses = ringHits.classes;
      probe.dataset.ringHitDebug = ringHits.debug;
      probe.dataset.target = frame.src;
      exerciseIndependentDrag(childWindow, doc, instrument);
    }

    frame.addEventListener("load", () => {
      snapshot();
      queueMicrotask(snapshot);
      setTimeout(snapshot, 100);
      setTimeout(snapshot, 700);
    });
  </script>
</body>
</html>

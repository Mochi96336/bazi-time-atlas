<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>390px visual harness</title>
  <style>
    html, body { margin:0; width:500px; min-height:100%; overflow:hidden; background:#0b0f0c; }
    #stage { display:block; width:390px; border:0; background:#0b0f0c; }
    #probe { display:none; }
  </style>
</head>
<body>
  <iframe id="stage" title="390px atlas viewport"></iframe>
  <output id="probe" data-ready="false"></output>
  <script>
    const params = new URLSearchParams(location.search);
    const requestedHeight = Math.max(320, Math.min(6000, Number(params.get("height")) || 844));
    const requestedTarget = params.get("target") || "../../?instant=2027-03-15T13%3A20%3A09.000Z";
    const exerciseDrag = params.get("exerciseDrag") === "1";
    const exerciseLinkedDrag = params.get("exerciseLinkedDrag") === "1";
    const exerciseHourDrag = params.get("exerciseHourDrag") === "1";
    const frame = document.querySelector("#stage");
    const probe = document.querySelector("#probe");
    let dragExercised = false;
    let linkedDragExercised = false;
    let hourDragExercised = false;
    frame.style.height = `${requestedHeight}px`;
    document.documentElement.style.height = `${requestedHeight}px`;
    document.body.style.height = `${requestedHeight}px`;
    frame.src = new URL(requestedTarget, location.href).href;

    function safeNumber(value, digits = 1) {
      return Number.isFinite(value) ? Number(value.toFixed(digits)) : null;
    }

    function ringGeometry(childWindow, doc, instrument) {
      const svg = doc.querySelector("#kinetic-wheel");
      const ctm = svg?.getScreenCTM();
      const center = instrument?.dataset.geometryCenter?.split(",").map(Number);
      if (!svg || !ctm || !center || center.length !== 2 || center.some(value => !Number.isFinite(value))) return null;
      const radii = [...doc.querySelectorAll("#guide-layer .guide-arc")]
        .map(path => {
          const point = path.getPointAtLength(0);
          return Math.hypot(point.x - center[0], point.y - center[1]);
        })
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
      if (radii.length !== 7) return null;
      return { svg, ctm, center, radii };
    }

    function ringHitDiagnostic(childWindow, doc, instrument) {
      const geometry = ringGeometry(childWindow, doc, instrument);
      if (!geometry) return { mask:"00000", classes:"geometry-unavailable", debug:"geometry-unavailable" };
      const { ctm, center, radii } = geometry;
      // Five primary time targets. Interval 3 (916–982) is the non-interactive
      // Zodiac overlay inside Solar and intentionally has no separate hit target.
      const expected = [
        { interval:0, className:"hour-sector", id:"hour" },
        { interval:1, className:"day-sector", id:"day" },
        { interval:2, className:"term-sector", id:"solar" },
        { interval:4, className:"month-sector", id:"month" },
        { interval:5, className:"year-sector", id:"year" }
      ];
      const angle = -89 * Math.PI / 180;
      const hits = expected.map(item => {
        const radius = (radii[item.interval] + radii[item.interval + 1]) / 2;
        const svgPoint = new childWindow.DOMPoint(center[0] + Math.cos(angle) * radius, center[1] + Math.sin(angle) * radius);
        const screenPoint = svgPoint.matrixTransform(ctm);
        const hit = doc.elementFromPoint(screenPoint.x, screenPoint.y);
        const stack = doc.elementsFromPoint(screenPoint.x, screenPoint.y)
          .slice(0, 6)
          .map(node => node.getAttribute?.("class") || node.id || node.tagName || "unknown");
        return {
          id:item.id,
          ok:Boolean(hit?.classList?.contains(item.className)),
          className:hit?.getAttribute?.("class") ?? hit?.tagName ?? "none",
          stack,
          radius:safeNumber(radius)
        };
      });
      return {
        mask:hits.map(hit => hit.ok ? "1" : "0").join(""),
        classes:hits.map(hit => hit.className).join(" | "),
        debug:JSON.stringify(hits)
      };
    }

    function activeCycleLabelDiagnostic(childWindow, doc) {
      const ids = ["hour", "day", "month", "year"];
      const rows = ids.map(id => {
        const track = doc.querySelector(`#${id}-track`);
        const activeSector = track?.querySelector(".cycle-sector.is-active") ?? null;
        const activeLabels = [...(track?.querySelectorAll(".active-cycle-label") ?? [])];
        const activeLabel = activeLabels[0] ?? null;
        const activeIndex = activeSector?.dataset.cycleIndex ?? "";
        const sectorLabel = activeSector?.dataset.cycleLabel ?? "";
        const labelIndex = activeLabel?.dataset.cycleIndex ?? "";
        const labelText = activeLabel?.dataset.cycleLabel ?? activeLabel?.textContent ?? "";
        const labelStyle = activeLabel ? childWindow.getComputedStyle(activeLabel) : null;
        const sampled = activeIndex
          ? track?.querySelector(`.cycle-label[data-cycle-index="${activeIndex}"]`) ?? null
          : null;
        const sampledStyle = sampled ? childWindow.getComputedStyle(sampled) : null;
        const visible = Boolean(
          activeLabel &&
          labelStyle &&
          labelStyle.display !== "none" &&
          labelStyle.visibility !== "hidden" &&
          Number(labelStyle.opacity || 1) > 0
        );
        const sampledVisible = Boolean(
          sampled &&
          sampledStyle &&
          sampledStyle.display !== "none" &&
          sampledStyle.visibility !== "hidden" &&
          Number(sampledStyle.opacity || 1) > 0
        );
        return {
          id,
          activeIndex,
          sectorLabel,
          labelIndex,
          labelText,
          count:activeLabels.length,
          visible,
          sampled:Boolean(sampled),
          sampledVisible
        };
      });
      return {
        matchMask:rows.map(row => row.activeIndex && row.activeIndex === row.labelIndex && row.sectorLabel === row.labelText ? "1" : "0").join(""),
        visibleMask:rows.map(row => row.visible ? "1" : "0").join(""),
        uniqueMask:rows.map(row => row.count === 1 ? "1" : "0").join(""),
        sampledMask:rows.map(row => row.sampled ? "1" : "0").join(""),
        duplicateVisibleMask:rows.map(row => row.sampledVisible ? "1" : "0").join(""),
        indices:rows.map(row => row.activeIndex).join(","),
        labels:rows.map(row => `${row.id}:${row.labelText}`).join(" | "),
        debug:JSON.stringify(rows)
      };
    }

    function pointerAt(childWindow, geometry, radius, angleDegrees, type, pointerId = 71) {
      const angle = angleDegrees * Math.PI / 180;
      const world = new childWindow.DOMPoint(
        geometry.center[0] + Math.cos(angle) * radius,
        geometry.center[1] + Math.sin(angle) * radius
      );
      const screen = world.matrixTransform(geometry.ctm);
      return new childWindow.PointerEvent(type, {
        bubbles:true,
        cancelable:true,
        pointerId,
        pointerType:"touch",
        isPrimary:true,
        button:0,
        buttons:type === "pointerup" ? 0 : 1,
        clientX:screen.x,
        clientY:screen.y
      });
    }

    function exerciseLinkedHourDrag(childWindow, doc, instrument) {
      if (!exerciseHourDrag || hourDragExercised) return;
      const geometry = ringGeometry(childWindow, doc, instrument);
      const hourTrack = doc.querySelector("#hour-track");
      const solarTrack = doc.querySelector("#solar-track");
      if (!geometry || !hourTrack || !solarTrack || instrument?.dataset.scrubMode !== "linked-time") return;
      hourDragExercised = true;
      const radius = (geometry.radii[0] + geometry.radii[1]) / 2;
      const instantBefore = Number(instrument.dataset.selectedInstantMs);
      const hourModelBefore = Number(hourTrack.dataset.modelRotation);
      const solarModelBefore = Number(solarTrack.dataset.modelRotation);
      const hourOffsetBefore = Number(hourTrack.dataset.manualOffset);
      const hourPillarBefore = instrument.dataset.hourPillar ?? "";
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -90, "pointerdown", 91));
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -83.5, "pointermove", 91));
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -83.5, "pointerup", 91));
      probe.dataset.hourDragReady = "true";
      probe.dataset.hourDragRing = instrument.dataset.lastLinkedScrubRing ?? "";
      probe.dataset.hourInstantBefore = String(instantBefore);
      probe.dataset.hourInstantAfter = instrument.dataset.selectedInstantMs ?? "";
      probe.dataset.hourModelBefore = String(hourModelBefore);
      probe.dataset.hourModelAfter = hourTrack.dataset.modelRotation ?? "";
      probe.dataset.hourSolarModelBefore = String(solarModelBefore);
      probe.dataset.hourSolarModelAfter = solarTrack.dataset.modelRotation ?? "";
      probe.dataset.hourOffsetBefore = String(hourOffsetBefore);
      probe.dataset.hourOffsetAfter = hourTrack.dataset.manualOffset ?? "";
      probe.dataset.hourLinkedState = hourTrack.dataset.linked ?? "";
      probe.dataset.hourPillarBefore = hourPillarBefore;
      probe.dataset.hourPillarAfter = instrument.dataset.hourPillar ?? "";
      probe.dataset.hourScrubMode = instrument.dataset.scrubMode ?? "";
    }

    function exerciseLinkedDayDrag(childWindow, doc, instrument) {
      if (!exerciseLinkedDrag || linkedDragExercised) return;
      const geometry = ringGeometry(childWindow, doc, instrument);
      const dayTrack = doc.querySelector("#day-track");
      const solarTrack = doc.querySelector("#solar-track");
      if (!geometry || !dayTrack || !solarTrack || instrument?.dataset.scrubMode !== "linked-time") return;
      linkedDragExercised = true;
      const radius = (geometry.radii[1] + geometry.radii[2]) / 2;
      const instantBefore = Number(instrument.dataset.selectedInstantMs);
      const dayModelBefore = Number(dayTrack.dataset.modelRotation);
      const solarModelBefore = Number(solarTrack.dataset.modelRotation);
      const dayOffsetBefore = Number(dayTrack.dataset.manualOffset);
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -90, "pointerdown", 81));
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -83.5, "pointermove", 81));
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -83.5, "pointerup", 81));
      probe.dataset.linkedDragReady = "true";
      probe.dataset.linkedDragRing = instrument.dataset.lastLinkedScrubRing ?? "";
      probe.dataset.linkedInstantBefore = String(instantBefore);
      probe.dataset.linkedInstantAfter = instrument.dataset.selectedInstantMs ?? "";
      probe.dataset.linkedDayModelBefore = String(dayModelBefore);
      probe.dataset.linkedDayModelAfter = dayTrack.dataset.modelRotation ?? "";
      probe.dataset.linkedSolarModelBefore = String(solarModelBefore);
      probe.dataset.linkedSolarModelAfter = solarTrack.dataset.modelRotation ?? "";
      probe.dataset.linkedDayOffsetBefore = String(dayOffsetBefore);
      probe.dataset.linkedDayOffsetAfter = dayTrack.dataset.manualOffset ?? "";
      probe.dataset.linkedDayState = dayTrack.dataset.linked ?? "";
      probe.dataset.linkedScrubMode = instrument.dataset.scrubMode ?? "";
    }

    function exerciseIndependentDrag(childWindow, doc, instrument) {
      if (!exerciseDrag || dragExercised) return;
      const geometry = ringGeometry(childWindow, doc, instrument);
      const compareButton = doc.querySelector("#compare-rings-button");
      const resetButton = doc.querySelector("#reset-rings-button");
      const dayTrack = doc.querySelector("#day-track");
      if (!geometry || !compareButton || !resetButton || !dayTrack) return;
      dragExercised = true;
      const radius = (geometry.radii[1] + geometry.radii[2]) / 2;
      const modelBefore = Number(dayTrack.dataset.modelRotation);
      compareButton.click();
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -90, "pointerdown"));
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -80, "pointermove"));
      geometry.svg.dispatchEvent(pointerAt(childWindow, geometry, radius, -80, "pointerup"));
      const offsetAfter = Number(dayTrack.dataset.manualOffset);
      const modelAfter = Number(dayTrack.dataset.modelRotation);
      const linkedAfter = dayTrack.dataset.linked;
      const detachedAfter = instrument.dataset.detachedRings ?? "";
      const statusAfter = doc.querySelector("#ring-compare-status")?.textContent ?? "";
      resetButton.click();
      probe.dataset.dragReady = "true";
      probe.dataset.dragRing = instrument.dataset.lastDraggedRing ?? "";
      probe.dataset.dragModelBefore = String(modelBefore);
      probe.dataset.dragModelAfter = String(modelAfter);
      probe.dataset.dragOffsetAfter = String(offsetAfter);
      probe.dataset.dragLinkedAfter = linkedAfter ?? "";
      probe.dataset.dragDetachedAfter = detachedAfter;
      probe.dataset.dragStatusAfter = statusAfter;
      probe.dataset.dragOffsetReset = dayTrack.dataset.manualOffset ?? "";
      probe.dataset.dragLinkedReset = dayTrack.dataset.linked ?? "";
    }

    function snapshot() {
      const childWindow = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!childWindow || !doc) return;
      const instrument = doc.querySelector("#kinetic-instrument");
      const svg = doc.querySelector("#kinetic-wheel");
      const solarTrack = doc.querySelector("#solar-track");
      const zodiacTrack = doc.querySelector("#zodiac-track");
      const instrumentRect = instrument?.getBoundingClientRect();
      const svgRect = svg?.getBoundingClientRect();
      const scrollHeight = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
      const viewportHeight = childWindow.innerHeight;
      const secondary = [".timeline-dock", ".state-strip", ".atlas-notes", ".sources-panel"]
        .map(selector => doc.querySelector(selector)).filter(Boolean);
      const ringHits = ringHitDiagnostic(childWindow, doc, instrument);
      const activeCycleLabels = activeCycleLabelDiagnostic(childWindow, doc);
      probe.dataset.ready = "true";
      probe.dataset.innerWidth = String(childWindow.innerWidth);
      probe.dataset.innerHeight = String(childWindow.innerHeight);
      probe.dataset.mediaMatched = String(childWindow.matchMedia("(max-width: 480px)").matches);
      probe.dataset.viewportFit = String(scrollHeight <= viewportHeight + 2);
      probe.dataset.scrollHeight = String(scrollHeight);
      probe.dataset.viewportHeight = String(viewportHeight);
      probe.dataset.instrumentShare = instrument && viewportHeight > 0 ? (instrument.getBoundingClientRect().height / viewportHeight).toFixed(3) : "0.000";
      probe.dataset.secondaryHidden = String(secondary.every(node => childWindow.getComputedStyle(node).display === "none"));
      probe.dataset.fanClip = instrument?.dataset.fanClip ?? "not-applicable";
      probe.dataset.masterGeometry = instrument?.dataset.masterGeometry ?? "not-applicable";
      probe.dataset.cameraMode = instrument?.dataset.geometryCameraMode ?? "";
      probe.dataset.cameraZoom = instrument?.dataset.geometryCameraZoom ?? "";
      probe.dataset.cameraX = instrument?.dataset.geometryCameraX ?? "";
      probe.dataset.cameraY = instrument?.dataset.geometryCameraY ?? "";
      probe.dataset.cameraWidth = instrument?.dataset.geometryCameraWidth ?? "";
      probe.dataset.cameraHeight = instrument?.dataset.geometryCameraHeight ?? "";
      probe.dataset.wheelWidthRatio = instrumentRect && svgRect && instrumentRect.width > 0
        ? (svgRect.width / instrumentRect.width).toFixed(4)
        : "";
      probe.dataset.wheelTransform = svg ? childWindow.getComputedStyle(svg).transform : "";
      probe.dataset.ringHitMask = ringHits.mask;
      probe.dataset.ringHitClasses = ringHits.classes;
      probe.dataset.ringHitDebug = ringHits.debug;
      probe.dataset.activeCycleLabelMatchMask = activeCycleLabels.matchMask;
      probe.dataset.activeCycleLabelVisibleMask = activeCycleLabels.visibleMask;
      probe.dataset.activeCycleLabelUniqueMask = activeCycleLabels.uniqueMask;
      probe.dataset.activeCycleSampledMask = activeCycleLabels.sampledMask;
      probe.dataset.activeCycleDuplicateVisibleMask = activeCycleLabels.duplicateVisibleMask;
      probe.dataset.activeCycleIndices = activeCycleLabels.indices;
      probe.dataset.activeCycleLabels = activeCycleLabels.labels;
      probe.dataset.activeCycleLabelDebug = activeCycleLabels.debug;
      probe.dataset.zodiacDerivedFrom = zodiacTrack?.dataset.derivedFrom ?? "";
      probe.dataset.zodiacPointerEvents = zodiacTrack ? childWindow.getComputedStyle(zodiacTrack).pointerEvents : "";
      probe.dataset.zodiacTransformMatchesSolar = String(
        Boolean(solarTrack && zodiacTrack && solarTrack.getAttribute("transform") === zodiacTrack.getAttribute("transform"))
      );
      probe.dataset.target = frame.src;
      exerciseLinkedHourDrag(childWindow, doc, instrument);
      exerciseLinkedDayDrag(childWindow, doc, instrument);
      exerciseIndependentDrag(childWindow, doc, instrument);
    }

    frame.addEventListener("load", () => {
      snapshot();
      queueMicrotask(snapshot);
      setTimeout(snapshot, 100);
      setTimeout(snapshot, 700);
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exact-time production probe</title>
  <style>
    html, body { margin:0; width:1600px; min-height:1000px; background:#0b0f0c; }
    .stages { display:flex; gap:10px; align-items:flex-start; }
    iframe { display:block; border:0; }
    #mobile-stage { width:390px; height:844px; }
    #desktop-stage { width:1200px; height:900px; }
    #probe { display:none; }
  </style>
</head>
<body>
  <div class="stages">
    <iframe id="mobile-stage" title="Mobile precise-time production harness"></iframe>
    <iframe id="desktop-stage" title="Desktop precise-time production harness"></iframe>
  </div>
  <output id="probe" data-ready="false"></output>
  <script>
    const mobileFrame = document.querySelector("#mobile-stage");
    const desktopFrame = document.querySelector("#desktop-stage");
    const probe = document.querySelector("#probe");
    const source = "../../?instant=2026-09-15T20%3A14%3A37.000Z&lambda=271.25&month=%E5%AD%90&yearStem=%E4%B9%99&utc=9&dayBoundary=civil-midnight&keep=1#analysis";
    mobileFrame.src = new URL(source, location.href).href;
    desktopFrame.src = new URL(source, location.href).href;
    let mobileLoaded = false;
    let desktopLoaded = false;
    let mobileLoadCount = 0;
    let initialCaptured = false;
    let mobileApplied = false;
    let desktopEdited = false;

    function snapshot() {
      if (!mobileLoaded || !desktopLoaded) return;

      const mobileWin = mobileFrame.contentWindow;
      const mobileDoc = mobileFrame.contentDocument;
      const shell = mobileDoc?.querySelector(".kinetic-shell");
      const instrument = mobileDoc?.querySelector("#kinetic-instrument");
      const dock = mobileDoc?.querySelector("#mobile-time-dock");
      const input = mobileDoc?.querySelector("#mobile-instant-input");
      const apply = mobileDoc?.querySelector("#mobile-time-apply");
      const status = mobileDoc?.querySelector("#mobile-time-status");
      const mobileReadout = mobileDoc?.querySelector("#instant-readout");

      const desktopWin = desktopFrame.contentWindow;
      const desktopDoc = desktopFrame.contentDocument;
      const desktopInstrument = desktopDoc?.querySelector("#kinetic-instrument");
      const desktopInput = desktopDoc?.querySelector("#instant-input");
      const desktopReadout = desktopDoc?.querySelector("#instant-readout");

      if (!mobileWin || !mobileDoc || !shell || !instrument || !dock || !input || !apply || !status || !mobileReadout ||
          !desktopWin || !desktopDoc || !desktopInstrument || !desktopInput || !desktopReadout) return;

      const dockStyle = mobileWin.getComputedStyle(dock);
      const shellStyle = mobileWin.getComputedStyle(shell);
      const shellRect = shell.getBoundingClientRect();
      const instrumentRect = instrument.getBoundingClientRect();
      const dockRect = dock.getBoundingClientRect();
      const shellScrollable = shell.scrollHeight > shell.clientHeight + 2;
      const shellCanScroll = ["auto", "scroll"].includes(shellStyle.overflowY) && shellScrollable;
      const dockInShellViewport = dockRect.top >= shellRect.top - 1 && dockRect.bottom <= shellRect.bottom + 1;
      const dockTopInContent = dockRect.top - shellRect.top + shell.scrollTop;
      const dockBottomInContent = dockRect.bottom - shellRect.top + shell.scrollTop;
      const dockWithinScrollableContent = dockTopInContent >= -1 && dockBottomInContent <= shell.scrollHeight + 1;
      const dockFitsShellViewport = dockRect.height <= shell.clientHeight + 2;
      const dockReachable = dockInShellViewport || (shellCanScroll && dockWithinScrollableContent && dockFitsShellViewport);

      if (!initialCaptured) {
        initialCaptured = true;
        probe.dataset.innerWidth = String(mobileWin.innerWidth);
        probe.dataset.dockDisplay = dockStyle.display;
        probe.dataset.inputType = input.type;
        probe.dataset.inputStep = input.getAttribute("step") ?? "";
        probe.dataset.inputPlaceholder = input.placeholder;
        probe.dataset.inputDisplayFormat = input.dataset.displayFormat ?? "";
        probe.dataset.inputPrecision = input.dataset.precision ?? "";
        probe.dataset.inputValue = input.value;
        probe.dataset.mobileInitialReadout = mobileReadout.textContent.trim();
        probe.dataset.mobileInitialUtc = instrument.dataset.utcOffsetHours ?? "";
        probe.dataset.mobileInitialBoundary = instrument.dataset.dayBoundary ?? "";
        probe.dataset.shellOverflowY = shellStyle.overflowY;
        probe.dataset.shellScrollable = String(shellScrollable);
        probe.dataset.dockInShellViewport = String(dockInShellViewport);
        probe.dataset.dockReachable = String(dockReachable);
        probe.dataset.instrumentShare = String(instrumentRect.height / mobileWin.innerHeight);
        probe.dataset.dockAfterInstrument = String(dockRect.top >= instrumentRect.bottom - 1);
        probe.dataset.applyVisible = String(apply.getBoundingClientRect().width > 0 && apply.getBoundingClientRect().height > 0);

        probe.dataset.desktopInnerWidth = String(desktopWin.innerWidth);
        probe.dataset.desktopInitialType = desktopInput.type;
        probe.dataset.desktopInitialStep = desktopInput.step;
        probe.dataset.desktopInitialPrecision = desktopInput.dataset.precision ?? "";
        probe.dataset.desktopInitialValue = desktopInput.value;
        probe.dataset.desktopInitialValid = String(desktopInput.validity.valid);
        probe.dataset.desktopInitialReadout = desktopReadout.textContent.trim();
        probe.dataset.desktopInitialUtc = desktopInstrument.dataset.utcOffsetHours ?? "";
        probe.dataset.desktopInitialBoundary = desktopInstrument.dataset.dayBoundary ?? "";
      }

      if (!mobileApplied) {
        mobileApplied = true;
        mobileWin.__exactTimeContinuity = "alive";
        input.value = "2026-09-16 05:15:09";
        input.dispatchEvent(new Event("input", { bubbles:true }));
        apply.click();
        setTimeout(snapshot, 150);
        return;
      }

      const mobileUrl = new URL(mobileWin.location.href);
      probe.dataset.mobileRoundtripValue = input.value;
      probe.dataset.mobileSelectedInstantMs = instrument.dataset.selectedInstantMs ?? "";
      probe.dataset.mobileSource = instrument.dataset.lastSelectedInstantSource ?? "";
      probe.dataset.mobileUrlInstant = mobileUrl.searchParams.get("instant") ?? "";
      probe.dataset.mobileUrlUtc = mobileUrl.searchParams.get("utc") ?? "";
      probe.dataset.mobileUrlBoundary = mobileUrl.searchParams.get("dayBoundary") ?? "";
      probe.dataset.mobileUrlKeep = mobileUrl.searchParams.get("keep") ?? "";
      probe.dataset.mobileUrlHash = mobileUrl.hash;
      probe.dataset.mobileLegacyKeys = String(["lambda", "month", "yearStem"].some(key => mobileUrl.searchParams.has(key)));
      probe.dataset.mobileDocumentContinuity = String(mobileWin.__exactTimeContinuity === "alive");
      probe.dataset.mobileLoadCount = String(mobileLoadCount);
      probe.dataset.mobileStatusState = status.dataset.state ?? "";
      probe.dataset.mobileStatusText = status.textContent.trim();

      if (!desktopEdited) {
        desktopEdited = true;
        desktopInput.value = "2026-09-16T05:14:52";
        desktopInput.dispatchEvent(new Event("change", { bubbles:true }));
        setTimeout(snapshot, 120);
        return;
      }

      const desktopUrl = new URL(desktopWin.location.href);
      probe.dataset.desktopRoundtripValue = desktopInput.value;
      probe.dataset.desktopRoundtripValid = String(desktopInput.validity.valid);
      probe.dataset.desktopSelectedInstantMs = desktopInstrument.dataset.selectedInstantMs ?? "";
      probe.dataset.desktopSource = desktopInstrument.dataset.lastSelectedInstantSource ?? "";
      probe.dataset.desktopUrlInstant = desktopUrl.searchParams.get("instant") ?? "";
      probe.dataset.desktopUrlUtc = desktopUrl.searchParams.get("utc") ?? "";
      probe.dataset.desktopUrlBoundary = desktopUrl.searchParams.get("dayBoundary") ?? "";
      probe.dataset.desktopUrlKeep = desktopUrl.searchParams.get("keep") ?? "";
      probe.dataset.desktopUrlHash = desktopUrl.hash;
      probe.dataset.desktopLegacyKeys = String(["lambda", "month", "yearStem"].some(key => desktopUrl.searchParams.has(key)));
      probe.dataset.ready = "true";
    }

    mobileFrame.addEventListener("load", () => {
      mobileLoadCount += 1;
      mobileLoaded = true;
      queueMicrotask(snapshot);
      setTimeout(snapshot, 100);
      setTimeout(snapshot, 700);
    });
    desktopFrame.addEventListener("load", () => {
      desktopLoaded = true;
      queueMicrotask(snapshot);
      setTimeout(snapshot, 100);
      setTimeout(snapshot, 700);
    });
  </script>
</body>
</html>

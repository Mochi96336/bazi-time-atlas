<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R16 closure spine geometry browser proof</title>
<style>
html,body{margin:0;background:#0d1110}
#page{display:block;border:0;width:390px;height:1100px;background:#0d1110}
#probe{display:none}
</style></head><body>
<iframe id="page" title="R16 closure spine prototype"></iframe>
<output id="probe" data-ready="false" data-error="initializing"></output>
<script>
const qs=new URLSearchParams(location.search);
const width=[320,390,900].includes(Number(qs.get("width")))?Number(qs.get("width")):390;
const page=document.getElementById("page"),probe=document.getElementById("probe");
page.style.width=width+"px";
page.style.height=width>540?"1200px":"1100px";
const check=(ok,msg)=>{if(!ok)throw Error(msg)};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function eventually(predicate,msg){
  for(let i=0;i<200;i++){if(predicate())return;await wait(70);}
  throw Error(msg);
}
page.addEventListener("load",async()=>{
  try {
    const doc=page.contentDocument;
    await eventually(()=>doc.getElementById("closure-fan")?.querySelectorAll("[data-phase-cell]").length===160 &&
      page.contentWindow.__closureSpineDebug,"prototype did not render");
    const api=page.contentWindow.__closureSpineDebug;
    const fan=doc.getElementById("closure-fan");
    check(doc.querySelectorAll("[data-phase-cell]").length===160,"160 original fan sectors changed");
    check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+2,"horizontal overflow at "+width);
    const box=fan.getBoundingClientRect();
    check(box.width>=width*.7 && box.height>60,"diagram unexpectedly small or absent");
    for(const expected of [
      [1,["gregorian"]],
      [3,["year,gregorian"]],
      [20,["day","gregorian"]],
      [60,["day,year,gregorian"]]
    ]) {
      api.setStep(expected[0]);
      const actual=[...doc.querySelectorAll(".closure-run")].map(el=>el.dataset.closedRings);
      check(JSON.stringify(actual)===JSON.stringify(expected[1]),
        "incorrect closure segments at "+expected[0]+": "+JSON.stringify(actual));
    }
    check(api.snapshot().allClosed,"60th step not fully aligned");
    check(doc.getElementById("geometry-caption").textContent.includes("完整重合"),"closing caption absent");
    // Take the visually important broken 8,000-year state as screenshot.
    api.setStep(20);
    check(!api.snapshot().rings.find(r=>r.key==="year").closed,"8,000 year middle ring accidentally closed");
    probe.dataset.ready="true";
    probe.dataset.cells="160";
    probe.dataset.originalGeometry="true";
    probe.dataset.broken8000="true";
    probe.dataset.complete24000="true";
    probe.dataset.viewport=String(width);
    probe.dataset.fanBox=[box.width,box.height].map(Math.round).join(",");
  } catch(error){
    probe.dataset.error=String(error.stack||error);
    probe.dataset.ready="error";
  }
});
page.src=new URL("../../prototypes/research-r16-closure-spine.html?step=1",location.href).href;
</script>
</body></html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Research task anchor geometry probe</title>
  <style>
    html,body{margin:0;background:#0a0e12;overflow:hidden}
    #stage{display:block;border:0}
    #probe{display:none}
  </style>
</head>
<body>
  <iframe id="stage" title="Research anchor geometry viewport"></iframe>
  <output id="probe" data-ready="false"></output>
  <script>
    const params=new URLSearchParams(location.search);
    const target=params.get("target")||"research-astronomy";
    const width=Math.max(320,Math.min(2047,Number(params.get("width"))||390));
    const height=Math.max(480,Math.min(1600,Number(params.get("height"))||844));
    const stage=document.querySelector("#stage");
    const probe=document.querySelector("#probe");
    stage.style.width=width+"px";
    stage.style.height=height+"px";
    stage.src=new URL("../../recurrence.html?delta=24000",location.href).href;
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    stage.addEventListener("load",async()=>{
      try{
        const doc=stage.contentDocument;
        const win=stage.contentWindow;
        await wait(420);
        const link=doc.querySelector(`.research-outline a[href="#${target}"]`);
        if(!link)throw new Error("missing outline link for "+target);
        link.click();
        await new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
        await wait(220);
        const task=doc.getElementById(target);
        const heading=task?.querySelector(".research-task-head");
        const sticky=doc.getElementById("research-time-state");
        if(!task||!heading||!sticky)throw new Error("missing task heading or sticky state");
        const headingRect=heading.getBoundingClientRect();
        const stickyRect=sticky.getBoundingClientRect();
        probe.dataset.target=target;
        probe.dataset.stuck=sticky.dataset.stuck||"false";
        probe.dataset.headingTop=headingRect.top.toFixed(2);
        probe.dataset.stickyBottom=stickyRect.bottom.toFixed(2);
        probe.dataset.headingGap=(headingRect.top-stickyRect.bottom).toFixed(2);
        probe.dataset.ready="true";
      }catch(error){
        probe.dataset.ready="error";
        probe.dataset.error=String(error);
      }
    });
  </script>
</body>
</html>

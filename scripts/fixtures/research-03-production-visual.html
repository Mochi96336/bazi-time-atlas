<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Research 03 production visual harness</title>
  <style>
    html,body{margin:0;overflow:hidden;background:#0a0e12}
    #stage{display:block;border:0;background:#0a0e12}
    #probe{display:none}
  </style>
</head>
<body>
  <iframe id="stage" title="Research 03 production viewport"></iframe>
  <output id="probe" data-ready="false"></output>
  <script>
    const params=new URLSearchParams(location.search);
    const width=Math.max(320,Math.min(2047,Number(params.get("width"))||1440));
    const height=Math.max(480,Math.min(2400,Number(params.get("height"))||900));
    const frame=document.querySelector("#stage");
    const probe=document.querySelector("#probe");
    document.documentElement.style.width=(width<=390?500:width)+"px";
    document.body.style.width=(width<=390?500:width)+"px";
    document.documentElement.style.height=height+"px";
    document.body.style.height=height+"px";
    frame.style.width=width+"px";
    frame.style.height=height+"px";
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    frame.addEventListener("load",async()=>{
      try{
        const doc=frame.contentDocument;
        const win=frame.contentWindow;
        for(let i=0;i<220;i++){
          const conclusion=doc?.getElementById("absolute-boundary-consequence");
          const determinacy=doc?.getElementById("four-pillar-determinacy");
          if(conclusion?.dataset.ready==="true"&&determinacy?.dataset.ready==="true")break;
          await wait(40);
        }
        const conclusion=doc?.getElementById("absolute-boundary-consequence");
        const determinacy=doc?.getElementById("four-pillar-determinacy");
        if(!conclusion||conclusion.dataset.ready!=="true"||determinacy?.dataset.ready!=="true"){
          throw new Error("Research 03 did not become ready");
        }
        doc.getElementById("research-evidence")?.scrollIntoView({block:"start"});
        await new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
        await wait(120);
        // Research redesign R4: the verdict is the figure; the reference-frame
        // explanation follows it inside "#research-evidence-why".
        const why=doc.getElementById("research-evidence-why");
        if(!why||!why.contains(conclusion)||!(determinacy.compareDocumentPosition(why)&Node.DOCUMENT_POSITION_FOLLOWING))
          throw new Error("Reference frame explanation must follow the pillar verdict");
        why.open=true;
        await new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
        const timeState=doc?.getElementById("research-time-state");
        const timeKicker=doc?.getElementById("research-time-kicker");
        if(timeState?.dataset.context!=="evidence"||timeKicker?.textContent.trim()!=="03 · 四柱判定／同一太陽黃經"){
          throw new Error("Research 03 sticky time context did not switch from the shared seasonal owner");
        }
        const verdictPx=Number.parseFloat(win.getComputedStyle(doc.querySelector(".determinacy-verdict small")).fontSize);
        const cardPx=Number.parseFloat(win.getComputedStyle(doc.querySelector(".determinacy-card p")).fontSize);
        const footPx=Number.parseFloat(win.getComputedStyle(doc.querySelector(".determinacy-foot")).fontSize);
        if(verdictPx<12||cardPx<11.5||footPx<11.5)
          throw new Error(`Research 03 condition text too small: verdict ${verdictPx}px, pillar ${cardPx}px, boundary ${footPx}px`);
        const heading=doc.querySelector("#research-evidence > .research-task-head");
        if(heading && heading.scrollWidth>heading.clientWidth+2)
          throw new Error("Research 03 heading overflows its viewport");
        const firstCard=doc.querySelector(".determinacy-card");
        const cardHeader=firstCard?.querySelector("header");
        const cardStatus=firstCard?.querySelector(".determinacy-status");
        const cardHeight=firstCard?.getBoundingClientRect().height??0;
        const statusGap=(cardStatus?.getBoundingClientRect().top??0)-(cardHeader?.getBoundingClientRect().bottom??0);
        if(cardHeight>205||statusGap>32)
          throw new Error(`Research 03 still has decorative blank cards: card=${cardHeight}px, gap=${statusGap}px`);
        // Mobile: screenshot readiness also proves meaningful reader-sized
        // text and a full-width reference-frame / pillar evidence hierarchy.
        if(width<=390){
          const fork=doc.querySelector(".research-alignment-fork");
          const forkReason=doc.querySelector(".research-alignment-fork small");
          const forkNote=doc.querySelector(".absolute-boundary-note");
          const grid=doc.querySelector(".determinacy-grid");
          const forkReasonPx=Number.parseFloat(win.getComputedStyle(forkReason).fontSize);
          const forkNotePx=Number.parseFloat(win.getComputedStyle(forkNote).fontSize);
          const reasonPx=Number.parseFloat(win.getComputedStyle(firstCard.querySelector("p")).fontSize);
          const forkColumns=win.getComputedStyle(fork).gridTemplateColumns.split(" ").length;
          const pillarColumns=win.getComputedStyle(grid).gridTemplateColumns.split(" ").length;
          if(forkReasonPx<12.5||forkNotePx<12.5||reasonPx<12.5||
             forkColumns!==1||pillarColumns!==1)
            throw new Error(`Research 03 mobile reasons are unreadable or cramped: fork=${forkReasonPx}px, note=${forkNotePx}px, reason=${reasonPx}px, columns=${forkColumns}/${pillarColumns}`);
          if(fork.scrollWidth>fork.clientWidth+2||grid.scrollWidth>grid.clientWidth+2)
            throw new Error("Research 03 mobile evidence columns overflow");
          probe.dataset.compositionMobileForkPx=String(forkReasonPx);
          probe.dataset.compositionMobilePillarPx=String(reasonPx);
        }
        probe.dataset.compositionCardHeight=String(Math.round(cardHeight));
        probe.dataset.compositionStatusGap=String(Math.round(statusGap));
        probe.dataset.readingVerdictPx=String(verdictPx);
        probe.dataset.readingCardPx=String(cardPx);
        probe.dataset.readingFootPx=String(footPx);
        probe.dataset.ready="true";
        probe.dataset.timeContext=timeState.dataset.context||"";
        probe.dataset.timeKicker=timeKicker.textContent.trim();
        probe.dataset.conclusionGrammar=conclusion.dataset.diagramGrammar||"";
        probe.dataset.pillarGrammar=determinacy.dataset.diagramGrammar||"";
        probe.dataset.yearStatus=determinacy.dataset.yearStatus||"";
        probe.dataset.monthStatus=determinacy.dataset.monthStatus||"";
        probe.dataset.dayStatus=determinacy.dataset.dayStatus||"";
        probe.dataset.hourStatus=determinacy.dataset.hourStatus||"";
        probe.dataset.innerWidth=String(win.innerWidth);
      }catch(error){
        probe.dataset.ready="error";
        probe.dataset.error=String(error);
      }
    });
    // Observe the iframe before navigation: a fast cached frame must not
    // finish before its proof listener has been registered.
    frame.src=new URL("../../recurrence.html?date=2026-09-13&delta=24000",location.href).href;
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wide desktop composition probe</title>
  <style>
    html, body { margin: 0; background: #090a0b; }
    #frame { display: block; width: 2047px; height: 1038px; border: 0; }
    #probe { display: none; }
  </style>
</head>
<body>
  <iframe
    id="frame"
    title="2047 by 1038 Atlas review frame"
    src="../../?analysis=1&amp;instant=2026-09-13T23%3A43%3A42.000Z"
  ></iframe>
  <div id="probe" data-ready="false"></div>
  <script type="module">
    const frame = document.querySelector("#frame");
    const probe = document.querySelector("#probe");

    const rect = node => node?.getBoundingClientRect() ?? null;
    const num = value => Number.parseFloat(value || "0");
    const round = value => String(Math.round(value * 100) / 100);
    const display = (win, node) => node ? win.getComputedStyle(node).display : "missing";
    const displayVisibleCount = (win, nodes) => [...nodes]
      .filter(node => win.getComputedStyle(node).display !== "none")
      .length;
    const renderedVisibleCount = (win, nodes) => [...nodes]
      .filter(node => win.getComputedStyle(node).display !== "none" && node.getClientRects().length > 0)
      .length;

    function settle(win, callback) {
      const retry = attemptsLeft => {
        if (callback() || attemptsLeft <= 0) return;
        win.setTimeout(() => retry(attemptsLeft - 1), 250);
      };
      win.requestAnimationFrame(() => {
        win.requestAnimationFrame(() => {
          win.setTimeout(() => retry(12), 700);
        });
      });
    }

    function snapshot() {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!win || !doc) return false;

      const instrument = doc.querySelector("#kinetic-instrument");
      const topbar = doc.querySelector(".kinetic-topbar");
      const siteNav = doc.querySelector(".kinetic-topbar .site-nav");
      const research = doc.querySelector('.kinetic-topbar .research-link[data-nav-role="research"]');
      const readout = doc.querySelector(".instrument-readout");
      const toolbar = doc.querySelector(".instrument-toolbar");
      const legend = doc.querySelector(".ring-legend");
      const reference = doc.querySelector(".reference-frame-control");
      const timeline = doc.querySelector(".timeline-dock");
      const solar = doc.querySelector(".atlas-solar-time-analysis");
      const solarButton = doc.querySelector("#solar-time-tool-button");
      const evidence = doc.querySelector(".atlas-visible-ten-gods");
      const evidenceGrid = doc.querySelector(".atlas-visible-ten-gods-grid");
      const evidenceValue = doc.querySelector(".atlas-visible-ten-gods-cell strong");
      const evidenceInfo = [
        doc.querySelector(".atlas-visible-ten-gods-head strong"),
        doc.querySelector(".atlas-visible-ten-gods-master"),
        ...doc.querySelectorAll(".atlas-visible-ten-gods-cell span"),
        ...doc.querySelectorAll(".atlas-visible-ten-gods-cell small")
      ].filter(Boolean);
      const toolbarButton = doc.querySelector("#classification-overlay-button");
      const close = doc.querySelector("#analysis-close");
      const play = doc.querySelector("#play-button");
      const stateStrip = doc.querySelector(".state-strip");
      const notes = doc.querySelector(".atlas-notes");
      const sources = doc.querySelector(".sources-panel");
      const scaleButtons = doc.querySelectorAll(".scale-button");
      const ringToggles = doc.querySelectorAll(".ring-legend-row[data-ring-toggle]");
      const hourLabels = doc.querySelectorAll("#hour-track .cycle-label");
      const dayLabels = doc.querySelectorAll("#day-track .cycle-label");
      if (!instrument || !topbar || !siteNav || !research || !readout || !toolbar || !legend || !reference || !timeline || !solar || !evidence || !evidenceGrid || !evidenceValue || !toolbarButton || !close || !play || !stateStrip || !notes || !sources) return false;

      const instrumentRect = rect(instrument);
      const topbarRect = rect(topbar);
      const siteNavRect = rect(siteNav);
      const researchRect = rect(research);
      const readoutRect = rect(readout);
      const toolbarRect = rect(toolbar);
      const legendRect = rect(legend);
      const referenceRect = rect(reference);
      const timelineRect = rect(timeline);
      const solarRect = rect(solar);
      const evidenceRect = rect(evidence);
      const evidenceGridRect = rect(evidenceGrid);
      const closeRect = rect(close);
      const evidenceStyle = win.getComputedStyle(evidenceValue);
      const evidenceInfoFonts = evidenceInfo
        .map(node => num(win.getComputedStyle(node).fontSize))
        .filter(Number.isFinite);
      const toolbarStyle = win.getComputedStyle(toolbarButton);
      const referenceStyle = win.getComputedStyle(reference);
      const closeStyle = win.getComputedStyle(close);
      const researchStyle = win.getComputedStyle(research);

      Object.assign(probe.dataset, {
        ready: "true",
        innerWidth: String(win.innerWidth),
        innerHeight: String(win.innerHeight),
        scrollWidth: String(Math.max(doc.documentElement.scrollWidth, doc.body.scrollWidth)),
        scrollHeight: String(Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight)),
        analysisOpen: instrument.dataset.analysisOpen ?? "",
        instrumentTop: round(instrumentRect.top),
        instrumentBottom: round(instrumentRect.bottom),
        topbarTop: round(topbarRect.top),
        topbarBottom: round(topbarRect.bottom),
        siteNavDisplay: display(win, siteNav),
        siteNavRight: round(siteNavRect.right),
        researchTop: round(researchRect.top),
        researchBottom: round(researchRect.bottom),
        researchHeight: round(researchRect.height),
        researchLineHeight: researchStyle.lineHeight,
        instrumentHeight: round(instrumentRect.height),
        instrumentBottomGap: round(win.innerHeight - instrumentRect.bottom),
        readoutTop: round(readoutRect.top),
        readoutBottom: round(readoutRect.bottom),
        readoutBottomGap: round(win.innerHeight - readoutRect.bottom),
        toolbarTop: round(toolbarRect.top),
        toolbarBottom: round(toolbarRect.bottom),
        toolbarLeft: round(toolbarRect.left),
        toolbarRight: round(toolbarRect.right),
        legendDisplay: display(win, legend),
        referenceDisplay: display(win, reference),
        legendTop: round(legendRect.top),
        legendBottom: round(legendRect.bottom),
        legendLeft: round(legendRect.left),
        legendRight: round(legendRect.right),
        referenceTop: round(referenceRect.top),
        referenceBottom: round(referenceRect.bottom),
        timelineDisplay: display(win, timeline),
        timelineTop: round(timelineRect.top),
        timelineBottom: round(timelineRect.bottom),
        timelineLeft: round(timelineRect.left),
        timelineRight: round(timelineRect.right),
        solarDisplay: display(win, solar),
        solarButtonDisplay: display(win, solarButton),
        solarButtonPressed: solarButton?.getAttribute("aria-pressed") ?? "missing",
        solarTop: round(solarRect.top),
        solarBottom: round(solarRect.bottom),
        solarLeft: round(solarRect.left),
        solarRight: round(solarRect.right),
        evidenceTop: round(evidenceRect.top),
        evidenceBottom: round(evidenceRect.bottom),
        evidenceLeft: round(evidenceRect.left),
        evidenceRight: round(evidenceRect.right),
        evidenceGridWidth: round(evidenceGridRect.width),
        closeTop: round(closeRect.top),
        closeBottom: round(closeRect.bottom),
        closeRight: round(closeRect.right),
        toolbarFont: round(num(toolbarStyle.fontSize)),
        referenceFont: round(num(referenceStyle.fontSize)),
        evidenceValueFont: round(num(evidenceStyle.fontSize)),
        evidenceInfoMinFont: round(Math.min(...evidenceInfoFonts)),
        closeFont: round(num(closeStyle.fontSize)),
        scaleVisible: String(renderedVisibleCount(win, scaleButtons)),
        ringToggleVisible: String(renderedVisibleCount(win, ringToggles)),
        hourVisibleLabels: String(displayVisibleCount(win, hourLabels)),
        dayVisibleLabels: String(displayVisibleCount(win, dayLabels)),
        playDisplay: display(win, play),
        stateStripDisplay: display(win, stateStrip),
        notesDisplay: display(win, notes),
        sourcesDisplay: display(win, sources),
      });
      return true;
    }

    frame.addEventListener("load", () => settle(frame.contentWindow, snapshot), { once: true });
  </script>
</body>
</html>

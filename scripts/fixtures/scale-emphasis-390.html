<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>390px scale emphasis harness</title>
  <style>
    html, body { margin:0; width:500px; height:844px; overflow:hidden; background:#0b0f0c; }
    #stage { display:block; width:390px; height:844px; border:0; background:#0b0f0c; }
    #probe { display:none; }
  </style>
</head>
<body>
  <iframe id="stage" title="390px scale emphasis probe"></iframe>
  <output id="probe" data-ready="false"></output>
  <script>
    const frame = document.querySelector("#stage");
    const probe = document.querySelector("#probe");
    const RINGS = ["hour", "day", "solar", "zodiac", "month", "year"];
    frame.src = new URL("../../?instant=2027-03-15T13%3A20%3A09.000Z", location.href).href;

    function computed(win, doc, selector) {
      const node = doc.querySelector(selector);
      return node ? win.getComputedStyle(node) : null;
    }

    function opacity(win, doc, selector) {
      const style = computed(win, doc, selector);
      return style ? Number(style.opacity) : NaN;
    }

    function filter(win, doc, selector) {
      return computed(win, doc, selector)?.filter ?? "missing";
    }

    function cap(id) {
      return id[0].toUpperCase() + id.slice(1);
    }

    function snapshotTracks(win, doc, prefix) {
      for (const id of RINGS) {
        probe.dataset[`${prefix}${cap(id)}TrackOpacity`] = String(opacity(win, doc, `#${id}-track`));
        probe.dataset[`${prefix}${cap(id)}TrackFilter`] = filter(win, doc, `#${id}-track`);
      }
    }

    function snapshotRoles(win, doc, prefix) {
      const selectors = {
        hourSurface:"#hour-track .cycle-sector:not(.is-active)",
        hourStructure:"#hour-track .ring-tick",
        hourContext:"#hour-track .cycle-label:not(.active-cycle-label)",
        hourActiveSurface:"#hour-track .cycle-sector.is-active",
        hourActive:"#hour-track .active-cycle-label",
        daySurface:"#day-track .cycle-sector:not(.is-active)",
        dayStructure:"#day-track .ring-tick",
        dayContext:"#day-track .cycle-label:not(.active-cycle-label)",
        dayActiveSurface:"#day-track .cycle-sector.is-active",
        dayActive:"#day-track .active-cycle-label",
        solarSurface:"#solar-track .term-sector:not(.is-active)",
        solarStructure:"#solar-track .term-mark",
        solarContext:"#solar-track .term-label:not(.active-cycle-label)",
        solarActiveSurface:"#solar-track .term-sector.is-active",
        solarActive:"#solar-track .active-cycle-label",
        zodiacSurface:"#zodiac-track .zodiac-sector:not(.is-active)",
        zodiacContext:"#zodiac-track .zodiac-label:not(.active-cycle-label)",
        zodiacActiveSurface:"#zodiac-track .zodiac-sector.is-active",
        zodiacActive:"#zodiac-track .active-cycle-label",
        monthSurface:"#month-track .cycle-sector:not(.is-active)",
        monthStructure:"#month-track .ring-tick",
        monthContext:"#month-track .cycle-label:not(.active-cycle-label)",
        monthActiveSurface:"#month-track .cycle-sector.is-active",
        monthActive:"#month-track .active-cycle-label",
        yearSurface:"#year-track .cycle-sector:not(.is-active)",
        yearStructure:"#year-track .ring-tick",
        yearContext:"#year-track .cycle-label:not(.active-cycle-label)",
        yearActiveSurface:"#year-track .cycle-sector.is-active",
        yearActive:"#year-track .active-cycle-label"
      };
      for (const [name, selector] of Object.entries(selectors)) {
        probe.dataset[`${prefix}${cap(name)}Opacity`] = String(opacity(win, doc, selector));
      }
    }

    function displayed(win, doc, id) {
      return computed(win, doc, `#${id}-track`)?.display !== "none";
    }

    function settle(callback) {
      queueMicrotask(() => queueMicrotask(callback));
    }

    frame.addEventListener("load", () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const instrument = doc?.querySelector("#kinetic-instrument");
      const svg = doc?.querySelector("#kinetic-wheel");
      if (!win || !doc || !instrument || !svg) return;

      const disableTransitions = doc.createElement("style");
      disableTransitions.textContent = "#hour-track *,#day-track *,#solar-track *,#zodiac-track *,#month-track *,#year-track *,.ring-legend-row{transition:none!important}";
      doc.head.append(disableTransitions);

      const waitForApp = () => {
        if (!instrument.dataset.selectedInstantMs || !instrument.dataset.scaleWindow || !doc.querySelector("#year-track .active-cycle-label[data-cycle-index]")) {
          setTimeout(waitForApp, 50);
          return;
        }

        const selectedBefore = instrument.dataset.selectedInstantMs;
        probe.dataset.innerWidth = String(win.innerWidth);
        probe.dataset.initialWindow = instrument.dataset.scaleWindow;
        probe.dataset.initialFocus = instrument.dataset.scaleFocusRings ?? "";
        probe.dataset.initialContext = instrument.dataset.scaleContextRings ?? "";
        probe.dataset.initialAmbient = instrument.dataset.scaleAmbientRings ?? "";
        probe.dataset.initialReadout = doc.querySelector("#scale-readout")?.textContent?.trim() ?? "";
        snapshotTracks(win, doc, "year");
        snapshotRoles(win, doc, "year");

        doc.querySelector('[data-scale="day"]')?.click();
        settle(() => {
          probe.dataset.dayWindow = instrument.dataset.scaleWindow ?? "";
          probe.dataset.dayFocus = instrument.dataset.scaleFocusRings ?? "";
          probe.dataset.dayContext = instrument.dataset.scaleContextRings ?? "";
          probe.dataset.dayAmbient = instrument.dataset.scaleAmbientRings ?? "";
          probe.dataset.dayReadout = doc.querySelector("#scale-readout")?.textContent?.trim() ?? "";
          probe.dataset.daySelectedInstant = instrument.dataset.selectedInstantMs ?? "";
          snapshotTracks(win, doc, "day");
          snapshotRoles(win, doc, "day");

          svg.dataset.hoverRing = "year";
          settle(() => {
            probe.dataset.dayHoverYearSurfaceOpacity = String(opacity(win, doc, "#year-track .cycle-sector:not(.is-active)"));
            probe.dataset.dayHoverYearStructureOpacity = String(opacity(win, doc, "#year-track .ring-tick"));
            probe.dataset.dayHoverYearContextOpacity = String(opacity(win, doc, "#year-track .cycle-label:not(.active-cycle-label)"));
            probe.dataset.dayHoverYearActiveSurfaceOpacity = String(opacity(win, doc, "#year-track .cycle-sector.is-active"));
            probe.dataset.dayHoverYearActiveOpacity = String(opacity(win, doc, "#year-track .active-cycle-label"));
            delete svg.dataset.hoverRing;

            doc.querySelector('[data-scale="cycle"]')?.click();
            settle(() => {
              probe.dataset.cycleWindow = instrument.dataset.scaleWindow ?? "";
              probe.dataset.cycleFocus = instrument.dataset.scaleFocusRings ?? "";
              probe.dataset.cycleContext = instrument.dataset.scaleContextRings ?? "";
              probe.dataset.cycleAmbient = instrument.dataset.scaleAmbientRings ?? "";
              probe.dataset.cycleReadout = doc.querySelector("#scale-readout")?.textContent?.trim() ?? "";
              probe.dataset.cycleSelectedInstant = instrument.dataset.selectedInstantMs ?? "";
              snapshotTracks(win, doc, "cycle");
              snapshotRoles(win, doc, "cycle");

              probe.dataset.allPrimaryDisplayed = String(["hour", "day", "solar", "month", "year"].every(id => displayed(win, doc, id)));
              probe.dataset.zodiacDisplayed = String(displayed(win, doc, "zodiac"));
              probe.dataset.selectedInstantBefore = selectedBefore;
              probe.dataset.activeScaleButtons = String(doc.querySelectorAll('.scale-button.active').length);
              probe.dataset.currentScaleButton = doc.querySelector('.scale-button.active')?.dataset.scale ?? "";
              probe.dataset.currentAriaScale = doc.querySelector('.scale-button[aria-current="true"]')?.dataset.scale ?? "";
              probe.dataset.ready = "true";
            });
          });
        });
      };
      waitForApp();
    });
  </script>
</body>
</html>

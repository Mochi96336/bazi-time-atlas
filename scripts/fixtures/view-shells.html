<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Cross-view shell regression fixture</title>
  <style>
    html, body { margin:0; width:1700px; min-height:2200px; background:#080b09; }
    .frames { display:flex; flex-wrap:wrap; gap:8px; }
    iframe { border:0; display:block; }
    .mobile { width:390px; height:844px; }
    .desktop { width:1200px; height:900px; }
    #probe { display:none; }
  </style>
</head>
<body>
  <div class="frames">
    <iframe id="atlas-mobile" class="mobile" title="atlas mobile"></iframe>
    <iframe id="recurrence-mobile" class="mobile" title="recurrence mobile"></iframe>
    <iframe id="birth-mobile" class="mobile" title="birth mobile"></iframe>
    <iframe id="sexagenary-mobile" class="mobile" title="legacy Ganzhi mobile redirect"></iframe>
    <iframe id="sexagenary-desktop" class="desktop" title="bare legacy Sexagenary desktop redirect"></iframe>
  </div>
  <output id="probe" data-ready="false"></output>

  <script>
    const EXPECTED_NAV = ["時間圖譜", "研究"];
    const probe = document.querySelector("#probe");
    const specs = [
      ["atlas-mobile", "../../"],
      ["recurrence-mobile", "../../recurrence.html"],
      ["birth-mobile", "../../birth.html"],
      ["sexagenary-mobile", "../../sexagenary.html?ganzhi=丁卯"],
      ["sexagenary-desktop", "../../sexagenary.html"]
    ];

    const loaded = new Set();
    let settleTimer = null;

    function navLinks(doc) {
      return [...doc.querySelectorAll(".site-nav a")];
    }

    function surfaceToken(win, node) {
      if (!node) return "missing";
      const style = win.getComputedStyle(node);
      return [style.backgroundColor, style.backgroundImage, style.borderColor].join("|");
    }

    function hidden(win, node) {
      return !node || win.getComputedStyle(node).display === "none";
    }

    function captureReference(prefix, win, doc) {
      const inspector = doc.querySelector("#ganzhi-inspector");
      const grid = doc.querySelector("#ganzhi-inspector-grid");
      probe.dataset[`${prefix}ColorScheme`] = win.getComputedStyle(doc.body).colorScheme;
      probe.dataset[`${prefix}LegacyWheelAbsent`] = String(!doc.querySelector("#sexagenary-wheel"));
      probe.dataset[`${prefix}ReferenceVisible`] = String(Boolean(inspector && !hidden(win, inspector)));
      probe.dataset[`${prefix}ReferenceMode`] = inspector?.dataset.mode ?? "missing";
      probe.dataset[`${prefix}ReferencePillar`] = inspector?.dataset.pillar ?? "missing";
      probe.dataset[`${prefix}ReferenceGanzhi`] = inspector?.dataset.ganzhi ?? "missing";
      probe.dataset[`${prefix}ReferenceReady`] = inspector?.dataset.ready ?? "missing";
      probe.dataset[`${prefix}ReferenceOrdinal`] = doc.querySelector("#ganzhi-inspector-ordinal")?.textContent.trim() ?? "missing";
      probe.dataset[`${prefix}ReferenceStemName`] = doc.querySelector("#ganzhi-inspector-stem")?.textContent.trim() ?? "missing";
      probe.dataset[`${prefix}ReferenceStemMeta`] = doc.querySelector("#ganzhi-inspector-stem-meta")?.textContent.trim() ?? "missing";
      probe.dataset[`${prefix}ReferenceBranchName`] = doc.querySelector("#ganzhi-inspector-branch")?.textContent.trim() ?? "missing";
      probe.dataset[`${prefix}ReferenceBranchMeta`] = doc.querySelector("#ganzhi-inspector-branch-meta")?.textContent.trim() ?? "missing";
      probe.dataset[`${prefix}ReferenceGridCount`] = String(grid?.querySelectorAll("[data-cycle-index]").length ?? -1);
    }

    function capture() {
      if (loaded.size !== specs.length) return;

      const docs = Object.fromEntries(specs.map(([id]) => {
        const frame = document.querySelector(`#${id}`);
        return [id, [frame.contentWindow, frame.contentDocument]];
      }));
      if (Object.values(docs).some(([, doc]) => !doc?.body)) return;

      const navMatches = {};
      for (const [id, [win, doc]] of Object.entries(docs)) {
        const links = navLinks(doc);
        const labels = links.map(node => node.textContent.trim());
        const researchLinks = links.filter(node => node.dataset.navRole === "research");
        const research = researchLinks[0] ?? null;
        const primary = links.find(node => node.dataset.navRole !== "research") ?? null;
        const researchStyle = research ? win.getComputedStyle(research) : null;
        const primaryStyle = primary ? win.getComputedStyle(primary) : null;
        const prefix = id.replaceAll("-", "");
        const researchContract = researchLinks.length === 1
          && research === links.at(-1)
          && research?.classList.contains("research-link")
          && research?.getAttribute("href") === "./recurrence.html";

        navMatches[id] = labels.length === EXPECTED_NAV.length
          && labels.every((label, index) => label === EXPECTED_NAV[index])
          && researchContract;
        probe.dataset[`${prefix}Nav`] = labels.join("|");
        probe.dataset[`${prefix}Width`] = String(win.innerWidth);
        probe.dataset[`${prefix}ResearchCount`] = String(researchLinks.length);
        probe.dataset[`${prefix}ResearchLast`] = String(research === links.at(-1));
        probe.dataset[`${prefix}ResearchClass`] = String(Boolean(research?.classList.contains("research-link")));
        probe.dataset[`${prefix}ResearchHref`] = research?.getAttribute("href") ?? "missing";
        probe.dataset[`${prefix}ResearchFontSize`] = researchStyle?.fontSize ?? "missing";
        probe.dataset[`${prefix}PrimaryFontSize`] = primaryStyle?.fontSize ?? "missing";
      }

      const [recurrenceWin, recurrenceDoc] = docs["recurrence-mobile"];
      const recurrenceInstrument = recurrenceDoc.querySelector("#recurrence-instrument");
      const recurrenceComparison = recurrenceDoc.querySelector("#research-cycle-comparison");
      const recurrenceYearCard = recurrenceDoc.querySelector(".research-cycles-year");
      const recurrenceDayCard = recurrenceDoc.querySelector(".research-cycles-day");
      const recurrenceToolbar = recurrenceDoc.querySelector(".recurrence-toolbar");
      const deltaDock = recurrenceDoc.querySelector(".delta-dock");
      const candidateButtons = recurrenceDoc.querySelector("#candidate-buttons");
      const deltaNumber = recurrenceDoc.querySelector("#delta-number");
      const deltaSlider = recurrenceDoc.querySelector("#delta-slider");
      const recurrenceOutline = recurrenceDoc.querySelector(".research-outline");
      const recurrenceOutlineLinks = [...recurrenceDoc.querySelectorAll(".research-outline a")];
      const recurrenceLede = recurrenceDoc.querySelector(".recurrence-intro .lede");
      const recurrenceScope = recurrenceDoc.querySelector(".scope-note");
      const sexagenaryDetails = recurrenceDoc.querySelector("#discrete-sexagenary-details");
      const astronomyTaskHead = recurrenceDoc.querySelector("#research-astronomy > .research-task-head");
      const researchTaskNav = recurrenceDoc.querySelector(".research-task-nav");
      const discreteTaskHead = recurrenceDoc.querySelector("#research-discrete > .research-task-head");
      const outlineLink = recurrenceDoc.querySelector(".research-outline a");
      const candidateButton = candidateButtons?.querySelector("button");
      const baseDateInput = recurrenceDoc.querySelector(".base-date input");
      const modelBoundarySummary = recurrenceDoc.querySelector(".model-boundary summary");
      const recurrenceRect = recurrenceInstrument?.getBoundingClientRect();
      const comparisonRect = recurrenceComparison?.getBoundingClientRect();
      const yearCardRect = recurrenceYearCard?.getBoundingClientRect();
      const dayCardRect = recurrenceDayCard?.getBoundingClientRect();
      const deltaDockRect = deltaDock?.getBoundingClientRect();
      const outlineRect = recurrenceOutline?.getBoundingClientRect();
      const sexagenaryDetailsRect = sexagenaryDetails?.getBoundingClientRect();
      const astronomyTaskHeadRect = astronomyTaskHead?.getBoundingClientRect();
      const taskNavRect = researchTaskNav?.getBoundingClientRect();
      const taskHeadRect = discreteTaskHead?.getBoundingClientRect();
      const outlineLinkRect = outlineLink?.getBoundingClientRect();
      const candidateButtonRect = candidateButton?.getBoundingClientRect();
      const deltaNumberRect = deltaNumber?.getBoundingClientRect();
      const deltaSliderRect = deltaSlider?.getBoundingClientRect();
      const baseDateInputRect = baseDateInput?.getBoundingClientRect();
      const modelBoundarySummaryRect = modelBoundarySummary?.getBoundingClientRect();
      const viewportHeight = recurrenceWin.innerHeight;
      const visibleInstrumentHeight = recurrenceRect
        ? Math.max(0, Math.min(recurrenceRect.bottom, viewportHeight) - Math.max(recurrenceRect.top, 0))
        : -1;
      probe.dataset.recurrenceLedeHidden = String(hidden(recurrenceWin, recurrenceLede));
      probe.dataset.recurrenceQuestionText = recurrenceLede?.textContent.trim() ?? "missing";
      probe.dataset.recurrenceSpineDiscrete = recurrenceDoc.querySelector("#research-spine-discrete")?.textContent.trim() ?? "missing";
      probe.dataset.recurrenceSpineAstronomy = recurrenceDoc.querySelector("#research-spine-astronomy")?.textContent.trim() ?? "missing";
      probe.dataset.recurrenceSpineEvidence = recurrenceDoc.querySelector("#research-spine-evidence")?.textContent.trim() ?? "missing";
      probe.dataset.recurrenceScopeHidden = String(hidden(recurrenceWin, recurrenceScope));
      probe.dataset.recurrenceOutlineVisible = String(Boolean(recurrenceOutline && !hidden(recurrenceWin, recurrenceOutline)));
      probe.dataset.recurrenceOutlineCount = String(recurrenceOutlineLinks.length);
      probe.dataset.recurrenceOutlineTop = String(Math.round(outlineRect?.top ?? -1));
      probe.dataset.recurrenceOutlineBottom = String(Math.round(outlineRect?.bottom ?? -1));
      probe.dataset.recurrenceOutlineHeight = String(Math.round(outlineRect?.height ?? -1));
      probe.dataset.recurrenceSexagenaryDetailsOpen = String(Boolean(sexagenaryDetails?.open));
      probe.dataset.recurrenceSexagenaryDetailsHeight = String(Math.round(sexagenaryDetailsRect?.height ?? -1));
      probe.dataset.recurrenceAstronomyTaskTop = String(Math.round(astronomyTaskHeadRect?.top ?? -1));
      probe.dataset.recurrenceTaskNavVisible = String(Boolean(researchTaskNav && !hidden(recurrenceWin, researchTaskNav)));
      probe.dataset.recurrenceTaskNavTop = String(Math.round(taskNavRect?.top ?? -1));
      probe.dataset.recurrenceTaskHeadTop = String(Math.round(taskHeadRect?.top ?? -1));
      probe.dataset.recurrenceTaskHeadBottom = String(Math.round(taskHeadRect?.bottom ?? -1));
      probe.dataset.recurrenceTaskHeadBeforeInstrument = String(Boolean(taskHeadRect && recurrenceRect && taskHeadRect.bottom <= recurrenceRect.top));
      probe.dataset.recurrencePrimaryComparisonReady = recurrenceComparison?.dataset.ready ?? "missing";
      probe.dataset.recurrencePrimaryComparisonTop = String(Math.round(comparisonRect?.top ?? -1));
      probe.dataset.recurrencePrimaryComparisonBottom = String(Math.round(comparisonRect?.bottom ?? -1));
      probe.dataset.recurrenceYearDaySameRow = String(Boolean(
        yearCardRect && dayCardRect && Math.abs(yearCardRect.top - dayCardRect.top) < 15
      ));
      probe.dataset.recurrenceYearDayFullyVisible = String(Boolean(
        yearCardRect && dayCardRect && yearCardRect.top >= 0 && dayCardRect.top >= 0
        && yearCardRect.bottom <= viewportHeight && dayCardRect.bottom <= viewportHeight
      ));
      probe.dataset.recurrenceComparisonBeforeFan = String(Boolean(
        comparisonRect && recurrenceRect && comparisonRect.bottom <= recurrenceRect.top
      ));
      probe.dataset.recurrenceInstrumentTop = String(Math.round(recurrenceRect?.top ?? -1));
      probe.dataset.recurrenceInstrumentHeight = String(Math.round(recurrenceRect?.height ?? -1));
      probe.dataset.recurrenceInstrumentVisibleHeight = String(Math.round(visibleInstrumentHeight));
      probe.dataset.recurrenceInstrumentStartsInFirstViewport = String(Boolean(
        recurrenceRect && recurrenceRect.top >= 0 && recurrenceRect.top < viewportHeight * .55
      ));
      probe.dataset.recurrenceCandidateInDeltaDock = String(Boolean(candidateButtons && deltaDock?.contains(candidateButtons)));
      probe.dataset.recurrenceCandidateInToolbar = String(Boolean(candidateButtons && recurrenceToolbar?.contains(candidateButtons)));
      probe.dataset.recurrenceDeltaNumberInDock = String(Boolean(deltaNumber && deltaDock?.contains(deltaNumber)));
      probe.dataset.recurrenceDeltaSliderInDock = String(Boolean(deltaSlider && deltaDock?.contains(deltaSlider)));
      probe.dataset.recurrenceCandidateCount = String(candidateButtons?.querySelectorAll("button").length ?? -1);
      probe.dataset.recurrenceOutlineLinkHeight = String(Math.round(outlineLinkRect?.height ?? -1));
      probe.dataset.recurrenceCandidateButtonHeight = String(Math.round(candidateButtonRect?.height ?? -1));
      probe.dataset.recurrenceDeltaNumberHeight = String(Math.round(deltaNumberRect?.height ?? -1));
      probe.dataset.recurrenceDeltaSliderHeight = String(Math.round(deltaSliderRect?.height ?? -1));
      probe.dataset.recurrenceBaseDateInputHeight = String(Math.round(baseDateInputRect?.height ?? -1));
      probe.dataset.recurrenceModelBoundarySummaryHeight = String(Math.round(modelBoundarySummaryRect?.height ?? -1));
      probe.dataset.recurrenceDeltaDockTop = String(Math.round(deltaDockRect?.top ?? -1));
      probe.dataset.recurrenceDeltaDockBottom = String(Math.round(deltaDockRect?.bottom ?? -1));
      probe.dataset.recurrenceDeltaDockBeforeInstrument = String(Boolean(
        recurrenceRect && deltaDockRect && deltaDockRect.bottom <= recurrenceRect.top
      ));
      probe.dataset.recurrenceDeltaDockInFirstViewport = String(Boolean(
        deltaDockRect && deltaDockRect.top >= 0 && deltaDockRect.bottom <= viewportHeight
      ));
      probe.dataset.recurrenceDeltaDockGap = String(Math.round(
        comparisonRect && deltaDockRect ? comparisonRect.top - deltaDockRect.bottom : -1
      ));

      const [birthWin, birthDoc] = docs["birth-mobile"];
      const birthBody = birthDoc.body;
      const controls = birthDoc.querySelector("#birth-form");
      const stage = birthDoc.querySelector(".birth-stage");
      const solar = birthDoc.querySelector("#mean-solar-preview");
      const tenGodDerivation = birthDoc.querySelector("#ten-gods-derivation");
      const relationOverview = birthDoc.querySelector("#relation-model-overview");
      const fieldHint = birthDoc.querySelector(".field-hint");
      const timeBasisNote = birthDoc.querySelector(".time-basis-note");

      probe.dataset.birthColorScheme = birthWin.getComputedStyle(birthBody).colorScheme;
      probe.dataset.birthPaper = birthWin.getComputedStyle(birthBody).getPropertyValue("--paper").trim();
      probe.dataset.birthControlsTop = String(Math.round(controls?.getBoundingClientRect().top ?? -1));
      probe.dataset.birthStageTop = String(Math.round(stage?.getBoundingClientRect().top ?? -1));
      probe.dataset.birthFieldHintHidden = String(hidden(birthWin, fieldHint));
      probe.dataset.birthTimeBasisHidden = String(hidden(birthWin, timeBasisNote));
      probe.dataset.birthSolarSurface = surfaceToken(birthWin, solar);
      probe.dataset.birthTenGodSurface = surfaceToken(birthWin, tenGodDerivation);
      probe.dataset.birthRelationSurface = surfaceToken(birthWin, relationOverview);

      const [sexMobileWin, sexMobileDoc] = docs["sexagenary-mobile"];
      captureReference("sex", sexMobileWin, sexMobileDoc);

      const [sexDesktopWin, sexDesktopDoc] = docs["sexagenary-desktop"];
      captureReference("sexDesktop", sexDesktopWin, sexDesktopDoc);

      probe.dataset.allNavMatch = String(Object.values(navMatches).every(Boolean));
      probe.dataset.ready = "true";
    }

    function scheduleCapture() {
      clearTimeout(settleTimer);
      settleTimer = setTimeout(capture, 250);
    }

    for (const [id, path] of specs) {
      const frame = document.querySelector(`#${id}`);
      frame.addEventListener("load", () => {
        loaded.add(id);
        scheduleCapture();
        setTimeout(capture, 800);
        setTimeout(capture, 1800);
      });
      frame.src = new URL(path, location.href).href;
    }
  </script>
</body>
</html>

<!doctype html>
<meta charset="utf-8">
<title>Mobile camera startup and resize contract</title>
<style>body{margin:0;background:#090b0f;color:#eee}iframe{display:block;width:390px;height:844px;border:0}pre{display:none}</style>
<iframe id="stage" title="Actual mobile homepage with delayed startup"></iframe>
<pre id="proof" data-ready="false"></pre>
<script type="module">
const stage = document.querySelector("#stage");
const proof = document.querySelector("#proof");
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const params = new URLSearchParams(location.search);
const capture = params.get("capture") === "1";
let layoutStarted = false;

async function until(check, message) {
  for (let n = 0; n < 100; n++) {
    if (check()) return;
    // Virtual-time timers can outrun ResizeObserver/compositor delivery. Once
    // layout starts, wait for actual render frames rather than a timer deadline.
    if (layoutStarted) await new Promise(resolve => stage.contentWindow.requestAnimationFrame(resolve));
    else await sleep(25);
  }
  throw new Error(message);
}

try {
  const base = new URL("../../", location.href).href;
  let html = await (await fetch(new URL("index.html", base))).text();
  // Let every other module boot first, then initialize the real renderer well
  // beyond the old 12-frame startup deadline. Start with an actual zero box.
  html = html.replace("<head>", `<head><base href="${base}"><style id="camera-startup-hidden">#kinetic-instrument{display:none!important}</style>`);
  html = html.replace('<script type="module" src="./src/kinetic-atlas.js"></' + 'script>',
    '<script type="module">await new Promise(resolve=>setTimeout(resolve,600));await import("./src/kinetic-atlas.js");</' + 'script>');
  stage.srcdoc = html;
  let win, doc, instrument, svg;
  await until(() => {
    win = stage.contentWindow; doc = stage.contentDocument;
    instrument = doc?.querySelector("#kinetic-instrument"); svg = doc?.querySelector("#kinetic-wheel");
    return Boolean(instrument?.dataset.selectedInstantMs);
  }, "delayed renderer did not initialize");
  const selectedMs = instrument.dataset.selectedInstantMs;
  const pose = () => ["hour", "day", "solar", "zodiac", "month", "year"]
    .map(id => svg.querySelector(`#${id}-track`).getAttribute("transform"));
  const originalPose = pose();
  const zeroSizeDeferred = !instrument.dataset.geometryCameraMode && svg.getAttribute("viewBox") === "0 0 1200 760";
  doc.querySelector("#camera-startup-hidden").remove();
  layoutStarted = true;

  function cameraMatchesBox() {
    const rect = svg.getBoundingClientRect();
    const box = svg.getAttribute("viewBox").split(/\s+/).map(Number);
    return rect.width > 0 && rect.height > 0 &&
      Math.abs(box[2] / box[3] - rect.width / rect.height) < 0.00001 &&
      doc.querySelector(".orbital-space").getAttribute("viewBox") === svg.getAttribute("viewBox");
  }
  await until(cameraMatchesBox, "portrait camera did not recover after zero-sized startup");
  if (!zeroSizeDeferred) throw new Error("zero-sized startup installed a fallback camera");
  if (instrument.dataset.fanClip !== "active" || svg.querySelectorAll('#kinetic-fan-layer > g[id$="-track"]').length !== 6) {
    throw new Error("delayed renderer missed master fan installation");
  }
  const startupViewBox = svg.getAttribute("viewBox");
  const startupHeight = svg.getBoundingClientRect().height;
  if (!capture) {
    let windowResizes = 0;
    win.addEventListener("resize", () => windowResizes++);
    const originalStyle = instrument.getAttribute("style");
    instrument.style.height = "460px";
    instrument.style.minHeight = "0";
    await until(() => svg.getAttribute("viewBox") !== startupViewBox && cameraMatchesBox(),
      "element-only height change left a stale camera/background");
    if (windowResizes !== 0) throw new Error("element-only resize test accidentally resized the window");
    if (originalStyle === null) instrument.removeAttribute("style");
    else instrument.setAttribute("style", originalStyle);
    await until(() => svg.getAttribute("viewBox") === startupViewBox && cameraMatchesBox(),
      "restoring the instrument did not restore the camera");

    stage.style.height = "744px";
    await until(() => svg.getBoundingClientRect().height !== startupHeight && cameraMatchesBox(),
      "mobile viewport height change left a stale projection");
    stage.style.height = "844px";
    await until(() => svg.getAttribute("viewBox") === startupViewBox && cameraMatchesBox(),
      "restoring viewport height did not restore the camera");

    svg.setAttribute("viewBox", "0 0 1200 760");
    win.dispatchEvent(new win.Event("pageshow"));
    await until(() => svg.getAttribute("viewBox") === startupViewBox && cameraMatchesBox(),
      "page restoration did not remeasure the camera");
    let cameraWrites = 0;
    const observer = new win.MutationObserver(records => { cameraWrites += records.length; });
    observer.observe(svg, { attributes:true, attributeFilter:["viewBox"] });
    for (let n = 0; n < 8; n++) win.visualViewport.dispatchEvent(new win.Event("resize"));
    await sleep(120);
    observer.disconnect();
    if (cameraWrites !== 0) throw new Error("stable box needlessly invalidated projection caches");
  }
  if (instrument.dataset.selectedInstantMs !== selectedMs || JSON.stringify(pose()) !== JSON.stringify(originalPose)) {
    throw new Error("camera lifecycle changed selected time or ring pose");
  }
  proof.textContent = JSON.stringify({ zeroSizeDeferred, delayedStartup:true, elementOnlyResize:!capture,
    viewportHeightResize:!capture, pageRestore:!capture, noRedundantWrites:!capture,
    cameraAndBackgroundAligned:true, timeAndPosePreserved:true, startupViewBox,
    svgPixels:[svg.getBoundingClientRect().width, svg.getBoundingClientRect().height] });
  proof.dataset.ready = "true";
  } catch (error) {
  const svg = stage.contentDocument?.querySelector("#kinetic-wheel");
  const rect = svg?.getBoundingClientRect();
  const detail = JSON.stringify({ viewBox:svg?.getAttribute("viewBox"),
    backgroundViewBox:stage.contentDocument?.querySelector(".orbital-space")?.getAttribute("viewBox"),
    svgPixels:rect ? [rect.width,rect.height] : null,
    viewportPixels:[stage.contentWindow?.innerWidth,stage.contentWindow?.innerHeight] });
  proof.dataset.error = error.message + ": " + detail;
  proof.textContent = error.stack;
}
</script>

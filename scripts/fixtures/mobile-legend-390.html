<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>390px legend layout harness</title>
  <style>
    html, body { margin:0; width:500px; min-height:100%; overflow:hidden; background:#0b0f0c; }
    #stage { display:block; width:390px; height:844px; border:0; background:#0b0f0c; }
    #probe { display:none; }
  </style>
</head>
<body>
  <iframe id="stage" title="390px legend layout viewport"></iframe>
  <output id="probe" data-ready="false"></output>
  <script>
    const params = new URLSearchParams(location.search);
    const analysis = params.get("analysis") === "1";
    const edit = params.get("edit") === "1";
    const classificationMode = params.get("classification") === "1";
    const frame = document.querySelector("#stage");
    const probe = document.querySelector("#probe");
    const query = new URLSearchParams({ instant:"2027-03-15T13:20:09.000Z" });
    if (analysis) query.set("analysis", "1");
    if (classificationMode) query.set("classification", "1");
    frame.src = new URL(`../../?${query}`, location.href).href;

    function writeRect(name, rect) {
      for (const edge of ["top", "right", "bottom", "left", "width", "height"]) {
        const value = Number(rect?.[edge] ?? NaN);
        probe.dataset[`${name}${edge[0].toUpperCase()}${edge.slice(1)}`] = Number.isFinite(value) ? value.toFixed(2) : "NaN";
      }
    }

    function visible(win, node) {
      if (!node) return false;
      const style = win.getComputedStyle(node);
      if (style.display === "none" || style.visibility === "hidden" || Number(style.opacity || 1) <= 0) return false;
      const rect = node.getBoundingClientRect();
      return node.getClientRects().length > 0 && rect.width > 0 && rect.height > 0;
    }

    function snapshot() {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!win || !doc) return;
      const instrument = doc.querySelector("#kinetic-instrument");
      const legend = doc.querySelector(".ring-legend");
      if (!instrument || !legend) return;

      writeRect("instrument", instrument.getBoundingClientRect());
      writeRect("legend", legend.getBoundingClientRect());
      for (const id of ["year", "month", "solar", "day", "hour"]) {
        const row = doc.querySelector(`.ring-${id}`);
        const dot = row?.querySelector("i") ?? null;
        const label = row?.querySelector("span") ?? null;
        const value = row?.querySelector("strong") ?? null;
        writeRect(id, row?.getBoundingClientRect());
        probe.dataset[`${id}DotVisible`] = String(visible(win, dot));
        probe.dataset[`${id}ValueVisible`] = String(visible(win, value));
        probe.dataset[`${id}Identity`] = label ? win.getComputedStyle(label, "::after").content : "";
        probe.dataset[`${id}Position`] = row ? win.getComputedStyle(row).position : "";
      }

      const reference = doc.querySelector(".reference-frame-control");
      const topbar = doc.querySelector(".kinetic-topbar");
      const currentNav = doc.querySelector(".kinetic-topbar .site-nav a[aria-current=\"page\"]");
      const researchNav = doc.querySelector(".kinetic-topbar .site-nav a.research-link[data-nav-role=\"research\"]");
      const toolbar = doc.querySelector(".instrument-toolbar");
      const open = doc.querySelector("#analysis-toggle");
      const close = doc.querySelector("#analysis-close");
      const stateStrip = doc.querySelector(".state-strip");
      const classification = doc.querySelector("#classification-overlay-button");
      const classificationLegend = doc.querySelector("#classification-overlay-legend");
      const classificationHeading = classificationLegend?.querySelector(".classification-row header span") ?? null;
      const classificationHint = classificationLegend?.querySelector(".classification-row header small") ?? null;
      const classificationKey = classificationLegend?.querySelector(".classification-keys i") ?? null;
      const classificationWarning = classificationLegend?.querySelector(".classification-warning") ?? null;
      const findTime = doc.querySelector("#inverse-time-search-button");
      const solarTime = doc.querySelector("#solar-time-tool-button");
      const now = doc.querySelector("#now-button");
      const play = doc.querySelector("#play-button");
      const cursorNote = doc.querySelector("#cursor-layer .cursor-note");
      const mobileTimeDock = doc.querySelector("#mobile-time-dock");
      const mobileTimeInput = doc.querySelector("#mobile-instant-input");
      const mobileTimeApply = doc.querySelector("#mobile-time-apply");
      if (edit && mobileTimeDock?.dataset.dirty !== "true" && mobileTimeInput) {
        mobileTimeInput.value = "2027-03-15 21:21:10";
        mobileTimeInput.dispatchEvent(new Event("input", { bubbles:true }));
      }
      const fourPillars = doc.querySelector("#atlas-visible-ten-gods");
      const fourPillarCells = [...doc.querySelectorAll(".atlas-visible-ten-gods-cell")];
      const fourPillarsNote = doc.querySelector(".atlas-visible-ten-gods-note");
      const scaleButtons = [...doc.querySelectorAll(".scale-button")];
      const ringToggles = [...doc.querySelectorAll(".ring-legend-row[data-ring-toggle]")];
      const visibleCount = nodes => nodes.filter(node => visible(win, node)).length;
      writeRect("reference", reference?.getBoundingClientRect());
      writeRect("topbar", topbar?.getBoundingClientRect());
      writeRect("currentNav", currentNav?.getBoundingClientRect());
      writeRect("researchNav", researchNav?.getBoundingClientRect());
      writeRect("toolbar", toolbar?.getBoundingClientRect());
      writeRect("open", open?.getBoundingClientRect());
      writeRect("close", close?.getBoundingClientRect());
      writeRect("findTime", findTime?.getBoundingClientRect());
      writeRect("classification", classification?.getBoundingClientRect());
      writeRect("classificationLegend", classificationLegend?.getBoundingClientRect());
      writeRect("solarTime", solarTime?.getBoundingClientRect());
      writeRect("now", now?.getBoundingClientRect());
      writeRect("fourPillars", fourPillars?.getBoundingClientRect());
      fourPillarCells.forEach((cell, index) => writeRect(`fourPillarCell${index}`, cell.getBoundingClientRect()));

      probe.dataset.referenceVisible = String(visible(win, reference));
      probe.dataset.currentNavVisible = String(visible(win, currentNav));
      probe.dataset.researchNavVisible = String(visible(win, researchNav));
      probe.dataset.currentNavFontSize = currentNav ? win.getComputedStyle(currentNav).fontSize : "";
      probe.dataset.researchNavFontSize = researchNav ? win.getComputedStyle(researchNav).fontSize : "";
      probe.dataset.openVisible = String(visible(win, open));
      probe.dataset.openFontSize = open ? win.getComputedStyle(open).fontSize : "";
      probe.dataset.closeVisible = String(visible(win, close));
      probe.dataset.stateStripVisible = String(visible(win, stateStrip));
      probe.dataset.classificationVisible = String(visible(win, classification));
      probe.dataset.classificationLegendVisible = String(visible(win, classificationLegend));
      probe.dataset.classificationHeadingFont = classificationHeading ? win.getComputedStyle(classificationHeading).fontSize : "";
      probe.dataset.classificationHintFont = classificationHint ? win.getComputedStyle(classificationHint).fontSize : "";
      probe.dataset.classificationKeyFont = classificationKey ? win.getComputedStyle(classificationKey).fontSize : "";
      probe.dataset.classificationKeyHeight = classificationKey ? classificationKey.getBoundingClientRect().height.toFixed(2) : "NaN";
      probe.dataset.classificationWarningFont = classificationWarning ? win.getComputedStyle(classificationWarning).fontSize : "";
      probe.dataset.findTimeVisible = String(visible(win, findTime));
      probe.dataset.solarTimeVisible = String(visible(win, solarTime));
      probe.dataset.nowVisible = String(visible(win, now));
      probe.dataset.playVisible = String(visible(win, play));
      probe.dataset.cursorNoteVisible = String(visible(win, cursorNote));
      probe.dataset.mobileTimeDirty = mobileTimeDock?.dataset.dirty ?? "";
      probe.dataset.mobileTimeApplyVisible = String(visible(win, mobileTimeApply));
      probe.dataset.fourPillarsVisible = String(visible(win, fourPillars));
      probe.dataset.fourPillarsCellCount = String(fourPillarCells.length);
      probe.dataset.fourPillarsNoteVisible = String(visible(win, fourPillarsNote));
      for (const [name, node] of [["findTime", findTime], ["classification", classification], ["solarTime", solarTime], ["now", now]]) {
        probe.dataset[`${name}FontSize`] = node ? win.getComputedStyle(node).fontSize : "";
      }
      probe.dataset.scaleVisible = String(visibleCount(scaleButtons));
      probe.dataset.ringToggleVisible = String(visibleCount(ringToggles));
      probe.dataset.analysisOpen = instrument.dataset.analysisOpen ?? "";
      probe.dataset.innerWidth = String(win.innerWidth);
      probe.dataset.ready = "true";
    }

    frame.addEventListener("load", () => {
      snapshot();
      queueMicrotask(snapshot);
      setTimeout(snapshot, 100);
      setTimeout(snapshot, 700);
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body>
  <iframe id="explorer-frame" title="Date explorer interaction proof" style="width:390px;height:1500px;border:0" src="../../recurrence.html?mode=dates&base=2024-02-01&compare=2024-02-10"></iframe>
  <output id="probe" data-ready="false" data-error="initializing"></output>
  <script type="module">
    const frame = document.getElementById("explorer-frame");
    const probe = document.getElementById("probe");
    const wait = (ms) => new Promise(resolve => setTimeout(resolve,ms));
    function record(name,value) {probe.setAttribute("data-"+name,String(value));}
    function assert(condition,message) {if(!condition)throw new Error(message);}
    function change(input) {input.dispatchEvent(new Event("change",{bubbles:true}));}
    const dateFields = (doc,kind) => ["year","month","day"].map(key =>
      doc.getElementById("research-explorer-"+kind+"-"+key));
    const dateValues = (doc,kind,values) => dateFields(doc,kind).forEach((input,index) => {
      input.value = String(values[index]);
    });
    async function loaded(doc) {
      for (let i=0; i<180; i++) {
        if (doc.getElementById("research-free-explorer")?.dataset.ready==="true") return;
        await wait(40);
      }
      throw new Error("date explorer never reached ready state");
    }
    frame.addEventListener("load", async () => {
      try {
        const doc = frame.contentDocument;
        await loaded(doc);
        const root = doc.getElementById("research-free-explorer");
        const annual = doc.getElementById("research-discrete");
        const astronomy = doc.getElementById("research-astronomy");
        const evidence = doc.getElementById("research-evidence");
        const legacy = doc.getElementById("recurrence-instrument");
        const initialLegacyBase = legacy.dataset.baseDate;
        const initialLegacyDelta = legacy.dataset.deltaYears;
        assert(doc.body.dataset.researchMode==="dates","mode did not initialize from permalink");
        const advanced=doc.getElementById("research-advanced-details");
        assert(root.hidden===false && !advanced.open &&
          !annual.checkVisibility() && !astronomy.checkVisibility() && !evidence.checkVisibility(),
          "closed advanced Research must not duplicate the annual story");
        assert(root.dataset.astronomyApplicability==="not-evaluated" &&
          root.dataset.fourPillarsApplicability==="not-evaluated","free-date authority leaked");
        assert(root.dataset.baseDate==="2024-02-01" && root.dataset.targetDate==="2024-02-10",
          "permalink dates were lost");
        assert(root.dataset.dayPhase==="9" && root.dataset.yearPhase==="0",
          "two independent dates have wrong initial phases");
        assert(root.dataset.baseActiveYearStatus==="model-estimated" &&
          root.dataset.targetActiveYearStatus==="model-estimated","year-boundary model status lost");
        const advancedSummary=advanced.querySelector("summary");
        assert(!doc.querySelector(".research-mode-switch") &&
          !doc.getElementById("research-mode-dates") &&
          !doc.getElementById("research-year-journey-start"),
          "obsolete top-level Year tab or one-click wizard survived the merger");
        const viewport = doc.documentElement.clientWidth;
        const tabsRect = advancedSummary.getBoundingClientRect();
        const formRect = doc.getElementById("research-date-explorer-form").getBoundingClientRect();
        assert(viewport===390,"fixture must use real 390px iframe viewport");
        assert(tabsRect.left>=0 && tabsRect.right<=391,"advanced disclosure overflows 390px");
        assert(formRect.left>=0 && formRect.right<=391,"free-date form overflows 390px");
        const story = doc.getElementById("research-one-year-story");
        const yearTrack = doc.getElementById("research-one-year-track");
        const comparisonDetail = doc.getElementById("research-explorer-advanced-cycle");
        const baseDetail = doc.getElementById("research-explorer-advanced-base");
        assert(story.dataset.ready==="true" && !comparisonDetail.open && !baseDetail.open,
          "selected-year story must be primary; both duplicate comparison layers stay closed");
        assert(story.dataset.activeYearName==="甲辰" &&
          story.dataset.activeYearStatus==="model-estimated" &&
          doc.getElementById("research-one-year-active-pillar").textContent==="甲辰" &&
          doc.getElementById("research-one-year-day-pillar").textContent===root.dataset.targetDayPillar,
          "the primary visible named Year must follow actual Li Chun evidence, not the nominal year");
        assert(story.dataset.liChunPosition!=="unavailable" &&
          Number(story.dataset.liChunPosition)<Number(story.dataset.selectedPosition) &&
          !doc.getElementById("research-one-year-lichun-marker").hidden,
          "the dynamic Li Chun mark must precede Feb 10 and never use a hard-coded year position");
        assert(story.dataset.civilYearDays==="366" &&
          story.dataset.dayCycleYearAdvance==="6" &&
          doc.getElementById("research-one-year-day-motion").textContent.includes("366"),
          "leap-year continuous Day movement must be explained before periodic diagnostics");
        const beforeEra=doc.getElementById("research-one-year-before-segment");
        const afterEra=doc.getElementById("research-one-year-after-segment");
        const eraLegend=doc.getElementById("research-one-year-era-legend");
        const nearZoom=doc.getElementById("research-one-year-boundary-zoom");
        const selectedBand=doc.getElementById("research-one-year-zoom-selected-day");
        assert(!beforeEra.hidden && !afterEra.hidden && !eraLegend.hidden &&
          Math.abs(Number.parseFloat(beforeEra.style.width)-Number(story.dataset.liChunPosition))<.01 &&
          Math.abs(Number.parseFloat(afterEra.style.left)-Number(story.dataset.liChunPosition))<.01 &&
          doc.getElementById("research-one-year-before-label").textContent.includes("癸卯") &&
          doc.getElementById("research-one-year-after-label").textContent.includes("甲辰"),
          "full-year band must be divided by the sourced Li Chun instant and label BOTH actual year identities");
        assert(!nearZoom.hidden && story.dataset.boundaryZoomVisible==="true" &&
          Number.parseFloat(selectedBand.style.left)>50 &&
          doc.getElementById("research-one-year-zoom-track").getAttribute("aria-label")
            .includes("尺度不同"),
          "near-Li-Chun date should have an explicitly separately scaled inset with selected whole day AFTER Li Chun");
        assert(!nearZoom.checkVisibility() &&
          !doc.getElementById("research-one-year-evidence-details").open,
          "near-boundary zoom must not create a second default timeline");
        record("one-year-two-era-band",true);
        record("one-year-zoom-after-lichun",true);
        const storyRect=story.getBoundingClientRect();
        assert(storyRect.left>=0 && storyRect.right<=391 && storyRect.bottom<=844,
          "the selected Year, continuous Day and true year strip must fit within the 390px first viewport; story bottom="+Math.round(storyRect.bottom)+", top="+Math.round(storyRect.top)+", viewport="+viewport);
        assert(doc.defaultView.getComputedStyle(doc.querySelector(".research-explorer-mobile-glance")).display==="none",
          "the duplicate old nominal-first Year/Day glance must no longer occupy the first screen");
        assert(yearTrack.getAttribute("aria-label").includes("2024") &&
          yearTrack.getAttribute("aria-label").includes("立春"),
          "the dynamically positioned year strip must have a meaningful accessible explanation");

        const baseDay = root.dataset.baseDayPillar;
        const targetDay = root.dataset.targetDayPillar;
        record("initial-mode",doc.body.dataset.researchMode);
        record("initial-day-phase",root.dataset.dayPhase);
        record("initial-year-phase",root.dataset.yearPhase);
        record("initial-year-status",root.dataset.baseActiveYearStatus);
        record("initial-day-changed",baseDay!==targetDay);
        record("initial-astronomy-hidden",!advanced.open && !astronomy.checkVisibility());
        record("initial-four-pillars-hidden",!advanced.open && !evidence.checkVisibility());
        record("mobile-viewport",viewport);
        record("mobile-tabs-in-bounds",tabsRect.left>=0 && tabsRect.right<=391);
        record("mobile-form-in-bounds",formRect.left>=0 && formRect.right<=391);
        record("one-year-story-first-screen",storyRect.bottom<=844);
        record("one-year-actual-not-nominal",story.dataset.activeYearName==="甲辰");
        record("one-year-dynamic-lichun",story.dataset.liChunPosition!=="unavailable");
        record("one-year-leap-motion",story.dataset.dayCycleYearAdvance==="6");

        // #483: the visible Year band itself owns the one Day/Year playhead.
        // It must not leave a duplicate slider elsewhere or use a second Day table.
        const scrub=doc.getElementById("research-one-year-scrub");
        assert(scrub?.parentElement===yearTrack && scrub.type==="range" &&
          doc.querySelectorAll("#research-one-year-story input[type=range]").length===1 &&
          !doc.getElementById("research-one-year-day-phase") &&
          !doc.getElementById("research-year-journey-loops") &&
          doc.querySelectorAll("#research-one-year-day-motion").length===1 &&
          Number(story.dataset.dayIndex)>=0 && Number(story.dataset.dayIndex)<60,
          "the only graphic must be the Year-band playhead; Year and Day remain one date");
        const bandGeom=yearTrack.getBoundingClientRect();
        const sliderGeom=scrub.getBoundingClientRect();
        const thumbHalf=9.5; // production WebKit 19px native range thumb
        assert(
          Math.abs((sliderGeom.left+thumbHalf)-bandGeom.left)<2 &&
          Math.abs((sliderGeom.right-thumbHalf)-bandGeom.right)<2,
          "native date thumb would misalign with the sourced Li Chun and calendar-end tick positions"
        );
        record("one-year-slider-calendar-aligned",true);
        const labelBox=doc.querySelector(".research-one-year-identity-day strong").getBoundingClientRect();
        assert(labelBox.right<=391 && labelBox.height<28 &&
          doc.getElementById("research-one-year-evidence-details").open===false &&
          doc.getElementById("research-one-year-day-motion").checkVisibility(),
          "compact inline Day and one yearly sentence must replace the rings and expanded source card");
        const nativeInput=(ordinal)=>{
          scrub.value=String(ordinal);
          scrub.dispatchEvent(new Event("input",{bubbles:true}));
        };
        const initialDayIndex=Number(story.dataset.dayIndex);
        scrub.stepUp();scrub.dispatchEvent(new Event("input",{bubbles:true}));
        assert(root.dataset.targetDate==="2024-02-11" &&
          root.dataset.scrubOutcome==="applied" &&
          (Number(story.dataset.dayIndex)-initialDayIndex+60)%60===1,
          "one day slider step must advance the canonical Day identity once");
        scrub.stepDown();scrub.dispatchEvent(new Event("input",{bubbles:true}));
        assert(root.dataset.targetDate==="2024-02-10" &&
          Number(story.dataset.dayIndex)===initialDayIndex,
          "reversing the playhead must restore canonical Day phase");
        nativeInput(31); // Feb 1, 2024
        assert(root.dataset.targetDate==="2024-02-01" && story.dataset.activeYearName==="癸卯",
          "year-band playhead before Li Chun must show the actual previous Ganzhi Year");
        nativeInput(34); // Feb 4, calendar boundary day with no bound time
        assert(root.dataset.targetDate==="2024-02-04" &&
          story.dataset.activeYearStatus==="unresolved" &&
          doc.getElementById("research-one-year-active-pillar").textContent.includes("癸卯") &&
          doc.getElementById("research-one-year-active-pillar").textContent.includes("甲辰"),
          "date-only Li Chun playhead must not invent an exact active Year");
        nativeInput(180);
        assert(doc.getElementById("research-one-year-boundary-zoom").hidden,
          "far dates must automatically dismiss the local ±14-day magnification");
        nativeInput(40);
        assert(root.dataset.targetDate==="2024-02-10" && story.dataset.activeYearName==="甲辰" &&
          frame.contentWindow.location.search.includes("compare=2024-02-10"),
          "returning the playhead must restore date, true Year, Day and permalink");
        record("one-year-linked-playhead-first-screen",true);
        record("one-year-scrub-daily-and-boundary",true);

        // Dirty-form fence: the year scrub must never silently destroy either
        // a valid but uncommitted date or a malformed in-progress edit.
        const urlBeforeDirty=frame.contentWindow.location.search;
        const targetFields=dateFields(doc,"target");
        const assertRejectedDrag=(draftValue)=>{
          const committed=root.dataset.targetDate;
          targetFields[2].value=String(draftValue); // do not dispatch change/submit
          nativeInput(42);
          assert(root.dataset.scrubOutcome==="stale-input" &&
            root.dataset.targetDate===committed &&
            frame.contentWindow.location.search===urlBeforeDirty &&
            targetFields[2].value===String(draftValue) &&
            !doc.getElementById("research-explorer-error").hidden &&
            scrub.value==="40",
            "dirty target edit was overwritten or URL changed when scrub was rejected");
          targetFields[2].value="10";
          doc.getElementById("research-date-explorer-form").dispatchEvent(
            new Event("submit",{bubbles:true,cancelable:true}));
          assert(root.dataset.ready==="true" &&
            root.dataset.targetDate==="2024-02-10" &&
            doc.getElementById("research-explorer-error").hidden,
            "form must recover cleanly after a blocked year scrub");
        };
        assertRejectedDrag(12); // valid but not yet committed
        assertRejectedDrag(30); // invalid Gregorian February 30
        record("one-year-scrub-dirty-edit-protected",true);

        // Burst-scrub through Li Chun and leave the same canonical Year/Day
        // owner in charge. The observed time is recorded for performance audit.
        const burstStarted=performance.now();
        for(let ordinal=27;ordinal<=75;ordinal++) nativeInput(ordinal);
        const burstMs=performance.now()-burstStarted;
        assert(root.dataset.targetDate==="2024-03-16" &&
          story.dataset.activeYearName==="甲辰" &&
          story.dataset.dayName===root.dataset.targetDayPillar &&
          doc.getElementById("research-one-year-day-pillar").textContent===root.dataset.targetDayPillar &&
          frame.contentWindow.location.search.includes("compare=2024-03-16"),
          "burst scrub desynchronized selected date, true Year, 60-Day phase or URL");
        nativeInput(40);
        assert(root.dataset.targetDate==="2024-02-10" &&
          doc.getElementById("research-explorer-error").hidden,
          "return drag after burst failed to recover original shared date");
        record("one-year-scrub-burst-synchronized",true);
        record("one-year-scrub-burst-milliseconds",Math.round(burstMs));
        // This is an extremely loose catastrophic-regression guard, not
        // proof of natural finger tracking or a 60fps animation.
        assert(burstMs<8000,"49 synchronous drag updates exceeded 8-second audit ceiling: "+burstMs);

        const freeWheel = doc.getElementById("research-free-day-wheel");
        const freeWheelSvg = doc.getElementById("research-free-day-wheel-svg");
        assert(freeWheel && freeWheel.dataset.ready==="true" &&
          freeWheel.dataset.selectionLinked==="true" && !freeWheel.open,
          "date-only Day wheel must initialize linked but remain collapsed below Year/Day");
        freeWheel.open=true;
        const hits=[...freeWheelSvg.querySelectorAll(".research-cycle-hit")];
        assert(hits.length===60,"free Day wheel must expose 60 independently selectable sectors");
        const wheelOrigin=Number(freeWheel.dataset.selectedIndex);
        const nextIndex=(wheelOrigin+1)%60;
        const picker=doc.getElementById("research-free-wheel-direct-select");
        assert(picker && !picker.disabled && picker.options.length===60 &&
          picker.options[0].textContent.startsWith("甲子") &&
          picker.options[59].textContent.startsWith("癸亥") &&
          picker.value===String(wheelOrigin),
          "the native picker must expose the exact 60 Ganzhi names first, for keyboard typeahead");
        picker.value=String(nextIndex);
        change(picker);
        assert(freeWheel.dataset.selectedIndex===String(nextIndex) &&
          freeWheel.dataset.selectionLinked==="false" &&
          picker.value===String(nextIndex) &&
          root.dataset.targetDate==="2024-02-10" &&
          frame.contentWindow.location.search.includes("compare=2024-02-10"),
          "native select must preview the chosen Ganzhi without committing a date");
        doc.getElementById("research-free-wheel-return").click();
        assert(picker.value===String(wheelOrigin) &&
          freeWheel.dataset.selectionLinked==="true",
          "returning to comparison date must synchronize the native selector");
        record("wheel-direct-picker-preview",true);
        freeWheelSvg.dispatchEvent(new KeyboardEvent("keydown",{
          key:"ArrowRight",bubbles:true,cancelable:true
        }));
        assert(freeWheel.dataset.selectedIndex===String(nextIndex) &&
          freeWheel.dataset.selectionLinked==="false" &&
          picker.value===String(nextIndex) &&
          root.dataset.targetDate==="2024-02-10",
          "keyboard arrow must preview adjacent Ganzhi without committing a civil date");
        doc.getElementById("research-free-wheel-return").click();
        assert(freeWheel.dataset.selectedIndex===String(wheelOrigin) &&
          freeWheel.dataset.selectionLinked==="true" &&
          root.dataset.targetDate==="2024-02-10",
          "return-to-comparison must discard exploration without changing date");
        record("wheel-keyboard-and-return",true);
        hits[nextIndex].dispatchEvent(new MouseEvent("click",{bubbles:true}));
        // Background seasonal-source refinement may repeat the same calendar
        // dataset values. Such a rerender cannot erase user-selected preview.
        root.dataset.ready="true";
        root.dataset.targetDate="2024-02-10";
        await wait(0);
        assert(freeWheel.dataset.selectedIndex===String(nextIndex) &&
          freeWheel.dataset.selectionLinked==="false",
          "same-date asynchronous evidence refresh discarded a deliberate wheel preview");
        record("wheel-same-date-refresh-preserves-exploration",true);
        assert(freeWheel.dataset.selectedIndex===String(nextIndex) &&
          freeWheel.dataset.selectionLinked==="false" &&
          freeWheel.dataset.previousOffset==="-59" && freeWheel.dataset.nextOffset==="1" &&
          freeWheel.dataset.nextDate==="2024/02/11",
          "selecting one Day ahead must PREVIEW both strict occurrences without committing the date");
        assert(root.dataset.targetDate==="2024-02-10" &&
          frame.contentWindow.location.search.includes("compare=2024-02-10"),
          "wheel sector click must not mutate comparison date or permalink");
        doc.getElementById("research-free-wheel-next").click();
        await wait(0);
        assert(root.dataset.targetDate==="2024-02-11" &&
          root.dataset.dayPhase==="10" && root.dataset.yearPhase==="0" &&
          root.dataset.wheelJumpOutcome==="applied" &&
          root.dataset.wheelJumpDirection==="next" && root.dataset.wheelJumpOffset==="1" &&
          freeWheel.dataset.selectionLinked==="true" &&
          Number(freeWheel.dataset.selectedIndex)===nextIndex &&
          picker.value===String(nextIndex),
          "next occurrence must commit exactly one day through the single free-date owner");
        const sameIndex=Number(freeWheel.dataset.selectedIndex);
        hits[sameIndex].dispatchEvent(new MouseEvent("click",{bubbles:true}));
        assert(freeWheel.dataset.previousOffset==="-60" &&
          freeWheel.dataset.nextOffset==="60",
          "same-name search must mean strict prior/next occurrence, not current date");
        doc.getElementById("research-free-wheel-previous").click();
        await wait(0);
        assert(root.dataset.targetDate==="2023-12-13" &&
          root.dataset.yearPhase==="59" &&
          root.dataset.dayPhase==="10" &&
          root.dataset.wheelJumpOffset==="-60",
          "strict same-name previous occurrence must cross calendar year and preserve Day identity");
        hits[Number(freeWheel.dataset.selectedIndex)].dispatchEvent(new MouseEvent("click",{bubbles:true}));
        doc.getElementById("research-free-wheel-next").click();
        await wait(0);
        assert(root.dataset.targetDate==="2024-02-11" &&
          root.dataset.wheelJumpOffset==="60",
          "strict same-name next occurrence must reverse the 60-day jump");
        const priorIndex=(Number(freeWheel.dataset.selectedIndex)+59)%60;
        hits[priorIndex].dispatchEvent(new MouseEvent("click",{bubbles:true}));
        assert(freeWheel.dataset.previousOffset==="-1","previous adjacent Ganzhi should be only one day back");
        doc.getElementById("research-free-wheel-previous").click();
        await wait(0);
        assert(root.dataset.targetDate==="2024-02-10" &&
          root.dataset.dayPhase==="9" && root.dataset.yearPhase==="0" &&
          root.dataset.baseDate==="2024-02-01" &&
          frame.contentWindow.location.search.includes("compare=2024-02-10"),
          "wheel date preview and both jump directions must round-trip exact date, phases and URL");
        assert(legacy.dataset.baseDate===initialLegacyBase &&
          legacy.dataset.deltaYears===initialLegacyDelta,
          "free Day wheel must never mutate the annual-only recurrence authority");
        record("wheel-select-preview-not-commit",true);
        record("wheel-strict-same-day-sixty",true);
        record("wheel-next-previous-roundtrip",true);
        record("wheel-annual-isolation",true);
        freeWheel.open=false;
        
        const stepAdvanced=doc.getElementById("research-date-step-advanced");
        const daily=doc.querySelector(".research-date-step-buttons-daily");
        const sixty=doc.querySelector(".research-date-step-buttons-sixty");
        assert(stepAdvanced && !stepAdvanced.open && daily?.children.length===2 &&
          sixty?.children.length===2 &&
          [...sixty.children].every(btn=>!btn.checkVisibility()),
          "the original noisy ±60 controls must be initially collapsed, not just recolored");
        const dailyButtons=[...daily.querySelectorAll("button")];
        const dailyBoxes=dailyButtons.map(btn=>btn.getBoundingClientRect());
        assert(dailyBoxes.every(box=>box.width>=76 && box.height>=42 &&
          box.left>=0 && box.right<=391) &&
          Math.abs(dailyBoxes[0].top-dailyBoxes[1].top)<3,
          "visible one-day controls must occupy one accessible 390px row");
        const step = days => doc.querySelector('[data-explorer-step-days="' + days + '"]')?.click();
        const initialTargetDay = root.dataset.targetDayPillar;
        step(1);
        assert(root.dataset.targetDate==="2024-02-11" &&
          root.dataset.dayPhase==="10" && root.dataset.lastStepDays==="1",
          "one-day forward step did not commit the next Gregorian day");
        assert(root.dataset.targetDayPillar!==initialTargetDay,
          "one-day forward step did not advance the absolute Day identity");
        assert(root.dataset.baseDate==="2024-02-01" && root.dataset.yearPhase==="0",
          "one-day step changed the baseline or nominal Year phase");
        step(-1);
        assert(root.dataset.targetDate==="2024-02-10" &&
          root.dataset.dayPhase==="9" && root.dataset.targetDayPillar===initialTargetDay,
          "one-day inverse step did not return to the original Day identity");
        assert(stepAdvanced.querySelector("summary").getBoundingClientRect().height>=40,
          "advanced keyboard disclosure must preserve its touch target");
        stepAdvanced.open=true;
        assert([...sixty.children].every(btn=>btn.checkVisibility() &&
          btn.getBoundingClientRect().height>=42),
          "opened ±60 controls must remain fully accessible");
        record("day-step-advanced-sixty-hidden",true);
        record("day-step-advanced-reveals-sixty",true);
        step(60);
        assert(root.dataset.targetDate==="2024-04-10" &&
          root.dataset.dayPhase==="9" && root.dataset.targetDayPillar===initialTargetDay,
          "60 Gregorian days must return to the exact same named Day position");
        assert(root.dataset.yearPhase==="0" &&
          root.dataset.astronomyApplicability==="not-evaluated",
          "60-day jump altered the nominal Year or promoted unavailable astronomy");
        step(-60);
        assert(root.dataset.targetDate==="2024-02-10" &&
          root.dataset.dayPhase==="9" && root.dataset.stepOutcome==="applied",
          "inverse 60-day jump lost the selected target or phase");
        assert(frame.contentWindow.location.search.includes("compare=2024-02-10"),
          "date-step commit did not persist a consistent shareable date");
        stepAdvanced.open=false;
        assert([...sixty.children].every(btn=>!btn.checkVisibility()),
          "legacy sixty-day buttons must fold away again after use");
        const afterSteps = story.getBoundingClientRect();
        assert(afterSteps.bottom<=844,
          "day-step controls displaced the year boundary story below the 390px first viewport");
        record("day-step-forward-and-back",true);
        record("day-step-sixty-cycle",true);
        record("day-step-share-url",true);
        record("mobile-glance-after-step",afterSteps.bottom<=844);

        // The year story must track the chosen Gregorian year and actual
        // Li Chun side. Jan 1 is not the Ganzhi year boundary.
        const initialTargetInputs=dateFields(doc,"target");
        dateValues(doc,"target",[2024,2,1]);
        doc.getElementById("research-date-explorer-form").dispatchEvent(new Event("submit",
          {bubbles:true,cancelable:true}));
        assert(story.dataset.activeYearName==="癸卯" &&
          Number(story.dataset.selectedPosition)<Number(story.dataset.liChunPosition),
          "Feb 1 must show the PRE-Li-Chun Year on the very top story");
        assert(!nearZoom.hidden && Number.parseFloat(selectedBand.style.left)<50 &&
          selectedBand.dataset.includesEvent==="false",
          "Feb 1 whole-day band must appear BEFORE the same year-specific Li Chun event");
        dateValues(doc,"target",[2024,2,4]);
        doc.getElementById("research-date-explorer-form").dispatchEvent(new Event("submit",
          {bubbles:true,cancelable:true}));
        assert(story.dataset.activeYearStatus==="unresolved" &&
          doc.getElementById("research-one-year-active-pillar").textContent.includes("癸卯") &&
          doc.getElementById("research-one-year-active-pillar").textContent.includes("甲辰"),
          "the ambiguous Li Chun civil day must not be promoted to one certain year");
        assert(!nearZoom.hidden && selectedBand.dataset.includesEvent==="true" &&
          doc.getElementById("research-one-year-zoom-track").getAttribute("aria-label")
            .includes("須另有時刻"),
          "boundary-date visualization must show a whole day SPANNING Li Chun, not a falsely certain point");
        record("one-year-zoom-boundary-day-band",true);
        dateValues(doc,"target",[2023,12,31]);
        doc.getElementById("research-date-explorer-form").dispatchEvent(new Event("submit",
          {bubbles:true,cancelable:true}));
        assert(story.dataset.civilYearDays==="365" &&
          story.dataset.dayCycleYearAdvance==="5",
          "non-leap year must explain that 365 days advances Day by 5 modulo 60");
        assert(nearZoom.hidden && story.dataset.boundaryZoomVisible==="false",
          "an unrelated date far from Li Chun must not retain or invent the previous zoom");
        record("one-year-zoom-hides-far-date",true);
        dateValues(doc,"target",[2024,2,10]);
        doc.getElementById("research-date-explorer-form").dispatchEvent(new Event("submit",
          {bubbles:true,cancelable:true}));
        assert(story.dataset.activeYearName==="甲辰" &&
          story.dataset.dayCycleYearAdvance==="6",
          "returning to a selected post-Li-Chun day must restore its true Year story");
        record("one-year-switches-at-lichun",true);
        record("one-year-365-vs-366",true);
        // Comparison remains present on demand, without reentering data.
        comparisonDetail.open=true;
        baseDetail.open=true;
        const advancedGlance=doc.querySelector(".research-explorer-mobile-glance");
        assert(doc.defaultView.getComputedStyle(advancedGlance).display==="grid" &&
          advancedGlance.getBoundingClientRect().width>100,
          "opening mobile research diagnostics must restore the named Year/Day pair instead of showing phases alone");
        assert(doc.getElementById("research-explorer-year-base").textContent==="甲辰" &&
          doc.getElementById("research-explorer-year-target").textContent==="甲辰" &&
          doc.getElementById("research-explorer-year-active-base").textContent.includes("癸卯") &&
          doc.getElementById("research-explorer-year-active-target").textContent.includes("甲辰"),
          "advanced nominal comparison must retain the distinguishable actual Li Chun year evidence");
        record("one-year-advanced-evidence-retained",true);
        comparisonDetail.open=false;
        baseDetail.open=false;

        const targetInputs = dateFields(doc,"target");
        targetInputs[2].value = "11";
        change(targetInputs[2]);
        assert(root.dataset.targetDate==="2024-02-11" && root.dataset.dayPhase==="10",
          "changing one day did not update the free-date pair");
        assert(root.dataset.targetDayPillar!==targetDay,"daily Ganzhi name failed to advance");
        assert(frame.contentWindow.location.search.includes("compare=2024-02-11") &&
          !frame.contentWindow.location.search.includes("delta="),"free URL leaked annual delta");
        record("changed-day-phase",root.dataset.dayPhase);
        record("changed-day-identity",root.dataset.targetDayPillar);

        doc.getElementById("research-explorer-swap").click();
        assert(root.dataset.baseDate==="2024-02-11" && root.dataset.targetDate==="2024-02-01",
          "swap did not reverse the two date owners");
        assert(root.dataset.signedElapsedDays==="-10" && root.dataset.dayPhase==="50",
          "reverse compare did not retain signed elapsed days and modular phase");
        record("reversed-day-phase",root.dataset.dayPhase);
        record("reversed-elapsed-days",root.dataset.signedElapsedDays);

        dateValues(doc,"target",[2025,2,29]);
        doc.getElementById("research-date-explorer-form").dispatchEvent(new Event("submit",
          {bubbles:true,cancelable:true}));
        await wait(0);
        assert(root.dataset.ready==="false" &&
          doc.getElementById("research-explorer-results").hidden===true &&
          story.hidden===true && picker.disabled,
          "invalid leap day must hide stale result and disable the direct Ganzhi picker");
        assert(root.dataset.targetDate==="2024-02-01","invalid date mutated the committed pair");
        record("invalid-hidden",doc.getElementById("research-explorer-results").hidden);
        dateValues(doc,"target",[2024,2,29]);
        doc.getElementById("research-date-explorer-form").dispatchEvent(new Event("submit",
          {bubbles:true,cancelable:true}));
        await wait(0);
        assert(root.dataset.ready==="true" && root.dataset.targetDate==="2024-02-29" &&
          !story.hidden && !picker.disabled && picker.value===freeWheel.dataset.selectedIndex,
          "correcting invalid leap day did not restore the explorer and its named Day picker");
        record("wheel-direct-picker-invalid-recovery",true);
        record("recovered",root.dataset.ready);

        const originalUrl=frame.contentWindow.location.pathname+
          frame.contentWindow.location.search+frame.contentWindow.location.hash;
        advanced.open=true;
        assert(doc.body.dataset.researchMode==="dates" && !root.hidden &&
          annual.checkVisibility() && astronomy.checkVisibility() && evidence.checkVisibility() &&
          doc.defaultView.getComputedStyle(doc.getElementById("research-year-strip")).display==="none",
          "expanding advanced research must keep the same main Year strip without a duplicate");
        assert(legacy.dataset.baseDate===initialLegacyBase &&
          legacy.dataset.deltaYears===initialLegacyDelta,
          "basic date edits rewrote unrelated long-period recurrence");
        assert(frame.contentWindow.location.pathname+
          frame.contentWindow.location.search+frame.contentWindow.location.hash===originalUrl,
          "expanding advanced evidence changed the shareable selected-date URL");
        record("annual-preserved",true);

        advanced.open=false;
        assert(doc.body.dataset.researchMode==="dates" &&
          root.dataset.baseDate==="2024-02-11" && root.dataset.targetDate==="2024-02-29" &&
          !annual.checkVisibility() && !astronomy.checkVisibility() && !evidence.checkVisibility(),
          "collapsing advanced research must retain the same canonical selected date");
        record("free-restored",true);
        // Midnight civil-year transition is NOT the Li Chun active-year switch.
        dateValues(doc,"base",[2023,12,31]);
        dateValues(doc,"target",[2023,12,31]);
        doc.getElementById("research-date-explorer-form").dispatchEvent(new Event("submit",
          {bubbles:true,cancelable:true}));
        step(1);
        assert(root.dataset.baseDate==="2023-12-31" &&
          root.dataset.targetDate==="2024-01-01" &&
          root.dataset.signedElapsedDays==="1" &&
          root.dataset.dayPhase==="1" && root.dataset.yearPhase==="1",
          "one-day step across New Year failed to advance both discrete phases");
        assert(doc.getElementById("research-explorer-year-target").textContent==="甲辰" &&
          doc.getElementById("research-explorer-year-active-target").textContent.startsWith("癸卯"),
          "calendar New Year incorrectly became the active Li Chun year");
        record("newyear-nominal-vs-active",true);

        const boundaryTarget = root.dataset.targetDate;
        const boundaryUrl = frame.contentWindow.location.search;
        dateValues(doc,"target",[1,1,1]);
        step(-1);
        assert(root.dataset.stepOutcome==="out-of-range" &&
          root.dataset.targetDate===boundaryTarget &&
          frame.contentWindow.location.search===boundaryUrl &&
          !doc.getElementById("research-explorer-error").hidden &&
          doc.getElementById("research-explorer-results").hidden,
          "out-of-range day step mutated the committed state, or exposed stale results beside invalid edit");
        record("out-of-range-preserves-state",true);
        step(1);
        assert(root.dataset.ready==="true" &&
          root.dataset.targetDate==="1-01-02" &&
          root.dataset.stepOutcome==="applied" &&
          frame.contentWindow.location.search.includes("compare=1-01-02"),
          "the reverse step must recover from a failed CE-boundary edit without retyping");
        record("boundary-reverse-step-recovers",true);

        probe.dataset.error = "none";
        probe.dataset.ready = "true";
      } catch (error) {
        probe.dataset.error = error?.stack ?? String(error);
        probe.dataset.ready = "error";
      }
    },{once:true});
  </script>
</body>
</html>

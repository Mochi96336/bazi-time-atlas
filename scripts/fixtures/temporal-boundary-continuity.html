<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>390px temporal boundary continuity harness</title>
  <style>
    html, body { margin:0; width:390px; background:#0b0f0c; }
    .stage { display:block; width:390px; height:844px; border:0; opacity:0; pointer-events:none; }
    #probe { display:none; }
  </style>
</head>
<body>
  <iframe id="month-frame" class="stage" title="Month boundary continuity probe"></iframe>
  <iframe id="year-frame" class="stage" title="Year boundary continuity probe"></iframe>
  <iframe id="solar-frame" class="stage" title="Solar wrap continuity probe"></iframe>
  <output id="probe" data-ready="false"></output>

  <script type="module">
    import { apparentSolarLongitude } from "../../src/astronomy/solar-longitude.js";
    import { solarTermEventForCivilYear } from "../../src/astronomy/solar-term-boundaries.js";

    const UTC_OFFSET_HOURS = 8;
    const SECOND_MS = 1000;
    const STEP_MS = 2 * SECOND_MS;
    const DAY_MS = 86_400_000;
    const probe = document.querySelector("#probe");

    function fieldsFromInstant(ms) {
      const shifted = new Date(ms + UTC_OFFSET_HOURS * 3_600_000);
      return {
        year: shifted.getUTCFullYear(),
        month: shifted.getUTCMonth() + 1,
        day: shifted.getUTCDate(),
        hour: shifted.getUTCHours(),
        minute: shifted.getUTCMinutes(),
        second: shifted.getUTCSeconds()
      };
    }

    function longitudeAt(ms) {
      return apparentSolarLongitude(fieldsFromInstant(ms), UTC_OFFSET_HOURS);
    }

    function findProductionSolarWrapSecond() {
      let lo = Date.parse("2024-03-19T00:00:00.000Z") / SECOND_MS;
      let hi = Date.parse("2024-03-21T12:00:00.000Z") / SECOND_MS;
      const loLongitude = longitudeAt(lo * SECOND_MS);
      const hiLongitude = longitudeAt(hi * SECOND_MS);
      if (!(loLongitude > 350 && hiLongitude < 10)) {
        throw new Error(`solar wrap bracket invalid: ${loLongitude} -> ${hiLongitude}`);
      }

      while (hi - lo > 1) {
        const mid = Math.floor((lo + hi) / 2);
        const longitude = longitudeAt(mid * SECOND_MS);
        if (longitude < 180) hi = mid;
        else lo = mid;
      }
      return hi * SECOND_MS;
    }

    function appUrl(startMs) {
      const url = new URL("../../", location.href);
      url.searchParams.set("instant", new Date(startMs).toISOString());
      return url.href;
    }

    function settle() {
      return new Promise(resolve => queueMicrotask(() => queueMicrotask(resolve)));
    }

    async function waitFor(predicate, label, timeoutMs = 4000) {
      const started = performance.now();
      while (performance.now() - started < timeoutMs) {
        if (predicate()) return;
        await new Promise(resolve => setTimeout(resolve, 20));
      }
      throw new Error(`timeout waiting for ${label}`);
    }

    function snapshot(frame, ringId) {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const instrument = doc?.querySelector("#kinetic-instrument");
      const track = doc?.querySelector(`#${ringId}-track`);
      if (!win || !doc || !instrument || !track) return null;
      return {
        innerWidth: win.innerWidth,
        instantMs: Number(instrument.dataset.selectedInstantMs),
        modelRotation: Number(track.dataset.modelRotation),
        phaseProgress: track.dataset.phaseProgress ?? "",
        pillar: ringId === "month"
          ? instrument.dataset.monthPillar ?? ""
          : ringId === "year"
            ? instrument.dataset.yearPillar ?? ""
            : "",
        solarLongitude: Number(instrument.dataset.solarLongitude),
        term: instrument.dataset.term ?? "",
        zodiac: instrument.dataset.zodiac ?? ""
      };
    }

    function writeSnapshot(key, position, value) {
      const prefix = `${key}${position}`;
      probe.dataset[`${prefix}InnerWidth`] = String(value.innerWidth);
      probe.dataset[`${prefix}Instant`] = String(value.instantMs);
      probe.dataset[`${prefix}Model`] = String(value.modelRotation);
      probe.dataset[`${prefix}Progress`] = value.phaseProgress;
      probe.dataset[`${prefix}Pillar`] = value.pillar;
      probe.dataset[`${prefix}Longitude`] = String(value.solarLongitude);
      probe.dataset[`${prefix}Term`] = value.term;
      probe.dataset[`${prefix}Zodiac`] = value.zodiac;
    }

    async function exercise({ key, ringId, boundaryMs }) {
      const frame = document.querySelector(`#${key}-frame`);
      const startMs = boundaryMs - SECOND_MS;
      const endMs = boundaryMs + SECOND_MS;
      const loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once:true }));
      frame.src = appUrl(startMs);
      await loaded;

      await waitFor(() => {
        const current = snapshot(frame, ringId);
        return current &&
          current.instantMs === startMs &&
          Number.isFinite(current.modelRotation) &&
          Number.isFinite(current.solarLongitude);
      }, `${key} initial production pose`);
      await settle();

      const before = snapshot(frame, ringId);
      const doc = frame.contentDocument;
      const slider = doc.querySelector("#time-slider");
      if (!before || !slider) throw new Error(`${key} production controls missing`);

      // The production range normally snaps to the user-facing scale. The harness
      // changes only the HTML control's step constraint so the existing production
      // input handler can advance the same live atlas by exactly two seconds.
      slider.step = "any";
      slider.value = String(STEP_MS / DAY_MS);
      slider.dispatchEvent(new frame.contentWindow.Event("input", { bubbles:true }));

      await waitFor(() => Number(doc.querySelector("#kinetic-instrument")?.dataset.selectedInstantMs) === endMs,
        `${key} +2 second production pose`);
      await settle();
      const after = snapshot(frame, ringId);
      if (!after) throw new Error(`${key} final production pose missing`);

      probe.dataset[`${key}BoundaryMs`] = String(boundaryMs);
      writeSnapshot(key, "Before", before);
      writeSnapshot(key, "After", after);
    }

    const cases = [
      {
        key:"month",
        ringId:"month",
        boundaryMs:solarTermEventForCivilYear(2024, "驚蟄").instantMs
      },
      {
        key:"year",
        ringId:"year",
        boundaryMs:solarTermEventForCivilYear(2024, "立春").instantMs
      },
      {
        key:"solar",
        ringId:"solar",
        boundaryMs:findProductionSolarWrapSecond()
      }
    ];

    Promise.all(cases.map(exercise))
      .then(() => {
        probe.dataset.stepMs = String(STEP_MS);
        probe.dataset.ready = "true";
      })
      .catch(error => {
        probe.dataset.ready = "error";
        probe.dataset.error = String(error?.stack ?? error);
      });
  </script>
</body>
</html>

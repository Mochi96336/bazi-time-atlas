<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research 01 guided civil year · real 390px browser fixture</title>
<style>html,body{margin:0;width:500px;min-height:1650px;overflow:hidden;background:#101713}iframe{width:390px;height:1610px;border:0;display:block}#probe{display:none}</style>
</head><body>
<iframe id="stage" title="真實390px年度導覽驗收"></iframe>
<output id="probe" data-ready="false" data-error="initializing"></output>
<script>
const p=new URLSearchParams(location.search);
const year=Number(p.get("year")??"2024"),state=p.get("state")??"initial",desktop=p.get("desktop")==="1";
const frame=document.getElementById("stage"),probe=document.getElementById("probe");
const pad=n=>String(n).padStart(2,"0");
const date=(y,m,d)=>y+"-"+pad(m)+"-"+pad(d);
const originalDate=year===2024?date(year,2,10):date(year,6,1);
if(desktop){
  document.documentElement.style.width="1440px";
  document.body.style.width="1440px";
  frame.style.width="1440px";
  frame.style.height="1330px";
}
const originalUrl="../../recurrence.html?mode=dates&base="+encodeURIComponent(date(year,1,1))+
  "&compare="+encodeURIComponent(originalDate);
function ok(check,message){if(!check)throw Error(message)}
function record(name,value){probe.dataset[name]=String(value)}
const delay=n=>new Promise(resolve=>setTimeout(resolve,n));
frame.addEventListener("load",async()=>{
 try{
  const d=frame.contentDocument,w=frame.contentWindow;
  for(let n=0;n<150;n++){
    if(d.getElementById("research-free-explorer")?.dataset.ready==="true")break;
    await delay(40);
  }
  const root=d.getElementById("research-free-explorer"),story=d.getElementById("research-one-year-story");
  ok(root.dataset.ready==="true","research route unavailable");
  ok(d.documentElement.clientWidth===(desktop?1440:390),"expected real CSS-pixel iframe missing");
  const controls={
    start:d.getElementById("research-year-journey-start"),
    guide:d.getElementById("research-year-journey"),
    previous:d.getElementById("research-year-journey-previous"),
    next:d.getElementById("research-year-journey-next"),
    finish:d.getElementById("research-year-journey-finish"),
    restore:d.getElementById("research-year-journey-restore")
  };
  const band=d.getElementById("research-one-year-track");
  const ring=d.getElementById("research-one-year-day-phase-dial");
  const stageId=()=>root.dataset.yearJourneyStep;
  const now=()=>root.dataset.targetDate;
  const beforeRect=story.getBoundingClientRect();
  if(!desktop)ok(beforeRect.bottom<=844,
    "unexpanded guide pushed first-screen Year/Day below 844: "+beforeRect.bottom);
  ok(controls.guide.hidden && !controls.start.hidden && band&&ring,
    "initial page exposed an unnecessary second date calculator");
  record("firstScreen",true);
  const originalPath=w.location.pathname+w.location.search+w.location.hash;
  if(state!=="initial"){
    controls.start.click();
    ok(root.dataset.yearJourneyActive==="true" && stageId()==="start",
      "guide did not start at the committed civil Jan 1");
    ok(now()===date(year,1,1),"guide start lost the original civil year");
    ok(controls.previous.disabled && !controls.next.disabled,"guide stage ownership buttons incorrect");
    const startIndex=Number(d.getElementById("research-one-year-day-phase-index").textContent);
    const initialStartDay=d.getElementById("research-one-year-day-pillar").textContent;
    record("start",true);
    if(state==="proof"){
      // Dirty and invalid edits must remain untouched when a guided NEXT step is blocked.
      const field=d.getElementById("research-explorer-target-day");
      const monthField=d.getElementById("research-explorer-target-month");
      for(const draft of [{month:"1",day:"12"},{month:"2",day:"30"}]){
        const urlBefore=w.location.search,dayBefore=now();
        monthField.value=draft.month;field.value=draft.day;
        controls.next.click();
        ok(root.dataset.yearJourneyOutcome==="stale-input" &&
          monthField.value===draft.month && field.value===draft.day &&
          now()===dayBefore && w.location.search===urlBefore,
          "guided next overwrote a dirty or invalid civil day");
        monthField.value="1";field.value="1";
      }
      record("dirtyGuard",true);
    }
    const requested={
      boundary:"li-chun-date",
      after:"after-li-chun",
      end:"next-jan-1"
    }[state];
    let boundarySeen=false,afterSeen=false,steps=0;
    const visitedTurns=new Set();
    if(state==="end")controls.finish.click(); // opt-in one-click overview
    while(state==="proof" || (requested && stageId()!==requested)){
      if(controls.next.disabled)break;
      controls.next.click();steps++;
      ok(steps<=12,"journey loop stalled");
      ok(root.dataset.yearJourneyActive==="true","next step created phantom selection");
      ok(w.location.search.includes("compare="+now()),"stage changed date without shareable URL");
      ok(ring.getAttribute("aria-label").includes(d.getElementById("research-one-year-day-pillar").textContent),
        "main Day ring and selected Day differ");
      if(stageId()==="li-chun-date"){
        boundarySeen=true;
        if(year===2024){
          ok(story.dataset.activeYearStatus==="unresolved" &&
            d.getElementById("research-one-year-active-pillar").textContent.includes("癸卯") &&
            d.getElementById("research-one-year-active-pillar").textContent.includes("甲辰"),
            "2024 date-only Li Chun must retain both active Year candidates");
        }
      }
      if(stageId().startsWith("turn-")){
        const turn=Number(stageId().slice(5));
        visitedTurns.add(turn);
        ok(root.dataset.yearJourneyElapsed===String(turn*60) &&
          Number(d.getElementById("research-one-year-day-phase-index").textContent)===startIndex &&
          d.querySelector('[data-journey-turn="'+turn+'"]').dataset.complete==="true",
          "each full 60-day turn must visibly close and restore the same named Day");
      }
      if(stageId()==="after-li-chun"){
        afterSeen=true;
        if(year===2024)ok(story.dataset.activeYearName==="甲辰",
          "2024 post-Li Chun did not switch to sourced Year");
      }
    }
    const ended=stageId()==="next-jan-1";
    if(state==="proof"){
      ok(visitedTurns.size===6,
        "user-stepped guide must expose each of six distinct 60-day checkpoints");
      record("turns",visitedTurns.size);
    }
    if(state==="proof"||state==="end"){
      ok(ended,"journey did not reach next Gregorian Jan 1");
      ok(now()===date(year+1,1,1),"journey conflated next Jan 1 with next Li Chun");
      ok(story.dataset.year===String(year+1),"the existing Year strip must visibly switch to next Gregorian year");
      const remainder=year===2024?6:5;
      const finalIndex=Number(d.getElementById("research-one-year-day-phase-index").textContent);
      ok((finalIndex-startIndex+60)%60===remainder,"six loops remainder wrong");
      ok(root.dataset.yearJourneyElapsed===String(year===2024?366:365),
        "year days must include 2024 leap day");
      ok(root.dataset.yearJourneyRemainder===String(remainder),"year remainder wrong");
      ok([...d.querySelectorAll("[data-journey-turn]")]
        .every(node=>node.dataset.complete==="true"),"six Day circles did not complete");
      ok(controls.finish.hidden && d.getElementById("research-year-journey-remainder").textContent==="+"+remainder,
        "remainder circle is not +5/+6");
      ok(d.getElementById("research-year-journey-day-names").textContent.includes(initialStartDay),
        "graphical guide lost canonical origin Day identity");
      ok(d.getElementById("research-year-journey-meaning").textContent.includes("不代表又過了一次立春"),
        "next Gregorian Jan 1 incorrectly shown as next Li Chun transition");
      record("end",true);
      record("elapsed",root.dataset.yearJourneyElapsed);
      record("remainder",root.dataset.yearJourneyRemainder);
    }
    if(state==="proof"){
      if(year===2024)ok(boundarySeen && afterSeen,"supported 2024 Li Chun guide missing");
      controls.restore.click();
      ok(root.dataset.yearJourneyActive==="false" &&
        root.dataset.yearJourneyOutcome==="restored" &&
        controls.guide.hidden && now()===originalDate &&
        w.location.pathname+w.location.search+w.location.hash===originalPath,
        "explicit return failed to restore original date and exact permalink");
      record("restored",true);
      // An optional one-click jump must use the very same committed target and
      // its restore action (not a second preview-only Day source).
      controls.start.click();
      controls.finish.click();
      ok(root.dataset.yearJourneyStep==="next-jan-1" &&
        now()===date(year+1,1,1) && controls.finish.hidden,
        "one-click overview must follow the canonical next-year boundary");
      controls.restore.click();
      ok(now()===originalDate &&
        w.location.pathname+w.location.search+w.location.hash===originalPath,
        "one-click overview did not restore the original date/URL");
      record("oneClickOverview",true);
      // An unrelated deliberate manual slider action must dismiss the guide.
      controls.start.click();
      const scrub=d.getElementById("research-one-year-scrub");
      scrub.value="20";scrub.dispatchEvent(new Event("input",{bubbles:true}));
      ok(root.dataset.yearJourneyActive==="false" && controls.guide.hidden &&
        root.dataset.yearJourneyOutcome==="interrupted-by-manual-date",
        "manual date change left a competing hidden guided date authority");
      record("manualOwnership",true);
    }
    if(state==="boundary" || state==="after")ok(stageId()===requested,
      "requested screenshot stage unavailable");
    record("stage",stageId()??"restored");
    record("currentDate",now());
  }else{
    record("stage","initial");
    record("currentDate",now());
  }
  const bounds=story.getBoundingClientRect();
  ok(bounds.left>=0 && bounds.right<=(desktop?1441:391),"Year/Day story overflows");
  probe.dataset.error="none";probe.dataset.ready="true";
 }catch(e){probe.dataset.ready="error";probe.dataset.error=e?.stack??String(e);}
},{once:true});
frame.src=originalUrl;
</script></body></html>

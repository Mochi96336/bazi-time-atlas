<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research 01 · one page, one annual band</title>
<style>html,body{margin:0;width:500px;min-height:1650px;overflow:hidden;background:#101713}
iframe{width:390px;height:1610px;border:0;display:block}#probe{display:none}</style>
</head><body>
<iframe id="stage" title="真實390px單一年度時間軸驗收"></iframe>
<output id="probe" data-ready="false" data-error="initializing"></output>
<script>
const q=new URLSearchParams(location.search),year=Number(q.get("year")??"2024");
const state=q.get("state")??"initial",desktop=q.get("desktop")==="1";
const frame=document.getElementById("stage"),probe=document.getElementById("probe");
const pad=n=>String(n).padStart(2,"0");
const date=(y,m,d)=>y+"-"+pad(m)+"-"+pad(d);
const first=state==="boundary"?date(2024,2,4):
 year===2024?date(2024,2,10):date(2023,6,1);
const url="../../recurrence.html?mode=dates&base="+
 encodeURIComponent(date(year,1,1))+"&compare="+encodeURIComponent(first);
if(desktop){document.documentElement.style.width="1440px";
 document.body.style.width="1440px";frame.style.width="1440px";frame.style.height="1330px";}
const ok=(v,msg)=>{if(!v)throw Error(msg)};
const record=(key,value)=>probe.dataset[key]=String(value);
const sleep=ms=>new Promise(done=>setTimeout(done,ms));
frame.addEventListener("load",async()=>{
 try{
  const d=frame.contentDocument,w=frame.contentWindow;
  for(let t=0;t<150;t++){if(d.getElementById("research-free-explorer")?.dataset.ready==="true")break;await sleep(40)}
  const root=d.getElementById("research-free-explorer");
  const story=d.getElementById("research-one-year-story");
  const advanced=d.getElementById("research-advanced-details");
  const band=d.getElementById("research-one-year-track");
  const slider=d.getElementById("research-one-year-scrub");
  const sentence=d.getElementById("research-one-year-day-motion");
  const form=d.getElementById("research-date-explorer-form");
  const inputs=["year","month","day"].map(k=>d.getElementById("research-explorer-target-"+k));
  const yearLabel=d.getElementById("research-one-year-active-pillar");
  const dayLabel=d.getElementById("research-one-year-day-pillar");
  ok(root?.dataset.ready==="true"&&d.documentElement.clientWidth===(desktop?1440:390),
    "single Research route failed to initialize with a real viewport");
  ok(!root.hidden&&advanced&&!advanced.open&&band&&slider&&sentence,
    "one public Year band must be visible, advanced proof closed");
  ok(!d.querySelector(".research-mode-switch")&&
    !d.querySelector("#research-mode-dates, #research-mode-annual, #research-year-journey-start, #research-year-journey, #research-one-year-day-phase, #research-year-journey-loops"),
    "an obsolete parallel Year menu, wizard, or ring survived the redesign");
  record("noTabs",true);record("noTour",true);
  ok(!d.querySelector("#research-discrete").checkVisibility()&&
    !d.querySelector("#research-year-strip").checkVisibility(),
    "old annual duplicate is visible beside primary Year band");
  const box=story.getBoundingClientRect(),limit=desktop?1441:391;
  ok(box.left>=0&&box.right<=limit,"primary Year panel exceeds viewport");
  if(!desktop)ok(box.bottom<=844,"one-band mobile first screen exceeds 844: "+box.bottom);
  const names=[...story.querySelectorAll(".research-one-year-identity strong")];
  ok(names.length===2&&names.every(n=>n.getBoundingClientRect().height<28),
    "oversized Ganzhi cards returned");
  record("firstScreen",true);
  const extra=year===2024?6:5,days=year===2024?366:365;
  const text=()=>sentence.textContent;
  ok(text().includes(year+" 年共 "+days+" 天")&&
    text().includes("走滿 6 圈，再走 "+extra+" 天"),
    "single sentence failed to explain exact 365/366 +5/+6");
  record("yearSentence",true);record("remainder",extra);
  if(state==="boundary"){
    ok(year===2024&&story.dataset.activeYearStatus==="unresolved"&&
      yearLabel.textContent.includes("癸卯")&&yearLabel.textContent.includes("甲辰")&&
      !d.getElementById("research-one-year-lichun-marker").hidden,
      "Li Chun date-only must show both Year identities and sourced marker");
    record("boundary",true);
  }
  const originalUrl=w.location.pathname+w.location.search+w.location.hash;
  const originalName=story.dataset.dayName,originalIndex=story.dataset.dayIndex;
  const originalYearName=yearLabel.textContent;
  const changeTo=(y,m,day)=>{
    inputs[0].value=String(y);inputs[1].value=String(m);inputs[2].value=String(day);
    form.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  };
  if(state==="end"||state==="proof"){
    slider.value=String(days-1);
    slider.dispatchEvent(new Event("input",{bubbles:true}));
    ok(root.dataset.targetDate===date(year,12,31)&&
      sentence.textContent.includes("走滿 6 圈，再走 "+extra+" 天")&&
      w.location.search.includes("compare="+date(year,12,31))&&
      story.dataset.year===String(year)&&
      dayLabel.textContent===root.dataset.targetDayPillar,
      "Dec31 must retain the same Year strip, canonical Day and six-turn sentence");
    record("end",true);record("elapsed",days);
  }
  if(state==="proof"){
    changeTo(year,first.includes("-02-")?2:6,first.endsWith("-10")?10:1);
    ok(root.dataset.targetDate===first&&
      story.dataset.dayName===originalName&&story.dataset.dayIndex===originalIndex&&
      yearLabel.textContent===originalYearName&&
      w.location.pathname+w.location.search+w.location.hash===originalUrl,
      "form did not restore original name/date/permalink");
    record("restored",true);
    const before=w.location.search;
    inputs[2].value="30";inputs[1].value="2";
    slider.value=String(Math.min(days-1,60));
    slider.dispatchEvent(new Event("input",{bubbles:true}));
    ok(root.dataset.scrubOutcome==="stale-input"&&root.dataset.targetDate===first&&
      inputs[2].value==="30"&&w.location.search===before,
      "invalid dirty edit was overwritten by the Year slider");
    record("dirtyGuard",true);
    changeTo(year+1,1,1);
    ok(root.dataset.targetDate===date(year+1,1,1)&&
      story.dataset.year===String(year+1)&&
      story.dataset.dayName===root.dataset.targetDayPillar&&
      sentence.textContent.includes("走滿 6 圈，再走 "+(year===2024?5:6)+" 天"),
      "next Gregorian Jan1 must start its own 365/366 year without faking Li Chun");
    ok(story.dataset.activeYearName===(year===2024?"甲辰":"癸卯"),
      "following Gregorian Jan1 incorrectly shown as next Li Chun");
    changeTo(year,first.includes("-02-")?2:6,first.endsWith("-10")?10:1);
    record("manualOwnership",true);
  }
  record("stage",state);record("currentDate",root.dataset.targetDate);
  probe.dataset.ready="true";probe.dataset.error="none";
 }catch(err){probe.dataset.ready="error";probe.dataset.error=err?.stack??String(err);}
},{once:true});
frame.src=url;
</script></body></html>

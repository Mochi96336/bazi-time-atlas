name: Research EoT Swiss 4006 comparison

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install locked Node dependencies
        run: npm ci
      - name: Prepare pinned production vendor module
        run: npm run vendor:prepare
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Swiss Ephemeris wrapper
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Download official Swiss planetary and lunar ephemerides
        run: |
          mkdir -p tmp/sweph
          for file in sepl_18.se1 semo_18.se1 sepl_36.se1 semo_36.se1; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/aloistr/swisseph/master/ephe/${file}" \
              -o "tmp/sweph/${file}"
          done
          sha256sum tmp/sweph/sepl_18.se1 tmp/sweph/semo_18.se1 tmp/sweph/sepl_36.se1 tmp/sweph/semo_36.se1
      - name: Compare hourly production EoT against Swiss reference
        env:
          SWISSEPH_EPHE_PATH: tmp/sweph
          OUTPUT_DIR: tmp/eot-swiss-4006
        run: node scripts/research-compare-eot-swiss.mjs
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eot-swiss-4006-comparison
          path: tmp/eot-swiss-4006/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

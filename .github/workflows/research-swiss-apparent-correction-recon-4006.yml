name: Research Swiss apparent correction recon 4006

on:
  pull_request:
    paths:
      - ".github/workflows/research-swiss-apparent-correction-recon-4006.yml"
      - "scripts/research-swiss-apparent-correction-recon-4006.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swiss-apparent-correction-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Swiss Ephemeris wrapper
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2

      - name: Download pinned Swiss long-range ephemerides
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/sweph
          SWISS_COMMIT=9083a12d59e98034fb2337061481ac8800c16e64
          for file in sepl_36.se1 semo_36.se1; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/aloistr/swisseph/${SWISS_COMMIT}/ephe/${file}" \
              -o "tmp/sweph/${file}"
          done
          cat <<'EOF' | sha256sum -c -
          3faeadb0f2c04d455ce8c5a853d007e9b445e1dc7b65a43389fc3d746b7b9bd0  tmp/sweph/sepl_36.se1
          f4e89fb3f69a337249ccff96d3f565baa8986a7c15e44cba5676d5dbdf00dfaa  tmp/sweph/semo_36.se1
          EOF

      - name: Decompose year-4006 apparent-Sun correction curvature
        env:
          SWISS_EPHE_PATH: tmp/sweph
          OUTPUT_DIR: tmp/swiss-apparent-correction-recon-4006
        run: python scripts/research-swiss-apparent-correction-recon-4006.py

      - name: Verify reconnaissance authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("tmp/swiss-apparent-correction-recon-4006/manifest.json").read_text())
          assert m["targetYear"] == 4006
          assert m["intervals"] == 105120
          assert len(m["layers"]) == 6
          assert len(m["incrementalCorrections"]) == 5
          i = m["interpretation"]
          assert i["empiricalOnly"] is True
          assert i["flagDecompositionIsProofPrioritizationOnly"] is True
          assert i["sampledCorrectionCurvatureIsContinuousBound"] is False
          assert i["lightTimeCorrectionCertified"] is False
          assert i["aberrationCorrectionCertified"] is False
          assert i["deflectionCorrectionCertified"] is False
          assert i["precessionCorrectionCertified"] is False
          assert i["nutationCorrectionCertified"] is False
          assert i["apparentPositionCorrectionChainCertified"] is False
          assert i["swissEotSecondDerivativeCertified"] is False
          assert i["continuousResidualUpperBound"] is False
          assert i["recurrenceAuthorityGranted"] is False
          PY

      - name: Upload apparent correction reconnaissance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiss-apparent-correction-recon-4006
          path: tmp/swiss-apparent-correction-recon-4006/manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

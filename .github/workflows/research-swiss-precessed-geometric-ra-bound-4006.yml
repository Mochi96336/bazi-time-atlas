name: Research legacy Swiss precessed RA artifact 4006 (superseded)

on:
  pull_request:
    paths:
      - ".github/workflows/research-swiss-precessed-geometric-ra-bound-4006.yml"
      - "scripts/research-swiss-precessed-geometric-ra-samples-4006.c"
      - "scripts/compose-swiss-precessed-geometric-ra-bound-4006.mjs"
      - "src/astronomy/equation-of-time-4006-swiss-segment-curvature-evidence.js"
      - "src/astronomy/equation-of-time-4006-swiss-vondrak-precession-evidence.js"
      - "src/astronomy/equation-of-time-4006-swiss-precessed-geometric-ra-evidence.js"
      - "tests/equation-of-time-4006-swiss-precessed-geometric-ra-evidence.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-precessed-ra-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fetch pinned Swiss Ephemeris source
        shell: bash
        run: |
          set -euo pipefail
          SWISS_COMMIT=9083a12d59e98034fb2337061481ac8800c16e64
          mkdir -p tmp/swisseph
          git -C tmp/swisseph init
          git -C tmp/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C tmp/swisseph fetch --depth=1 origin "$SWISS_COMMIT"
          git -C tmp/swisseph checkout --detach FETCH_HEAD
          test "$(git -C tmp/swisseph rev-parse HEAD)" = "$SWISS_COMMIT"

      - name: Download pinned Swiss long-range ephemerides
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/sweph
          SWISS_COMMIT=9083a12d59e98034fb2337061481ac8800c16e64
          for file in sepl_36.se1 semo_36.se1; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/aloistr/swisseph/${SWISS_COMMIT}/ephe/${file}" \
              -o "tmp/sweph/${file}"
          done
          cat <<'EOF' | sha256sum -c -
          3faeadb0f2c04d455ce8c5a853d007e9b445e1dc7b65a43389fc3d746b7b9bd0  tmp/sweph/sepl_36.se1
          f4e89fb3f69a337249ccff96d3f565baa8986a7c15e44cba5676d5dbdf00dfaa  tmp/sweph/semo_36.se1
          EOF

      - name: Build historical precessed sampler
        shell: bash
        run: |
          set -euo pipefail
          make -C tmp/swisseph libswe.a
          mkdir -p tmp/swiss-precessed-geometric-ra-bound-4006
          cc -O2 -std=gnu11 \
            -I tmp/swisseph \
            scripts/research-swiss-precessed-geometric-ra-samples-4006.c \
            tmp/swisseph/libswe.a -lm \
            -o tmp/swiss-precessed-geometric-ra-bound-4006/sample

      - name: Reproduce historical precessed samples
        shell: bash
        run: |
          set -euo pipefail
          tmp/swiss-precessed-geometric-ra-bound-4006/sample tmp/sweph \
            | tee tmp/swiss-precessed-geometric-ra-bound-4006/raw.json
          python -m json.tool tmp/swiss-precessed-geometric-ra-bound-4006/raw.json >/dev/null

      - name: Reproduce historical composition
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compose-swiss-precessed-geometric-ra-bound-4006.mjs
          python -m json.tool tmp/swiss-precessed-geometric-ra-bound-4006/manifest.json >/dev/null

      - name: Verify historical reproduction remains non-authoritative
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path("tmp/swiss-precessed-geometric-ra-bound-4006/raw.json").read_text())
          m = json.loads(Path("tmp/swiss-precessed-geometric-ra-bound-4006/manifest.json").read_text())
          assert raw["targetYear"] == 4006
          assert raw["sampleStepEtDays"] <= 0.25
          assert raw["sampleCoverRadiusEtDays"] <= 0.125
          assert raw["minSampledPrecessedXyAu"] > 0
          assert raw["interpretation"]["gridMinimumIsContinuousLowerBound"] is False
          hard = m["derivedHardBounds"]
          assert hard["meanOfDateGeometricVelocityAuPerDay"] > 0
          assert hard["meanOfDateGeometricAccelerationAuPerDaySquared"] > 0
          PY
          node --input-type=module <<'NODE'
          const { EQUATION_OF_TIME_4006_SWISS_PRECESSED_GEOMETRIC_RA_EVIDENCE: e } =
            await import("./src/astronomy/equation-of-time-4006-swiss-precessed-geometric-ra-evidence.js");
          if (!e.supersession?.supersededForRightAscension || !e.supersession?.invalidForRightAscension) throw new Error("legacy precessed RA claim must remain superseded");
          if (e.interpretation.validForRightAscension !== false) throw new Error("legacy precessed evidence regained RA authority");
          if (e.interpretation.sourceDerivedContinuousBound !== false) throw new Error("legacy composition must not claim current continuous authority");
          if (e.interpretation.meanOfDateGeometricRaSecondDerivativeCertified !== false) throw new Error("legacy precessed RA bound must not be certified");
          if (!e.interpretation.geometricJ2000PvaEnvelopeCertified || !e.interpretation.vondrakPrecessionMatrixCertified) throw new Error("independent surviving certificates were lost");
          NODE

      - name: Upload legacy superseded precessed artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-superseded-swiss-precessed-ra-artifact-4006
          path: |
            tmp/swiss-precessed-geometric-ra-bound-4006/raw.json
            tmp/swiss-precessed-geometric-ra-bound-4006/manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

name: Research DE441 asteroid343 semi-active A-B

on:
  pull_request:
    paths:
      - ".github/workflows/research-rebound-asteroid343-semi-active.yml"
      - "scripts/research-capture-de441-n373s-j2000.py"
      - "scripts/research-rebound-asteroid343-semi-active.py"
      - "scripts/research-rebound-asteroid343-hybrid-differential.py"
      - "scripts/research-rebound-de441-state-baseline.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "rebound==5.2.2" "reboundx==5.1.0" \
            "jplephem==2.24" "numpy<3"

      - name: Compile research scripts before large downloads
        run: |
          python -m py_compile \
            scripts/research-capture-de441-n373s-j2000.py \
            scripts/research-rebound-asteroid343-semi-active.py

      - name: Download official DE441 positive-time kernel
        env:
          KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
        run: |
          mkdir -p tmp/rebound-asteroid343
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/rebound-asteroid343/de441_part-2.bsp \
            "$KERNEL_URL"
          printf '%s  %s\n' \
            'ad8dfa4e505ef0e3a5d587a5b4705632' \
            'tmp/rebound-asteroid343/de441_part-2.bsp' | md5sum --check -

      - name: Download DE440 ASCII header for integration mass constants
        env:
          MASS_HEADER_URL: https://ssd.jpl.nasa.gov/ftp/eph/planets/ascii/de440/header.440
        run: |
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/rebound-asteroid343/header.440 \
            "$MASS_HEADER_URL"
          grep -Eq 'GROUP[[:space:]]+1040' tmp/rebound-asteroid343/header.440
          grep -Eq 'GROUP[[:space:]]+1041' tmp/rebound-asteroid343/header.440

      - name: Download official DE441 n373 short-window perturber kernel
        env:
          SMALL_KERNEL_URL: https://ssd.jpl.nasa.gov/ftp/eph/small_bodies/asteroids_de441/sb441-n373s.bsp
        run: |
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/rebound-asteroid343/sb441-n373s.bsp \
            "$SMALL_KERNEL_URL"
          test -s tmp/rebound-asteroid343/sb441-n373s.bsp

      - name: Capture J2000 states and DE441 masses
        run: |
          python scripts/research-capture-de441-n373s-j2000.py \
            --planet-kernel tmp/rebound-asteroid343/de441_part-2.bsp \
            --mass-header tmp/rebound-asteroid343/header.440 \
            --small-kernel tmp/rebound-asteroid343/sb441-n373s.bsp \
            --output tmp/rebound-asteroid343/n373s-j2000.json

      - name: Preserve validated differential-method evidence
        run: |
          cat <<'EOF'
          [asteroid343-hybrid-method]
          source_run=38151851014
          direct-IAS15+343 year-4006:
            li-chun=0.528424 arcsec
            march-equinox=0.499748 arcsec
            september-equinox=0.925853 arcsec
          hybrid WHFast dt=4d minus direct at year-4006:
            li-chun=+0.000125 arcsec
            march-equinox=+0.000142 arcsec
            september-equinox=+0.000123 arcsec
          WHFast dt=8d was numerically unstable and is rejected.
          EOF

      - name: Run year-10026 hybrid estimate with validated 4-day WHFast
        timeout-minutes: 25
        run: |
          python scripts/research-rebound-asteroid343-hybrid-differential.py \
            --kernel tmp/rebound-asteroid343/de441_part-2.bsp \
            --state-json tmp/rebound-asteroid343/n373s-j2000.json \
            --years 10026 \
            --dt-days 4 \
            --output tmp/rebound-asteroid343/hybrid-10026-dt4.json

      - name: Run year-10026 hybrid convergence with 2-day WHFast
        timeout-minutes: 35
        run: |
          python scripts/research-rebound-asteroid343-hybrid-differential.py \
            --kernel tmp/rebound-asteroid343/de441_part-2.bsp \
            --state-json tmp/rebound-asteroid343/n373s-j2000.json \
            --years 10026 \
            --dt-days 2 \
            --output tmp/rebound-asteroid343/hybrid-10026-dt2.json

      - name: Report year-10026 convergence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          by_dt = {}
          for dt in (4, 2):
              r = json.loads(
                  Path(f"tmp/rebound-asteroid343/hybrid-10026-dt{dt}.json").read_text()
              )
              assert r["researchOnly"] is True
              assert r["asteroidCount"] == 343
              assert r["claimBoundary"]["usesDifferentialIntegratorCancellation"] is True
              assert r["claimBoundary"]["year10026IsHybridEstimate"] is True
              assert r["claimBoundary"]["year26026Resolved"] is False
              by_dt[dt] = {row["label"]: row for row in r["rows"]}

          labels = (
              "li-chun-window",
              "march-equinox-window",
              "september-equinox-window",
          )
          for label in labels:
              a = by_dt[4][label]
              b = by_dt[2][label]
              diff = (
                  b["hybrid"]["directionErrorArcsec"]
                  - a["hybrid"]["directionErrorArcsec"]
              )
              print(
                  f"[asteroid343-convergence] {label}: "
                  f"dt4={a['hybrid']['directionErrorArcsec']:.6f} arcsec, "
                  f"dt2={b['hybrid']['directionErrorArcsec']:.6f} arcsec, "
                  f"dt2-dt4={diff:.6f} arcsec"
              )
              print(
                  f"[asteroid343-10026] {label}: "
                  f"IAS15={b['ias15Baseline']['directionErrorArcsec']:.6f} -> "
                  f"hybrid343={b['hybrid']['directionErrorArcsec']:.6f} arcsec; "
                  f"improvement={b['directionImprovementArcsec']:.6f} "
                  f"({b['directionImprovementFraction']*100:.3f}%); "
                  f"asteroid-delta={b['asteroidDeltaMagnitudeKm']:.3f} km"
              )

          max_conv = max(
              abs(
                  by_dt[2][label]["hybrid"]["directionErrorArcsec"]
                  - by_dt[4][label]["hybrid"]["directionErrorArcsec"]
              )
              for label in labels
          )
          print(
              f"[asteroid343-convergence] max_abs_dt2_minus_dt4={max_conv:.6f} arcsec"
          )
          PY

      - name: Assert research claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(
              Path("tmp/rebound-asteroid343/hybrid-10026-dt2.json").read_text()
          )
          assert r["researchOnly"] is True
          assert r["asteroidCount"] == 343
          assert r["claimBoundary"]["usesDifferentialIntegratorCancellation"] is True
          assert r["claimBoundary"]["year10026IsHybridEstimate"] is True
          assert r["claimBoundary"]["year26026Resolved"] is False
          assert r["claimBoundary"]["productionAuthorityGranted"] is False
          assert len(r["rows"]) == 3
          PY

      - name: Remove large source kernels
        if: always()
        run: |
          rm -f tmp/rebound-asteroid343/de441_part-2.bsp
          rm -f tmp/rebound-asteroid343/header.440
          rm -f tmp/rebound-asteroid343/sb441-n373s.bsp

      - name: Upload compact research evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebound-asteroid343-semi-active-ab
          path: |
            tmp/rebound-asteroid343/n373s-j2000.json
            tmp/rebound-asteroid343/hybrid-10026-dt4.json
            tmp/rebound-asteroid343/hybrid-10026-dt2.json
          if-no-files-found: warn
          retention-days: 14

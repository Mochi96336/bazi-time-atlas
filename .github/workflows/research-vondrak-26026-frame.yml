name: Research Vondrak year-26026 frame bridge

on:
  pull_request:
    paths:
      - ".github/workflows/research-vondrak-26026-frame.yml"
      - "scripts/research-swiss-vondrak-frame-probe.c"
      - "scripts/research-check-vondrak-frame-26026.py"
      - "scripts/research-swiss-owen-frame-probe.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install independent SOFA implementation
        run: python -m pip install --disable-pip-version-check "pyerfa==2.0.1.5" "numpy<3"

      - name: Fetch pinned Swiss Ephemeris source
        shell: bash
        run: |
          set -euo pipefail
          SWISS_COMMIT=9083a12d59e98034fb2337061481ac8800c16e64
          mkdir -p tmp/swisseph
          git -C tmp/swisseph init
          git -C tmp/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C tmp/swisseph fetch --depth=1 origin "$SWISS_COMMIT"
          git -C tmp/swisseph checkout --detach FETCH_HEAD
          test "$(git -C tmp/swisseph rev-parse HEAD)" = "$SWISS_COMMIT"
          grep -q 'SEMOD_PREC_VONDRAK_2011' tmp/swisseph/swephlib.c
          grep -q 'static void pre_pecl' tmp/swisseph/swephlib.c
          grep -q 'static void pre_pequ' tmp/swisseph/swephlib.c
          grep -q '198.296701' tmp/swisseph/swephlib.c
          grep -q 'SEMOD_PREC_OWEN_1990' tmp/swisseph/swephlib.c

      - name: Build frame probes
        shell: bash
        run: |
          set -euo pipefail
          make -C tmp/swisseph libswe.a
          cc -O2 -Wall -Wextra \
            -I tmp/swisseph \
            scripts/research-swiss-vondrak-frame-probe.c \
            tmp/swisseph/libswe.a \
            -lm -ldl \
            -o tmp/vondrak-frame-probe
          cc -O2 -Wall -Wextra \
            -I tmp/swisseph \
            scripts/research-swiss-owen-frame-probe.c \
            tmp/swisseph/libswe.a \
            -lm -ldl \
            -o tmp/owen-frame-probe

      - name: Cross-check year-26026 long-term frame
        run: |
          python scripts/research-check-vondrak-frame-26026.py \
            --vondrak-probe tmp/vondrak-frame-probe \
            --owen-probe tmp/owen-frame-probe \
            --output tmp/vondrak-frame-26026.json

      - name: Assert proof boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("tmp/vondrak-frame-26026.json").read_text())
          assert r["researchOnly"] is True
          assert r["implementationCrossCheck"]["accepted"] is True
          assert r["implementationCrossCheck"]["maxResidualArcsec"] < 0.001
          assert r["rejectedScalarObliquityShortcut"]["rejected"] is True
          assert r["frameModel"]["targetCatalogueYear"] == 26026
          assert r["frameModel"]["nominalValidityYearsFromJ2000"] == 200000
          assert r["frameModel"]["nutationApplied"] is False
          assert r["owenOverlapDiagnostic"]["target26026InsideOwenImplementationRange"] is False
          assert r["claimBoundary"]["year26026FrameAlgorithmCrossValidated"] is True
          assert r["claimBoundary"]["year26026IndependentAstronomicalFrameTruth"] is False
          assert r["claimBoundary"]["year26026NutationResolved"] is False
          assert r["claimBoundary"]["year26026SeasonalCrossingResolved"] is False
          assert r["claimBoundary"]["productionAuthorityGranted"] is False
          PY

      - name: Upload compact frame proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vondrak-frame-26026-proof
          path: tmp/vondrak-frame-26026.json
          if-no-files-found: warn
          retention-days: 14

name: Research N16 asteroid A-B

on:
  pull_request:
    paths:
      - ".github/workflows/research-rebound-n16-asteroids.yml"
      - "scripts/research-capture-horizons-n16-j2000.py"
      - "scripts/research-rebound-n16-asteroids.py"
      - "scripts/research-rebound-de441-state-baseline.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check "rebound==5.2.2" "reboundx==5.1.0" "jplephem==2.24" "numpy<3"

      - name: Download official DE441 part 2 kernel
        env:
          KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
        run: |
          mkdir -p tmp/rebound-n16
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/rebound-n16/de441_part-2.bsp \
            "$KERNEL_URL"
          printf '%s  %s\n' \
            'ad8dfa4e505ef0e3a5d587a5b4705632' \
            'tmp/rebound-n16/de441_part-2.bsp' | md5sum --check -

      - name: Capture Horizons N16 J2000 state
        run: |
          python scripts/research-capture-horizons-n16-j2000.py \
            --output tmp/rebound-n16/n16-j2000.json

      - name: Run focused IAS15 N16 A-B
        run: |
          python scripts/research-rebound-n16-asteroids.py \
            --kernel tmp/rebound-n16/de441_part-2.bsp \
            --n16-state-json tmp/rebound-n16/n16-j2000.json \
            --output tmp/rebound-n16/result.json

      - name: Assert research claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("tmp/rebound-n16/result.json").read_text())
          assert r["researchOnly"] is True
          assert r["claimBoundary"]["reproducesFull343AsteroidModel"] is False
          assert r["claimBoundary"]["includesKboPerturbations"] is False
          assert r["claimBoundary"]["year26026Resolved"] is False
          assert len(r["baseline"]) == 6
          assert len(r["n16"]) == 6
          assert len(r["comparison"]) == 6
          print(json.dumps(r["summary"], indent=2))
          PY

      - name: Remove large source kernel
        if: always()
        run: rm -f tmp/rebound-n16/de441_part-2.bsp

      - name: Upload compact research evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: rebound-n16-asteroid-ab
          path: |
            tmp/rebound-n16/n16-j2000.json
            tmp/rebound-n16/result.json
          if-no-files-found: error
          retention-days: 14

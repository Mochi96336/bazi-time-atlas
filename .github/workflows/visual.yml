name: Visual PNG self-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The former single capture job spent ~8 minutes running everything serially.
  # Keep all browser checks, but isolate seven independent suites on parallel
  # runners. Fail-fast is disabled so one flaky check does not hide other evidence.
  verify:
    name: verify (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        suite: [shader, home, research, capture-pages, capture-interactions, capture-material, capture-responsive]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # Quality Gate independently runs npm test + syntax once; browser checks
      # only need the vendor file that npm test used to generate as a side effect.
      - name: Prepare browser vendor dependency
        run: npm run vendor:prepare
      - name: Install lightweight CJK font for browser tests and screenshots
        run: sudo apt-get install -y --no-install-recommends fonts-wqy-microhei >/dev/null
      - name: Locate system Chromium
        run: |
          command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bazi-time-atlas-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bazi-time-atlas-http.log
          exit 1
      - name: Run browser and visual regression suite
        run: node scripts/run-visual-ci-suite.mjs "${{ matrix.suite }}"
        env:
          BASE_URL: http://127.0.0.1:4173/
      - name: Upload screenshot shard
        if: ${{ always() && (startsWith(matrix.suite, 'capture-') || matrix.suite == 'home') }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-shard-${{ matrix.suite }}
          path: tmp/visual-check/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  # Retain the pre-existing "capture" status-check name and combined artifact.
  # The gate must FAIL (not skip) when any matrix shard fails or is cancelled.
  capture:
    name: capture
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every visual suite to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "Visual suite aggregate: $VERIFY_RESULT"
          test "$VERIFY_RESULT" = "success"
      - name: Gather all screenshot shards
        uses: actions/download-artifact@v7
        with:
          pattern: visual-shard-*
          path: tmp/visual-check/
          merge-multiple: true
      - name: Verify complete visual evidence inventory
        run: |
          test -f tmp/visual-check/mobile-material-budget.json
          test -f tmp/visual-check/mobile-camera-lifecycle.json
          test -s tmp/visual-check/mobile-camera-recovered-390x844.png
          file_count=$(find tmp/visual-check -type f | wc -l)
          echo "Combined visual evidence files: $file_count (baseline: 94)"
          test "$file_count" -ge 94
      - name: Publish combined visual evidence
        uses: actions/upload-artifact@v7
        with:
          name: visual-png-selfcheck
          path: tmp/visual-check/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

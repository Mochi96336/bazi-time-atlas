name: Visual PNG self-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bazi-time-atlas-http.log 2>&1 &
          echo $! >/tmp/bazi-time-atlas-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bazi-time-atlas-http.log
          exit 1
      - name: Capture responsive PNG evidence
        run: npm run visual:capture
        env:
          BASE_URL: http://127.0.0.1:4173/
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-png-selfcheck
          path: visual-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false

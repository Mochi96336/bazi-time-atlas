name: Research DE441 GM constant audit

on:
  pull_request:
    paths:
      - ".github/workflows/research-de441-gm-constant-audit.yml"
      - "scripts/research-de441-gm-constant-audit.py"
      - "scripts/research-rebound-de441-state-baseline.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check "rebound==5.2.2" "reboundx==5.1.0" "jplephem==2.24" "numpy<3"

      - name: Download official DE440/441 integration header
        env:
          MASS_HEADER_URL: https://ssd.jpl.nasa.gov/ftp/eph/planets/ascii/de440/header.440
        run: |
          mkdir -p tmp/gm-audit
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/gm-audit/header.440 \
            "$MASS_HEADER_URL"
          grep -Eq 'GROUP[[:space:]]+1040' tmp/gm-audit/header.440
          grep -q 'GMS' tmp/gm-audit/header.440
          grep -q 'GMB' tmp/gm-audit/header.440
          grep -q 'EMRAT' tmp/gm-audit/header.440

      - name: Audit baseline GM constants and REBOUND effective GM
        run: |
          python scripts/research-de441-gm-constant-audit.py \
            --header tmp/gm-audit/header.440 \
            --output tmp/gm-audit/result.json

      - name: Assert audit scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("tmp/gm-audit/result.json").read_text())
          assert r["researchOnly"] is True
          assert len(r["rows"]) == 11
          assert r["claimBoundary"]["testsMassConstantsOnly"] is True
          assert r["claimBoundary"]["testsDeepIntegration"] is False
          assert r["claimBoundary"]["year26026Resolved"] is False
          print(json.dumps(r["summary"], indent=2))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: de441-gm-constant-audit
          path: tmp/gm-audit/result.json
          if-no-files-found: error
          retention-days: 14

name: JPL Horizons 4006 probe

on:
  push:
    branches:
      - agent/jpl-horizons-4006-evidence

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare pinned Tyme vendor
        run: npm run vendor:prepare
      - name: Install independent ERFA nutation implementation
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyerfa==2.0.1.5
      - name: Dump 2026 ShouXing seasonal roots
        run: node scripts/dump-shouxing-2026-candidates.mjs
      - name: Compare 2026 against JPL DE441 in mean and IAU80-shifted semantics
        run: python scripts/probe-jpl-horizons-candidates-erfa.py shouxing-2026-candidates.json

name: JPL Horizons 4006 probe

on:
  push:
    branches:
      - agent/jpl-horizons-4006-evidence

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare pinned Tyme vendor
        run: npm run vendor:prepare
      - name: Compare 24 ShouXing crossings with JPL Horizons DE441
        run: node scripts/probe-jpl-horizons-4006.mjs

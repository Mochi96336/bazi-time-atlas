name: Research Horizons Sun apparent correction capture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Capture Horizons Sun apparent-correction evidence
        run: node scripts/research-capture-horizons-sun-apparent-correction.mjs
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: horizons-sun-apparent-correction-capture
          path: tmp/horizons-sun-apparent-correction/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

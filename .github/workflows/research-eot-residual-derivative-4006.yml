name: Research EoT residual derivative 4006

on:
  pull_request:
    paths:
      - ".github/workflows/research-eot-residual-derivative-4006.yml"
      - "scripts/research-eot-residual-derivative-4006.mjs"
      - "scripts/research-swiss-eot-derivative-reference.py"
      - "src/astronomy/equation-of-time.js"
      - "src/recurrence/equation-of-time-grid-continuity-bound.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derivative-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install locked Node dependencies
        run: npm ci
      - name: Prepare pinned production vendor module
        run: npm run vendor:prepare
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Swiss Ephemeris wrapper
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Download pinned Swiss long-range ephemerides
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/sweph
          SWISS_COMMIT=9083a12d59e98034fb2337061481ac8800c16e64
          for file in sepl_36.se1 semo_36.se1; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/aloistr/swisseph/${SWISS_COMMIT}/ephe/${file}" \
              -o "tmp/sweph/${file}"
          done
          cat <<'EOF' | sha256sum -c -
          3faeadb0f2c04d455ce8c5a853d007e9b445e1dc7b65a43389fc3d746b7b9bd0  tmp/sweph/sepl_36.se1
          f4e89fb3f69a337249ccff96d3f565baa8986a7c15e44cba5676d5dbdf00dfaa  tmp/sweph/semo_36.se1
          EOF
      - name: Capture empirical year-4006 residual slopes
        env:
          SWISSEPH_EPHE_PATH: tmp/sweph
          OUTPUT_DIR: tmp/eot-residual-derivative-4006
        run: node scripts/research-eot-residual-derivative-4006.mjs
      - name: Upload derivative reconnaissance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eot-residual-derivative-4006
          path: tmp/eot-residual-derivative-4006/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

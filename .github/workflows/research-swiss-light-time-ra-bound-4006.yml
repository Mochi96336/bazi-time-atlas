name: Research Swiss light-time RA bound 4006

on:
  pull_request:
    paths:
      - ".github/workflows/research-swiss-light-time-ra-bound-4006.yml"
      - "scripts/research-swiss-light-time-precessed-ra-samples-4006.c"
      - "scripts/compose-swiss-light-time-ra-bound-4006.mjs"
      - "src/astronomy/equation-of-time-4006-swiss-segment-curvature-evidence.js"
      - "src/astronomy/equation-of-time-4006-swiss-vondrak-precession-evidence.js"
      - "src/astronomy/equation-of-time-4006-swiss-ra-frame-correction-evidence.js"
      - "src/astronomy/equation-of-time-4006-swiss-light-time-ra-evidence.js"
      - "tests/equation-of-time-4006-swiss-light-time-ra-evidence.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  light-time-ra-bound:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fetch pinned Swiss Ephemeris source
        shell: bash
        run: |
          set -euo pipefail
          SWISS_COMMIT=9083a12d59e98034fb2337061481ac8800c16e64
          mkdir -p tmp/swisseph
          git -C tmp/swisseph init
          git -C tmp/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C tmp/swisseph fetch --depth=1 origin "$SWISS_COMMIT"
          git -C tmp/swisseph checkout --detach FETCH_HEAD
          test "$(git -C tmp/swisseph rev-parse HEAD)" = "$SWISS_COMMIT"

      - name: Audit pinned geocentric Sun light-time structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path("tmp/swisseph/sweph.c").read_text()
          start = s.index("static int app_pos_etc_sun(int32 iflag, char *serr)\n{")
          end = s.index("static int app_pos_etc_moon", start)
          f = s[start:end]
          required = [
              "niter = 1;\t/* # of iterations */",
              "dt = sqrt(square_sum(dx)) * AUNIT / CLIGHT / 86400.0;",
              "retc = sweph(t, SEI_SUNBARY, SEI_FILE_PLANET, iflag, NULL, NO_SAVE, xsun, serr);",
              "xx[i] = xearth[i];",
              "xx[i] -= xsun[i];",
              "swi_aberr_light(xx, xobs, iflag);",
              "swi_precess(xx, pedp->teval, iflag, J2000_TO_J);",
          ]
          for fragment in required:
              if fragment not in f:
                  raise SystemExit(f"pinned Sun light-time structure changed: {fragment}")
          if f.count("for (j = 0; j <= niter; j++)") != 1:
              raise SystemExit("unexpected Sun light-time iteration-loop count")
          PY

      - name: Download pinned Swiss long-range ephemerides
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/sweph
          SWISS_COMMIT=9083a12d59e98034fb2337061481ac8800c16e64
          for file in sepl_36.se1 semo_36.se1; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/aloistr/swisseph/${SWISS_COMMIT}/ephe/${file}" \
              -o "tmp/sweph/${file}"
          done
          cat <<'EOF' | sha256sum -c -
          3faeadb0f2c04d455ce8c5a853d007e9b445e1dc7b65a43389fc3d746b7b9bd0  tmp/sweph/sepl_36.se1
          f4e89fb3f69a337249ccff96d3f565baa8986a7c15e44cba5676d5dbdf00dfaa  tmp/sweph/semo_36.se1
          EOF

      - name: Build pinned Swiss library and light-time sampler
        shell: bash
        run: |
          set -euo pipefail
          make -C tmp/swisseph libswe.a
          mkdir -p tmp/swiss-light-time-ra-bound-4006
          cc -O2 -std=gnu11 \
            -I tmp/swisseph \
            scripts/research-swiss-light-time-precessed-ra-samples-4006.c \
            tmp/swisseph/libswe.a -lm \
            -o tmp/swiss-light-time-ra-bound-4006/sample

      - name: Capture exact pinned two-pass light-time samples
        shell: bash
        run: |
          set -euo pipefail
          tmp/swiss-light-time-ra-bound-4006/sample tmp/sweph \
            | tee tmp/swiss-light-time-ra-bound-4006/raw.json
          python -m json.tool tmp/swiss-light-time-ra-bound-4006/raw.json >/dev/null

      - name: Compose continuous two-pass light-time RA certificate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compose-swiss-light-time-ra-bound-4006.mjs
          python -m json.tool tmp/swiss-light-time-ra-bound-4006/manifest.json >/dev/null

      - name: Verify proof scope and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          raw = json.loads(Path("tmp/swiss-light-time-ra-bound-4006/raw.json").read_text())
          m = json.loads(Path("tmp/swiss-light-time-ra-bound-4006/manifest.json").read_text())

          assert raw["targetYear"] == 4006
          assert raw["sampleStepEtDays"] <= 0.25
          assert raw["sampleCoverRadiusEtDays"] <= 0.125
          assert 0 < raw["lightTimeDaysPerAu"] < 0.01
          assert raw["minSampledLightTimePrecessedXyAu"] > 0
          r = raw["interpretation"]
          assert r["uniformEtGrid"] is True
          assert r["swissTwoPassSunLightTimeEnabled"] is True
          assert r["annualAberrationDisabled"] is True
          assert r["nutationDisabled"] is True
          assert r["vondrakPrecessionEnabled"] is True
          assert r["gridMinimumIsContinuousLowerBound"] is False
          assert r["continuousRaCurvatureCertified"] is False

          rt = m["retardedTimeHardBounds"]
          assert rt["tau0MaxDays"] > 0
          assert rt["tau1MaxDays"] > 0
          assert rt["firstRetardedDistanceLowerAu"] > 0
          assert rt["retardedSunDomainStartEtJd"] >= rt["inspectedSunSegmentStartEtJd"]
          hard = m["derivedHardBounds"]
          assert hard["lightTimeGeometricVelocityAuPerDay"] > 0
          assert hard["lightTimeGeometricAccelerationAuPerDaySquared"] > 0
          assert hard["hardLightTimePrecessedXyLowerAu"] > 0
          assert hard["lightTimePrecessedRaSecondDerivativeBoundDegPerDaySquared"] > 0

          i = m["interpretation"]
          assert i["sourceDerivedContinuousBound"] is True
          assert i["correctedRaFrameEvidenceRequired"] is True
          assert i["swissTwoPassSunLightTimeCertified"] is True
          assert i["retardedTimeDerivativeBoundsAnalytic"] is True
          assert i["retardedSunSegmentDomainCertified"] is True
          assert i["vondrakPrecessionMatrixCertified"] is True
          assert i["lightTimePrecessedXySeparationContinuous"] is True
          assert i["lightTimePrecessedRaSecondDerivativeCertified"] is True
          assert i["annualAberrationCertified"] is False
          assert i["gravitationalDeflectionCertified"] is False
          assert i["nutationCertified"] is False
          assert i["apparentPositionCorrectionChainCertified"] is False
          assert i["longTermSiderealSecondDerivativeCertified"] is False
          assert i["swissEotSecondDerivativeCertified"] is False
          assert i["continuousResidualUpperBound"] is False
          assert i["deterministicMembership"] is False
          assert i["recurrenceAuthorityGranted"] is False
          PY

      - name: Upload source-derived light-time evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiss-light-time-ra-bound-4006
          path: |
            tmp/swiss-light-time-ra-bound-4006/raw.json
            tmp/swiss-light-time-ra-bound-4006/manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

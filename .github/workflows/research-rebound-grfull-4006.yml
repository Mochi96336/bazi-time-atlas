name: Research GR full 4006 checkpoint

on:
  pull_request:
    paths:
      - ".github/workflows/research-rebound-grfull-4006.yml"
      - "scripts/research-rebound-grfull-4006.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dynamics stack
        run: python -m pip install --disable-pip-version-check "rebound==5.2.2" "reboundx==5.1.0" "jplephem==2.24" "numpy<3"

      - name: Download official DE441 part 2 kernel
        env:
          KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
        run: |
          mkdir -p tmp/rebound-grfull-4006
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/rebound-grfull-4006/de441_part-2.bsp \
            "$KERNEL_URL"
          printf '%s  %s\n' \
            'ad8dfa4e505ef0e3a5d587a5b4705632' \
            'tmp/rebound-grfull-4006/de441_part-2.bsp' | md5sum --check -

      - name: Compare approximate and full 1PN at year 4006
        run: |
          python scripts/research-rebound-grfull-4006.py \
            --kernel tmp/rebound-grfull-4006/de441_part-2.bsp \
            --output tmp/rebound-grfull-4006/result.json

      - name: Verify research-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("tmp/rebound-grfull-4006/result.json").read_text())
          assert r["researchOnly"] is True
          assert r["sourceEphemeris"] == "DE441"
          assert r["integrator"] == "IAS15"
          assert r["catalogueYears"] == [4006]
          assert r["productionAuthorityGranted"] is False
          assert len(r["comparisons"]) == 3
          print(json.dumps({
              "maxApproximateDirectionErrorArcsec": r["maxApproximateDirectionErrorArcsec"],
              "maxFullDirectionErrorArcsec": r["maxFullDirectionErrorArcsec"],
          }, indent=2))
          PY

      - name: Remove large source kernel
        if: always()
        run: rm -f tmp/rebound-grfull-4006/de441_part-2.bsp

      - name: Upload compact result
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: rebound-grfull-4006
          path: tmp/rebound-grfull-4006/result.json
          if-no-files-found: error
          retention-days: 7

name: Research year-26026 seasonal day-boundary triage

on:
  pull_request:
    paths:
      - ".github/workflows/research-rebound-26026-seasonal-triage.yml"
      - "scripts/research-solve-rebound-26026-seasonal-triage.mjs"
      - "scripts/research-rebound-26026-massloss-state.py"
      - "scripts/research-swiss-owen-frame-probe.c"
      - "src/astronomy/absolute-state-seasonal-solver.js"
      - "src/astronomy/naif-tt-tdb-time-bridge.js"
      - "src/astronomy/horizons-sun-apparent-direction-proof.js"
      - "src/astronomy/owen-horizons-frame-proof-contract.js"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Reuse merged #569 orbital-state evidence when available
        id: reuse_state
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11840619960"
          EXPECTED_RESULT_SHA256: "9a2e58dd97202c47765a2235105035322f3cef33cdfac8f6d761def0d45ebb2a"
        run: |
          set -euo pipefail
          mkdir -p tmp/rebound-26026-state
          curl --fail --location --retry 3 --retry-all-errors             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             --output tmp/rebound-26026-state.zip
          unzip -q tmp/rebound-26026-state.zip -d tmp/rebound-26026-state
          test -s tmp/rebound-26026-state/result.json
          printf '%s  %s\n'             "$EXPECTED_RESULT_SHA256"             'tmp/rebound-26026-state/result.json' | sha256sum --check -

      - uses: actions/setup-python@v6
        if: steps.reuse_state.outcome != 'success'
        with:
          python-version: "3.12"

      - name: Install fallback projection dependencies
        if: steps.reuse_state.outcome != 'success'
        run: |
          python -m pip install --disable-pip-version-check             "rebound==5.2.2" "reboundx==5.1.0"             "jplephem==2.24" "numpy<3"

      - name: Download DE441 for fallback projection
        if: steps.reuse_state.outcome != 'success'
        env:
          KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
        run: |
          mkdir -p tmp/rebound-26026-state
          curl --fail --location --retry 4 --retry-delay 5             --output tmp/rebound-26026-state/de441_part-2.bsp             "$KERNEL_URL"
          printf '%s  %s\n'             'ad8dfa4e505ef0e3a5d587a5b4705632'             'tmp/rebound-26026-state/de441_part-2.bsp' | md5sum --check -

      - name: Rebuild #569 orbital-state evidence if artifact expired
        if: steps.reuse_state.outcome != 'success'
        run: |
          python scripts/research-rebound-26026-massloss-state.py             --kernel tmp/rebound-26026-state/de441_part-2.bsp             --output tmp/rebound-26026-state/result.json

      - name: Assert source projection boundary
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("tmp/rebound-26026-state/result.json","utf8"));
          if (r.researchOnly !== true) throw new Error("source projection must remain research-only");
          if (r.target?.year !== 26026) throw new Error("wrong source target year");
          if (r.summary?.acceptedAsOrbitalStateProjection !== true) throw new Error("source projection not accepted");
          if (r.claimBoundary?.year26026AbsoluteOrbitalStateProjected !== true) throw new Error("missing projected-state claim");
          if (r.claimBoundary?.year26026Asteroid343Included !== false) throw new Error("triage must start mass-loss-only");
          if (!Array.isArray(r.target?.stateWindows) || r.target.stateWindows.length !== 3) {
            throw new Error("expected three projected state windows");
          }
          NODE

      - name: Fetch pinned Swiss Ephemeris source
        shell: bash
        run: |
          set -euo pipefail
          SWISS_COMMIT=9083a12d59e98034fb2337061481ac8800c16e64
          mkdir -p tmp/swisseph
          git -C tmp/swisseph init
          git -C tmp/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C tmp/swisseph fetch --depth=1 origin "$SWISS_COMMIT"
          git -C tmp/swisseph checkout --detach FETCH_HEAD
          test "$(git -C tmp/swisseph rev-parse HEAD)" = "$SWISS_COMMIT"
          grep -q 'SEMOD_PREC_OWEN_1990' tmp/swisseph/swephlib.c
          grep -q 'psia += -0.000018560' tmp/swisseph/swephlib.c

      - name: Build pinned Owen frame probe
        shell: bash
        run: |
          set -euo pipefail
          make -C tmp/swisseph libswe.a
          cc -O2 -Wall -Wextra             -I tmp/swisseph             scripts/research-swiss-owen-frame-probe.c             tmp/swisseph/libswe.a             -lm -ldl             -o tmp/owen-frame-probe

      - name: Solve three day-boundary triage crossings
        env:
          STATE_PROJECTION_JSON: tmp/rebound-26026-state/result.json
          OWEN_FRAME_PROBE: tmp/owen-frame-probe
          OUTPUT_JSON: tmp/rebound-26026-seasonal-day-boundary-triage.json
        run: node scripts/research-solve-rebound-26026-seasonal-triage.mjs

      - name: Assert research claim boundary
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(
            fs.readFileSync("tmp/rebound-26026-seasonal-day-boundary-triage.json","utf8")
          );
          if (r.researchOnly !== true) throw new Error("triage must remain research-only");
          if (r.catalogueYear !== 26026) throw new Error("wrong catalogue year");
          if (r.validation?.solvedCrossings !== 3) throw new Error("expected three crossings");
          if (!(r.validation.maxRootResidualArcsec < 0.05)) throw new Error("root residual unexpectedly large");
          if (!(r.validation.maxSeedParitySeconds < 5)) throw new Error("alternate-seed parity unexpectedly large");
          if (r.claimBoundary?.solarMassLossIncluded !== true) throw new Error("mass loss must be included");
          if (r.claimBoundary?.asteroid343Included !== false) throw new Error("asteroid343 must remain deferred");
          if (r.claimBoundary?.owenLongTermFrameApplied !== true) throw new Error("Owen frame missing");
          if (r.claimBoundary?.seasonalCrossingsResolved !== true) throw new Error("crossings missing");
          if (r.claimBoundary?.uniformDynamicalTimeDayOnly !== true) throw new Error("must remain a TT-day triage");
          if (r.claimBoundary?.civilTimeResolved !== false) throw new Error("must not claim civil time");
          console.log(JSON.stringify({
            events:r.events.map(e => ({
              name:e.name,
              date:e.prolepticGregorianTt,
              offsetFromWindowCenterHours:e.offsetFromWindowCenterHours
            })),
            triage:r.triage,
            validation:r.validation
          }, null, 2));
          NODE

      - name: Remove fallback DE441 kernel
        if: always()
        run: rm -f tmp/rebound-26026-state/de441_part-2.bsp

      - name: Upload compact triage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebound-26026-seasonal-day-boundary-triage
          path: tmp/rebound-26026-seasonal-day-boundary-triage.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

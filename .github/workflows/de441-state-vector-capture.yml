name: Research DE441 state vector capture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Capture Horizons geometric state vectors
        run: node scripts/research-capture-de441-vectors.mjs
      - name: Upload raw research capture
        uses: actions/upload-artifact@v7
        with:
          name: de441-state-vector-capture
          path: tmp/de441-state-capture/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

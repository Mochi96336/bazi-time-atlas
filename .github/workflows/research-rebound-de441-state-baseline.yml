name: Research REBOUND DE441 state baseline

on:
  pull_request:
    paths:
      - ".github/workflows/research-rebound-de441-state-baseline.yml"
      - "scripts/research-rebound-de441-state-baseline.py"
      - "scripts/research-capture-horizons-n16-j2000.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned research integrator and SPK reader
        run: python -m pip install --disable-pip-version-check "rebound==5.2.2" "reboundx==5.1.0" "jplephem==2.24" "numpy<3"

      - name: Download official DE441 part 2 kernel
        env:
          KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
        run: |
          mkdir -p tmp/rebound-de441
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/rebound-de441/de441_part-2.bsp \
            "$KERNEL_URL"
          printf '%s  %s\n' \
            'ad8dfa4e505ef0e3a5d587a5b4705632' \
            'tmp/rebound-de441/de441_part-2.bsp' | md5sum --check -

      - name: Capture the DE441-era Horizons N16 subset at J2000
        run: |
          python scripts/research-capture-horizons-n16-j2000.py \
            --output tmp/rebound-de441/n16-j2000.json

      - name: Integrate from J2000 and compare with DE441 checkpoints
        run: |
          python scripts/research-rebound-de441-state-baseline.py \
            --kernel tmp/rebound-de441/de441_part-2.bsp \
            --output tmp/rebound-de441/result.json \
            --primary-dt-days 4 \
            --convergence-dt-days 2 \
            --gr-fine-dt-days 1 \
            --gr-ultrafine-dt-days 0.5 \
            --n16-state-json tmp/rebound-de441/n16-j2000.json

      - name: Report research baseline without promoting it
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("tmp/rebound-de441/result.json").read_text())
          assert r["researchOnly"] is True
          assert r["sourceEphemeris"] == "DE441"
          assert r["integrator"] == "WHFast"
          assert r["reboundVersion"] == "5.2.2"
          assert r["reboundxVersion"] == "5.1.0"
          assert r["deepProjection26026"]["status"] == "unvalidated-nbody-state-only"
          assert r["deepProjection26026"]["absoluteSeasonalPhaseResolved"] is False
          assert r["deepProjection26026"]["productionAuthorityGranted"] is False

          for family in ("primary", "convergence", "grPrimary", "grConvergence", "grFine", "grUltrafine", "grIas15", "grFullIas15", "grIas15N16"):
              samples = r[family]
              assert len(samples) == 6
              for sample in samples:
                  assert sample["geocentricSunDirectionErrorArcsec"] >= 0
                  assert sample["geocentricSunPositionErrorKm"] >= 0

          print(json.dumps(r["summary"], indent=2))
          for sample in r["convergence"]:
              print(
                  f"[rebound-state] {sample['year']} {sample['label']}: "
                  f"direction={sample['geocentricSunDirectionErrorArcsec']:.3f} arcsec, "
                  f"geo-pos={sample['geocentricSunPositionErrorKm']:.1f} km, "
                  f"geo-v={sample['geocentricSunVelocityErrorMps']:.4f} m/s"
              )
          for sample in r["convergenceDelta"]:
              print(
                  f"[rebound-convergence] {sample['year']} {sample['label']}: "
                  f"2d-minus-4d direction-error={sample['directionErrorArcsecDifference']:.3f} arcsec, "
                  f"geo-pos-error={sample['geocentricPositionErrorKmDifference']:.1f} km"
              )
          for sample in r["grConvergence"]:
              print(
                  f"[rebound-gr] {sample['year']} {sample['label']}: "
                  f"direction={sample['geocentricSunDirectionErrorArcsec']:.3f} arcsec, "
                  f"geo-pos={sample['geocentricSunPositionErrorKm']:.1f} km, "
                  f"geo-v={sample['geocentricSunVelocityErrorMps']:.4f} m/s"
              )
          for sample in r["grImprovement"]:
              print(
                  f"[rebound-gr-delta] {sample['year']} {sample['label']}: "
                  f"improvement={sample['directionImprovementArcsec']:.3f} arcsec "
                  f"({sample['directionImprovementFraction']*100:.2f}%), "
                  f"geo-pos-improvement={sample['positionImprovementKm']:.1f} km"
              )
          for sample in r["grFine"]:
              print(
                  f"[rebound-gr-fine] {sample['year']} {sample['label']}: "
                  f"direction={sample['geocentricSunDirectionErrorArcsec']:.3f} arcsec, "
                  f"geo-pos={sample['geocentricSunPositionErrorKm']:.1f} km"
              )
          for sample in r["grFineConvergence"]:
              print(
                  f"[rebound-gr-convergence] {sample['year']} {sample['label']}: "
                  f"1d-minus-2d direction-error={sample['directionErrorArcsecDifference']:.3f} arcsec, "
                  f"geo-pos-error={sample['geocentricPositionErrorKmDifference']:.1f} km"
              )
          for sample in r["grUltrafine"]:
              print(
                  f"[rebound-gr-ultrafine] {sample['year']} {sample['label']}: "
                  f"direction={sample['geocentricSunDirectionErrorArcsec']:.3f} arcsec, "
                  f"geo-pos={sample['geocentricSunPositionErrorKm']:.1f} km"
              )
          for sample in r["grUltrafineConvergence"]:
              print(
                  f"[rebound-gr-ultrafine-convergence] {sample['year']} {sample['label']}: "
                  f"0.5d-minus-1d direction-error={sample['directionErrorArcsecDifference']:.3f} arcsec, "
                  f"geo-pos-error={sample['geocentricPositionErrorKmDifference']:.1f} km"
              )
          for sample in r["grIas15"]:
              print(
                  f"[rebound-gr-ias15] {sample['year']} {sample['label']}: "
                  f"direction={sample['geocentricSunDirectionErrorArcsec']:.3f} arcsec, "
                  f"geo-pos={sample['geocentricSunPositionErrorKm']:.1f} km, "
                  f"geo-v={sample['geocentricSunVelocityErrorMps']:.4f} m/s"
              )
          for sample in r["grIas15Comparison"]:
              print(
                  f"[rebound-gr-ias15-delta] {sample['year']} {sample['label']}: "
                  f"IAS15-minus-WHFast0.5d direction={sample['ias15MinusWhfastDirectionErrorArcsec']:.3f} arcsec"
              )
          for sample in r["grFullIas15"]:
              print(
                  f"[rebound-gr-full-ias15] {sample['year']} {sample['label']}: "
                  f"direction={sample['geocentricSunDirectionErrorArcsec']:.3f} arcsec, "
                  f"geo-pos={sample['geocentricSunPositionErrorKm']:.1f} km, "
                  f"geo-v={sample['geocentricSunVelocityErrorMps']:.4f} m/s"
              )
          for sample in r["grFullComparison"]:
              print(
                  f"[rebound-gr-full-delta] {sample['year']} {sample['label']}: "
                  f"full-minus-approx direction={sample['fullMinusApproxDirectionErrorArcsec']:.3f} arcsec"
              )
          for sample in r["grIas15N16"]:
              print(
                  f"[rebound-n16] {sample['year']} {sample['label']}: "
                  f"direction={sample['geocentricSunDirectionErrorArcsec']:.3f} arcsec, "
                  f"geo-pos={sample['geocentricSunPositionErrorKm']:.1f} km, "
                  f"geo-v={sample['geocentricSunVelocityErrorMps']:.4f} m/s"
              )
          for sample in r["n16Comparison"]:
              print(
                  f"[rebound-n16-delta] {sample['year']} {sample['label']}: "
                  f"improvement={sample['directionImprovementArcsec']:.3f} arcsec "
                  f"({sample['directionImprovementFraction']*100:.2f}%), "
                  f"geo-pos-improvement={sample['positionImprovementKm']:.1f} km"
              )
          PY

      - name: Remove large source kernel
        if: always()
        run: rm -f tmp/rebound-de441/de441_part-2.bsp

      - name: Upload compact research result
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: rebound-de441-state-baseline
          path: |
            tmp/rebound-de441/result.json
            tmp/rebound-de441/n16-j2000.json
          if-no-files-found: error
          retention-days: 7

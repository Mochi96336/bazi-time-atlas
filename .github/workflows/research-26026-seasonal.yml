name: Research year-26026 seasonal checks

# One workflow for the three year-26026 seasonal checks (full timeline,
# inverse equivalent ellipse, day-boundary triage).
#
# The slow part is projecting the orbital state from the 1.5 GB DE441 kernel
# (7-16 min). Those projections only change when their producer scripts
# change, so the accepted outputs live in scripts/fixtures/research-26026/
# together with the git blob ids of the producers that made them. When the
# producers match, the jobs reuse the committed state; otherwise they rebuild
# it and upload the new state so it can be committed.

on:
  pull_request:
    paths:
      - ".github/workflows/research-26026-seasonal.yml"
      - "scripts/fixtures/research-26026/**"
      - "scripts/research-rebound-de441-state-baseline.py"
      - "scripts/research-rebound-26026-massloss-state.py"
      - "scripts/research-rebound-26026-full-year-state.py"
      - "scripts/research-solve-rebound-26026-full-seasonal-timeline.mjs"
      - "scripts/research-solve-rebound-26026-seasonal-triage.mjs"
      - "scripts/research-render-26026-seasonal-timeline-svg.mjs"
      - "scripts/research-fit-26026-inverse-equivalent-ellipse.py"
      - "scripts/research-swiss-owen-frame-probe.c"
      - "scripts/build-owen-frame-probe.sh"
      - "src/astronomy/absolute-state-seasonal-solver.js"
      - "src/astronomy/naif-tt-tdb-time-bridge.js"
      - "src/astronomy/horizons-sun-apparent-direction-proof.js"
      - "src/astronomy/owen-horizons-frame-proof-contract.js"
      - "src/astronomy/direct-seasonal-event-provider.js"
      - "scripts/prepare-vendor.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-26026-${{ github.ref }}
  cancel-in-progress: true

env:
  FIXTURES: scripts/fixtures/research-26026
  PRODUCERS: >-
    scripts/research-rebound-26026-full-year-state.py
    scripts/research-rebound-26026-massloss-state.py
    scripts/research-rebound-de441-state-baseline.py
  KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
  KERNEL_MD5: ad8dfa4e505ef0e3a5d587a5b4705632
  SWISS_COMMIT: 9083a12d59e98034fb2337061481ac8800c16e64

jobs:
  # Full-year state -> 360-point timeline -> inverse equivalent ellipse.
  timeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run vendor:prepare
          python -m pip install --disable-pip-version-check \
            "rebound==5.2.2" "reboundx==5.1.0" "jplephem==2.24" "numpy<3"
          python -m py_compile $PRODUCERS \
            scripts/research-fit-26026-inverse-equivalent-ellipse.py

      - name: Reuse committed state when its producers are unchanged
        id: state
        run: |
          mkdir -p tmp/26026
          git ls-tree HEAD -- $PRODUCERS > tmp/26026/producers.txt
          if cmp -s tmp/26026/producers.txt "$FIXTURES/producers.txt" && test -s "$FIXTURES/full-year-state.json"; then
            cp "$FIXTURES/full-year-state.json" tmp/26026/state.json
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Producers unchanged: reusing committed full-year state."
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Producers changed: rebuilding full-year state from DE441."
            diff "$FIXTURES/producers.txt" tmp/26026/producers.txt || true
          fi

      - name: Rebuild full-year state from DE441
        if: steps.state.outputs.rebuild == 'true'
        timeout-minutes: 45
        run: |
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/26026/de441_part-2.bsp "$KERNEL_URL"
          echo "$KERNEL_MD5  tmp/26026/de441_part-2.bsp" | md5sum --check -
          python scripts/research-rebound-26026-full-year-state.py \
            --kernel tmp/26026/de441_part-2.bsp \
            --output tmp/26026/state.json
          rm -f tmp/26026/de441_part-2.bsp

      - name: Assert continuous state regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("tmp/26026/state.json").read_text())
          assert r["researchOnly"] is True
          assert r["catalogueYear"] == 26026
          assert r["validation"]["accepted"] is True
          assert r["validation"]["maxPinnedCheckpointDriftArcsec"] <= 0.05
          assert len(r["validation"]["checkpoints"]) == 3
          assert r["stateWindow"]["stepDays"] == 0.5
          assert r["stateWindow"]["sampleCount"] > 800
          assert r["claimBoundary"]["continuousCatalogueYearStateProjected"] is True
          assert r["claimBoundary"]["asteroid343Included"] is False
          print(json.dumps({
              "validation": r["validation"],
              "sampleCount": r["stateWindow"]["sampleCount"],
          }, indent=2))
          PY

      - name: Build pinned Owen frame probe
        run: bash scripts/build-owen-frame-probe.sh tmp/owen-frame-probe

      - name: Solve all 360 integer-longitude crossings
        env:
          STATE_PROJECTION_JSON: tmp/26026/state.json
          OWEN_FRAME_PROBE: tmp/owen-frame-probe
          OUTPUT_JSON: tmp/26026/timeline.json
        run: node scripts/research-solve-rebound-26026-full-seasonal-timeline.mjs

      - name: Assert 24-term and 360-point timeline
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("tmp/26026/timeline.json", "utf8"));
          if (r.researchOnly !== true) throw new Error("timeline must remain research-only");
          if (r.sampling?.crossingCount !== 360) throw new Error("expected 360 crossings");
          if (r.sampling?.namedTermCount !== 24) throw new Error("expected 24 named terms");
          if (r.terms?.length !== 24) throw new Error("24-term output missing");
          if (r.curve?.length !== 360) throw new Error("360-point curve missing");
          if (!(r.validation.maxRegressionSeconds <= 5)) throw new Error("#571 regression gate failed");
          if (r.summary?.allSampledLongitudesMoreThanOneDayFromGregorianCycle !== true) {
            throw new Error("some sampled longitude is within one day of Gregorian closure");
          }
          if (!(r.summary.minDriftDays < r.summary.maxDriftDays)) throw new Error("timeline drift range collapsed");
          if (r.claimBoundary?.asteroid343Included !== false) throw new Error("asteroid343 must remain deferred");
          if (r.claimBoundary?.civilTimeResolved !== false) throw new Error("timeline must not claim civil time");
          console.log(JSON.stringify({ sampling: r.sampling, summary: r.summary, validation: r.validation }, null, 2));
          NODE

      - name: Render research visual prototypes
        env:
          TIMELINE_JSON: tmp/26026/timeline.json
          CURVE_OVERVIEW_SVG: tmp/26026/seasonal-drift-curve-overview.svg
          CURVE_DETAIL_SVG: tmp/26026/seasonal-drift-curve-detail.svg
          ORBIT_SVG: tmp/26026/seasonal-orbit-overview.svg
        run: |
          node scripts/research-render-26026-seasonal-timeline-svg.mjs
          grep -q '距離 0 天總覽' tmp/26026/seasonal-drift-curve-overview.svg
          grep -q '季節內細節' tmp/26026/seasonal-drift-curve-detail.svg
          grep -q '太陽系俯視概念圖' tmp/26026/seasonal-orbit-overview.svg

      - name: Fit inverse equivalent ellipses
        run: |
          python scripts/research-fit-26026-inverse-equivalent-ellipse.py \
            --timeline tmp/26026/timeline.json \
            --state tmp/26026/state.json \
            --output tmp/26026/inverse-ellipse.json

      - name: Assert inverse-fit research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("tmp/26026/inverse-ellipse.json").read_text())
          assert r["researchOnly"] is True
          assert r["summary"]["accepted"] is True
          assert 0.016 < r["summary"]["baselineEquivalentEccentricity"] < 0.0175
          assert 0.0025 < r["summary"]["targetEquivalentEccentricity"] < 0.0035
          assert r["inverseValidationAgainstTargetState"]["radiusProfileCorrelation"] > 0.99
          assert r["inverseValidationAgainstTargetState"]["perihelionDifferenceDegrees"] < 1.0
          assert r["summary"]["oneHarmonicExplainedVariance"] > 0.999
          assert r["summary"]["oneHarmonicRmsResidualMinutes"] < 30
          assert r["summary"]["twoHarmonicRmsResidualMinutes"] < 5
          assert r["claimBoundary"]["trueOsculatingElementsClaimed"] is False
          assert r["claimBoundary"]["twoBodyExactnessClaimed"] is False
          assert r["visualizationMorphContract"]["phaseMustRemainSeparateFromEllipseShape"] is True
          assert r["visualizationMorphContract"]["physicalIntermediateYearsClaimed"] is False
          assert len(r["visualizationMorphContract"]["keyframes"]) == 5
          print(json.dumps({
              "summary": r["summary"],
              "inverseValidation": r["inverseValidationAgainstTargetState"],
          }, indent=2))
          PY

      - name: Upload timeline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-26026-timeline
          path: |
            tmp/26026/producers.txt
            tmp/26026/state.json
            tmp/26026/timeline.json
            tmp/26026/inverse-ellipse.json
            tmp/26026/*.svg
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

  # Mass-loss state windows -> three day-boundary crossings.
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Prepare pinned Tyme modern baseline
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run vendor:prepare

      - name: Reuse committed state when its producers are unchanged
        id: state
        run: |
          mkdir -p tmp/26026
          git ls-tree HEAD -- $PRODUCERS > tmp/26026/producers.txt
          if cmp -s tmp/26026/producers.txt "$FIXTURES/producers.txt" && test -s "$FIXTURES/massloss-state.json"; then
            cp "$FIXTURES/massloss-state.json" tmp/26026/result.json
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Producers unchanged: reusing committed mass-loss state."
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Producers changed or state missing: rebuilding mass-loss state from DE441."
          fi

      - uses: actions/setup-python@v7
        if: steps.state.outputs.rebuild == 'true'
        with:
          python-version: "3.12"

      - name: Rebuild mass-loss state from DE441
        if: steps.state.outputs.rebuild == 'true'
        timeout-minutes: 45
        run: |
          python -m pip install --disable-pip-version-check \
            "rebound==5.2.2" "reboundx==5.1.0" "jplephem==2.24" "numpy<3"
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/26026/de441_part-2.bsp "$KERNEL_URL"
          echo "$KERNEL_MD5  tmp/26026/de441_part-2.bsp" | md5sum --check -
          python scripts/research-rebound-26026-massloss-state.py \
            --kernel tmp/26026/de441_part-2.bsp \
            --output tmp/26026/result.json
          rm -f tmp/26026/de441_part-2.bsp

      - name: Assert source projection boundary
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("tmp/26026/result.json", "utf8"));
          if (r.researchOnly !== true) throw new Error("source projection must remain research-only");
          if (r.target?.year !== 26026) throw new Error("wrong source target year");
          if (r.summary?.acceptedAsOrbitalStateProjection !== true) throw new Error("source projection not accepted");
          if (r.claimBoundary?.year26026AbsoluteOrbitalStateProjected !== true) throw new Error("missing projected-state claim");
          if (r.claimBoundary?.year26026Asteroid343Included !== false) throw new Error("triage must start mass-loss-only");
          if (!Array.isArray(r.target?.stateWindows) || r.target.stateWindows.length !== 3) {
            throw new Error("expected three projected state windows");
          }
          NODE

      - name: Build pinned Owen frame probe
        run: bash scripts/build-owen-frame-probe.sh tmp/owen-frame-probe

      - name: Solve three day-boundary triage crossings
        env:
          STATE_PROJECTION_JSON: tmp/26026/result.json
          OWEN_FRAME_PROBE: tmp/owen-frame-probe
          OUTPUT_JSON: tmp/26026/day-boundary-triage.json
        run: node scripts/research-solve-rebound-26026-seasonal-triage.mjs

      - name: Assert research claim boundary
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("tmp/26026/day-boundary-triage.json", "utf8"));
          if (r.researchOnly !== true) throw new Error("triage must remain research-only");
          if (r.catalogueYear !== 26026) throw new Error("wrong catalogue year");
          if (r.validation?.solvedCrossings !== 3) throw new Error("expected three crossings");
          if (!(r.validation.maxRootResidualArcsec < 0.05)) throw new Error("root residual unexpectedly large");
          if (!(r.validation.maxSeedParitySeconds < 5)) throw new Error("alternate-seed parity unexpectedly large");
          if (r.claimBoundary?.solarMassLossIncluded !== true) throw new Error("mass loss must be included");
          if (r.claimBoundary?.asteroid343Included !== false) throw new Error("asteroid343 must remain deferred");
          if (r.claimBoundary?.owenLongTermFrameApplied !== true) throw new Error("Owen frame missing");
          if (r.claimBoundary?.seasonalCrossingsResolved !== true) throw new Error("crossings missing");
          if (r.claimBoundary?.uniformDynamicalTimeDayOnly !== true) throw new Error("must remain a TT-day triage");
          if (r.claimBoundary?.civilTimeResolved !== false) throw new Error("must not claim civil time");
          if (r.triage?.allThreeCrossingsMoreThanOneDayFromGregorianCycle !== true) {
            throw new Error("day-level Gregorian recurrence was not decisively separated");
          }
          if (!(r.triage.minAbsGregorianCycleDriftHours > 24)) {
            throw new Error("minimum Gregorian-cycle drift must exceed one day");
          }
          console.log(JSON.stringify({ triage: r.triage, validation: r.validation }, null, 2));
          NODE

      - name: Upload triage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-26026-triage
          path: |
            tmp/26026/producers.txt
            tmp/26026/result.json
            tmp/26026/day-boundary-triage.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

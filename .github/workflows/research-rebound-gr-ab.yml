name: Research REBOUND GR A-B

on:
  pull_request:
    paths:
      - ".github/workflows/research-rebound-gr-ab.yml"
      - "scripts/research-rebound-de441-state-baseline.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned research dynamics stack
        run: |
          python -m pip install --disable-pip-version-check             "rebound==5.2.2" "reboundx==5.1.0" "jplephem==2.24" "numpy<3"

      - name: Download official DE441 part 2 kernel
        env:
          KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
        run: |
          mkdir -p tmp/rebound-gr
          curl --fail --location --retry 4 --retry-delay 5             --output tmp/rebound-gr/de441_part-2.bsp             "$KERNEL_URL"
          printf '%s  %s
'             'ad8dfa4e505ef0e3a5d587a5b4705632'             'tmp/rebound-gr/de441_part-2.bsp' | md5sum --check -

      - name: Run Newtonian control
        run: |
          python scripts/research-rebound-de441-state-baseline.py             --kernel tmp/rebound-gr/de441_part-2.bsp             --output tmp/rebound-gr/newtonian.json             --primary-dt-days 2             --convergence-dt-days 2             --relativity none

      - name: Run REBOUNDx gr treatment
        run: |
          python scripts/research-rebound-de441-state-baseline.py             --kernel tmp/rebound-gr/de441_part-2.bsp             --output tmp/rebound-gr/gr.json             --primary-dt-days 2             --convergence-dt-days 2             --relativity gr

      - name: Compare GR against Newtonian baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          n = json.loads(Path("tmp/rebound-gr/newtonian.json").read_text())
          g = json.loads(Path("tmp/rebound-gr/gr.json").read_text())
          assert n["relativity"] == "none"
          assert g["relativity"] == "gr"
          assert g["model"]["generalRelativityIncluded"] is True
          assert g["deepProjection26026"]["productionAuthorityGranted"] is False

          n_by = {(x["year"], x["label"]): x for x in n["convergence"]}
          g_by = {(x["year"], x["label"]): x for x in g["convergence"]}
          rows = []
          for key in sorted(n_by):
              before = n_by[key]["geocentricSunDirectionErrorArcsec"]
              after = g_by[key]["geocentricSunDirectionErrorArcsec"]
              rows.append((key, before, after, after-before))
              print(
                  f"[rebound-gr] {key[0]} {key[1]}: "
                  f"Newtonian={before:.3f} arcsec, GR={after:.3f} arcsec, "
                  f"delta={after-before:+.3f} arcsec"
              )

          for year in (4006, 10026):
              subset = [r for r in rows if r[0][0] == year]
              before = sum(r[1] for r in subset) / len(subset)
              after = sum(r[2] for r in subset) / len(subset)
              print(
                  f"[rebound-gr-summary] {year}: "
                  f"mean direction error {before:.3f} -> {after:.3f} arcsec "
                  f"({(after/before-1)*100:+.2f}%)"
              )
          PY

      - name: Remove large source kernel
        if: always()
        run: rm -f tmp/rebound-gr/de441_part-2.bsp

      - name: Upload compact A-B evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: rebound-gr-ab
          path: |
            tmp/rebound-gr/newtonian.json
            tmp/rebound-gr/gr.json
          if-no-files-found: error
          retention-days: 7

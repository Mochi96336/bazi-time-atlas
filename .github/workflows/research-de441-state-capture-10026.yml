name: Research DE441 10026 state capture

on:
  pull_request:
    paths:
      - ".github/workflows/research-de441-state-capture-10026.yml"
      - "scripts/research-capture-de441-10026-spk.py"
      - "src/astronomy/de441-10026-state-capture-contract.js"
      - "tests/de441-10026-state-capture-contract.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned SPK reader
        run: python -m pip install --disable-pip-version-check "jplephem==2.24"

      - name: Download official DE441 part 2 kernel
        env:
          KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
        run: |
          mkdir -p tmp/de441-10026
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/de441-10026/de441_part-2.bsp \
            "$KERNEL_URL"
          printf '%s  %s\n' \
            'ad8dfa4e505ef0e3a5d587a5b4705632' \
            'tmp/de441-10026/de441_part-2.bsp' | md5sum --check -

      - name: Capture 10026 DE441 state truth
        run: |
          python scripts/research-capture-de441-10026-spk.py \
            --kernel tmp/de441-10026/de441_part-2.bsp \
            --output-dir tmp/de441-10026/capture

      - name: Verify claim boundary and compact output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("tmp/de441-10026/capture/manifest.json").read_text())
          assert manifest["authority"] == "NASA/JPL NAIF"
          assert manifest["sourceEphemeris"] == "DE441"
          assert manifest["catalogueYear"] == 10026
          assert manifest["sourceKernel"]["officialMd5"] == "ad8dfa4e505ef0e3a5d587a5b4705632"
          assert manifest["sourceKernel"]["observedMd5"] == manifest["sourceKernel"]["officialMd5"]
          assert manifest["capture"]["bytes"] < 1_000_000
          claim = manifest["claimBoundary"]
          assert claim["absoluteStateCaptured"] is True
          assert claim["stateInterpolationValidated"] is True
          assert claim["meanEclipticOfDateTransformResolved"] is False
          assert claim["apparentSeasonalCrossingResolved"] is False
          assert claim["civilTimeResolved"] is False
          assert claim["productionIntegrated"] is False
          print(json.dumps(manifest["validation"], indent=2))
          PY

      - name: Remove large source kernel before artifact upload
        if: always()
        run: rm -f tmp/de441-10026/de441_part-2.bsp

      - name: Upload compact research evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: de441-10026-state-capture
          path: tmp/de441-10026/capture/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

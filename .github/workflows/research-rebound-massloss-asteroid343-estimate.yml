name: Research mass-loss plus asteroid343 additive estimate

on:
  pull_request:
    paths:
      - ".github/workflows/research-rebound-massloss-asteroid343-estimate.yml"
      - "scripts/research-rebound-massloss-asteroid343-estimate.py"
      - "tests/fixtures/rebound-asteroid343-differential-10026.json"
      - "scripts/research-rebound-de441-state-baseline.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check "rebound==5.2.2" "reboundx==5.1.0" "jplephem==2.24" "numpy<3"

      - name: Compile estimator
        run: python -m py_compile scripts/research-rebound-massloss-asteroid343-estimate.py

      - name: Download official DE441 positive-time kernel
        env:
          KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
        run: |
          mkdir -p tmp/rebound-final-estimate
          curl --fail --location --retry 4 --retry-delay 5 \
            --output tmp/rebound-final-estimate/de441_part-2.bsp \
            "$KERNEL_URL"
          printf '%s  %s\n' \
            'ad8dfa4e505ef0e3a5d587a5b4705632' \
            'tmp/rebound-final-estimate/de441_part-2.bsp' | md5sum --check -

      - name: Run final year-10026 research estimate
        run: |
          python scripts/research-rebound-massloss-asteroid343-estimate.py \
            --kernel tmp/rebound-final-estimate/de441_part-2.bsp \
            --fixture tests/fixtures/rebound-asteroid343-differential-10026.json \
            --output tmp/rebound-final-estimate/result.json

      - name: Assert estimate boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("tmp/rebound-final-estimate/result.json").read_text())
          assert r["researchOnly"] is True
          assert r["summary"]["acceptedAsResearchEstimate"] is True
          assert r["summary"]["maxMassLossRegressionArcsec"] <= 0.002
          assert r["summary"]["maxCombinedDt2MinusDt4Arcsec"] <= 0.005
          assert r["claimBoundary"]["full343AdditivityDirectlyValidatedAt4006"] is True
          assert r["claimBoundary"]["n16AdditivityDirectlyValidatedAt10026"] is True
          assert r["claimBoundary"]["full343MassLossInteractionDirectlyValidatedAt10026"] is False
          assert r["claimBoundary"]["year26026Resolved"] is False
          assert r["claimBoundary"]["productionAuthorityGranted"] is False
          print(json.dumps(r["summary"], indent=2))
          PY

      - name: Remove large source kernel
        if: always()
        run: rm -f tmp/rebound-final-estimate/de441_part-2.bsp

      - name: Upload compact final estimate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebound-massloss-asteroid343-estimate
          path: tmp/rebound-final-estimate/result.json
          if-no-files-found: warn
          retention-days: 14

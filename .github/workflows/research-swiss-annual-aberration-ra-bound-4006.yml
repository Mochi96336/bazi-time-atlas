name: Research Swiss annual aberration RA bound 4006

on:
  pull_request:
    paths:
      - ".github/workflows/research-swiss-annual-aberration-ra-bound-4006.yml"
      - "scripts/research-swiss-aberration-precessed-ra-samples-4006.c"
      - "scripts/compose-swiss-annual-aberration-ra-bound-4006.mjs"
      - "src/astronomy/equation-of-time-4006-swiss-segment-curvature-evidence.js"
      - "src/astronomy/equation-of-time-4006-swiss-vondrak-precession-evidence.js"
      - "src/astronomy/equation-of-time-4006-swiss-light-time-ra-evidence.js"
      - "src/astronomy/equation-of-time-4006-swiss-annual-aberration-ra-evidence.js"
      - "tests/equation-of-time-4006-swiss-annual-aberration-ra-evidence.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annual-aberration-ra-bound:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fetch pinned Swiss Ephemeris source
        shell: bash
        run: |
          set -euo pipefail
          SWISS_COMMIT=9083a12d59e98034fb2337061481ac8800c16e64
          mkdir -p tmp/swisseph
          git -C tmp/swisseph init
          git -C tmp/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C tmp/swisseph fetch --depth=1 origin "$SWISS_COMMIT"
          git -C tmp/swisseph checkout --detach FETCH_HEAD
          test "$(git -C tmp/swisseph rev-parse HEAD)" = "$SWISS_COMMIT"

      - name: Audit pinned annual aberration formula and Sun ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path("tmp/swisseph/sweph.c").read_text()
          required = [
              "static void aberr_light(double *xx, double *xe)",
              "v[i] = xe[i+3] / 24.0 / 3600.0 / CLIGHT * AUNIT;",
              "v2 = square_sum(v);",
              "b_1 = sqrt(1 - v2);",
              "f1 = dot_prod(u, v) / ru;",
              "f2 = 1.0 + f1 / (1.0 + b_1);",
              "xx[i] = (b_1*xx[i] + f2*ru*v[i]) / (1.0 + f1);",
          ]
          for fragment in required:
              if fragment not in s:
                  raise SystemExit(f"pinned aberration formula changed: {fragment}")
          start = s.index("static int app_pos_etc_sun(int32 iflag, char *serr)\n{")
          end = s.index("static int app_pos_etc_moon", start)
          sun = s[start:end]
          aberr = sun.index("swi_aberr_light(xx, xobs, iflag);")
          precess = sun.index("swi_precess(xx, pedp->teval, iflag, J2000_TO_J);")
          if not aberr < precess:
              raise SystemExit("annual aberration no longer precedes precession in pinned Sun path")
          PY

      - name: Download pinned Swiss long-range ephemerides
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/sweph
          SWISS_COMMIT=9083a12d59e98034fb2337061481ac8800c16e64
          for file in sepl_36.se1 semo_36.se1; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/aloistr/swisseph/${SWISS_COMMIT}/ephe/${file}" \
              -o "tmp/sweph/${file}"
          done
          cat <<'EOF' | sha256sum -c -
          3faeadb0f2c04d455ce8c5a853d007e9b445e1dc7b65a43389fc3d746b7b9bd0  tmp/sweph/sepl_36.se1
          f4e89fb3f69a337249ccff96d3f565baa8986a7c15e44cba5676d5dbdf00dfaa  tmp/sweph/semo_36.se1
          EOF

      - name: Build pinned Swiss library and aberration sampler
        shell: bash
        run: |
          set -euo pipefail
          make -C tmp/swisseph libswe.a
          mkdir -p tmp/swiss-annual-aberration-ra-bound-4006
          cc -O2 -std=gnu11 \
            -I tmp/swisseph \
            scripts/research-swiss-aberration-precessed-ra-samples-4006.c \
            tmp/swisseph/libswe.a -lm \
            -o tmp/swiss-annual-aberration-ra-bound-4006/sample

      - name: Capture exact pinned aberration samples and jerk envelopes
        shell: bash
        run: |
          set -euo pipefail
          tmp/swiss-annual-aberration-ra-bound-4006/sample tmp/sweph \
            | tee tmp/swiss-annual-aberration-ra-bound-4006/raw.json
          python -m json.tool tmp/swiss-annual-aberration-ra-bound-4006/raw.json >/dev/null

      - name: Compose continuous annual aberration RA certificate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compose-swiss-annual-aberration-ra-bound-4006.mjs
          python -m json.tool tmp/swiss-annual-aberration-ra-bound-4006/manifest.json >/dev/null

      - name: Verify proof scope and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          raw = json.loads(Path("tmp/swiss-annual-aberration-ra-bound-4006/raw.json").read_text())
          m = json.loads(Path("tmp/swiss-annual-aberration-ra-bound-4006/manifest.json").read_text())
          assert raw["targetYear"] == 4006
          assert raw["sampleStepEtDays"] <= 0.25
          assert raw["sampleCoverRadiusEtDays"] <= 0.125
          assert raw["minSampledAberrationPrecessedXyAu"] > 0
          for body in raw["bodies"].values():
              assert body["maxJerkBoundAuPerDayCubed"] >= 0
          r = raw["interpretation"]
          assert r["annualAberrationEnabled"] is True
          assert r["nutationDisabled"] is True
          assert r["gridMinimumIsContinuousLowerBound"] is False

          a = m["aberrationDimensionlessHardBounds"]
          assert a["betaNorm"] > 0
          assert a["denominatorLower"] > 0
          assert a["correctionDirectionNorm"] >= 0
          hard = m["derivedHardBounds"]
          assert hard["hardAberrationPrecessedXyLowerAu"] > 0
          assert hard["aberrationPrecessedRaSecondDerivativeBoundDegPerDaySquared"] > 0
          assert m["planning"]["thresholdRemainingAfterAberrationPrecessedBoundDegPerDaySquared"] > 0

          i = m["interpretation"]
          assert i["sourceDerivedContinuousBound"] is True
          assert i["earthJerkFromChebyshevCoefficientsCertified"] is True
          assert i["annualAberrationFormulaSourceAudited"] is True
          assert i["annualAberrationIntervalJetCertified"] is True
          assert i["annualAberrationCertified"] is True
          assert i["aberrationPrecessedRaSecondDerivativeCertified"] is True
          assert i["nutationCertified"] is False
          assert i["apparentPositionCorrectionChainCertified"] is False
          assert i["longTermSiderealSecondDerivativeCertified"] is False
          assert i["swissEotSecondDerivativeCertified"] is False
          assert i["continuousResidualUpperBound"] is False
          assert i["recurrenceAuthorityGranted"] is False
          PY

      - name: Upload source-derived annual aberration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiss-annual-aberration-ra-bound-4006
          path: |
            tmp/swiss-annual-aberration-ra-bound-4006/raw.json
            tmp/swiss-annual-aberration-ra-bound-4006/manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
